<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Chat - Master Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- PREMIUM THEME VARIABLES --- */
        :root {
            --bg-base: #050505;
            --panel-bg: #121212;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.08);
            --primary: #00d2ff;
            --primary-hover: #3a7bd5;
            --text-main: #f8f9fa;
            --text-muted: #8b929a;
            --danger: #ff4b2b;
            --success: #00b09b;
            --chat-mine: #005c97;
            --chat-theirs: #1f2226;
        }

        body.private-mode {
            --bg-base: #1a0510;
            --panel-bg: #2d0b1c;
            --glass-bg: rgba(255, 20, 147, 0.08);
            --border: rgba(255, 20, 147, 0.2);
            --primary: #ff1493;
            --primary-hover: #ff69b4;
            --chat-mine: #c70055;
            --chat-theirs: #4a152c;
        }

        body {
            margin: 0; font-family: 'Poppins', sans-serif;
            background: var(--bg-base); color: var(--text-main);
            display: flex; justify-content: center; height: 100vh; overflow: hidden;
            transition: background 0.6s ease;
        }

        .app-container {
            width: 100%; max-width: 480px; height: 100%;
            background: var(--panel-bg); display: flex; flex-direction: column;
            position: relative; box-shadow: 0 0 30px rgba(0,0,0,0.8);
            transition: background 0.6s ease;
        }

        /* --- AUTH SCREEN --- */
        #auth-screen { padding: 40px; display: flex; flex-direction: column; justify-content: center; height: 100%; text-align: center; }
        .logo-box { font-size: 3.5rem; color: var(--primary); margin-bottom: 10px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        .input-group { position: relative; margin-bottom: 15px; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .auth-input { width: 100%; padding: 15px 15px 15px 45px; border-radius: 12px; background: var(--glass-bg); border: 1px solid var(--border); color: white; outline: none; box-sizing: border-box; transition: 0.3s; }
        .auth-input:focus { border-color: var(--primary); background: rgba(0,0,0,0.4); }
        .btn-main { width: 100%; padding: 15px; border-radius: 12px; border: none; background: linear-gradient(135deg, var(--primary), var(--primary-hover)); color: #fff; font-weight: 600; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-main:hover { transform: translateY(-2px); opacity: 0.9; }
        .auth-links { margin-top: 20px; font-size: 0.9rem; cursor: pointer; color: var(--text-muted); display: flex; justify-content: space-between; }
        .auth-links span:hover { color: var(--primary); }

        /* --- DASHBOARD HEADER --- */
        .header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: var(--glass-bg); z-index: 10; }
        .profile-area { display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; }
        .dp-emoji { width: 45px; height: 45px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; justify-content: center; align-items: center; font-size: 1.5rem; border: 2px solid var(--primary); }
        .header-actions { display: flex; gap: 15px; align-items: center; }
        .icon-btn { background: none; border: none; color: var(--text-main); font-size: 1.3rem; cursor: pointer; transition: 0.2s; position: relative; }
        .icon-btn:hover { color: var(--primary); }
        .badge { position: absolute; top: -5px; right: -5px; background: var(--danger); color: white; font-size: 0.65rem; padding: 2px 5px; border-radius: 50%; font-weight: bold; display: none; }

        /* --- TABS & LISTS --- */
        .tabs { display: flex; border-bottom: 1px solid var(--border); }
        .tab { flex: 1; text-align: center; padding: 15px; cursor: pointer; transition: 0.3s; color: var(--text-muted); font-weight: 500; }
        .tab.active { border-bottom: 3px solid var(--primary); color: var(--primary); }
        .list-container { flex: 1; overflow-y: auto; padding: 10px; }
        .list-item { display: flex; align-items: center; padding: 12px 15px; border-radius: 12px; margin-bottom: 8px; background: var(--glass-bg); cursor: pointer; transition: 0.3s; }
        .list-item:hover { background: rgba(255,255,255,0.08); transform: translateX(5px); }

        /* --- CHAT INTERFACE --- */
        #chat-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--panel-bg); display: none; flex-direction: column; z-index: 50; }
        .chat-header { padding: 15px; display: flex; align-items: center; justify-content: space-between; background: var(--glass-bg); border-bottom: 1px solid var(--border); }
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg-bubble { max-width: 75%; padding: 10px 15px; border-radius: 15px; position: relative; word-wrap: break-word; user-select: none; transition: 0.2s; }
        .msg-bubble.mine { align-self: flex-end; background: var(--chat-mine); border-bottom-right-radius: 2px; }
        .msg-bubble.theirs { align-self: flex-start; background: var(--chat-theirs); border-bottom-left-radius: 2px; }
        .msg-time { font-size: 0.7rem; color: rgba(255,255,255,0.6); text-align: right; margin-top: 5px; }
        .tick { color: #aaa; margin-left: 5px; } .tick.read { color: #34b7f1; }
        
        .chat-input-area { display: flex; padding: 10px 15px; background: var(--glass-bg); align-items: center; gap: 10px; }
        .chat-input-area input { flex: 1; padding: 12px 20px; border-radius: 25px; border: none; outline: none; background: rgba(255,255,255,0.08); color: white; }
        .recording { color: var(--danger) !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

        /* --- CONTEXT MENU (HOLD TO DELETE) --- */
        #context-menu { position: absolute; background: #1a1a1a; border: 1px solid var(--primary); border-radius: 12px; padding: 10px; display: none; flex-direction: column; z-index: 100; box-shadow: 0 5px 20px rgba(0,0,0,0.8); }
        #context-menu button { background: none; border: none; color: white; padding: 12px 20px; text-align: left; cursor: pointer; border-radius: 8px; transition: 0.2s;}
        #context-menu button:hover { background: rgba(255,0,0,0.2); color: var(--danger); }

        /* --- UNIQUE CALLER UI --- */
        #call-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: none; flex-direction: column; z-index: 200; transition: all 0.4s ease; }
        .caller-video { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0.7; }
        .caller-overlay { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 50px 20px; box-sizing: border-box; z-index: 201; }
        .call-controls { display: flex; justify-content: space-around; background: rgba(0,0,0,0.6); padding: 25px; border-radius: 30px; backdrop-filter: blur(15px); }
        .ctrl-btn { width: 55px; height: 55px; border-radius: 50%; border: none; cursor: pointer; font-size: 1.3rem; color: white; background: rgba(255,255,255,0.2); transition: 0.3s;}
        .ctrl-btn.active { background: #fff; color: #000; }
        .ctrl-btn.hangup { background: var(--danger); }
        .ctrl-btn.hangup:hover { transform: scale(1.1); }

        /* --- INCOMING CALL POPUP --- */
        .incoming-popup { position: absolute; top: -100px; left: 5%; width: 90%; background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid var(--primary); border-radius: 20px; padding: 15px; display: flex; align-items: center; justify-content: space-between; z-index: 9999; transition: top 0.4s ease; box-shadow: 0 10px 40px rgba(0, 229, 255, 0.4); }
        .incoming-popup.show { top: 20px; }
        .btn-call-accept { background: #00b09b; padding: 12px; border-radius: 50%; border:none; color:white; font-size: 1.2rem; cursor:pointer;}
        .btn-call-reject { background: var(--danger); padding: 12px; border-radius: 50%; border:none; color:white; font-size: 1.2rem; cursor:pointer;}

        /* --- MODALS --- */
        .modal { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: flex-end; z-index: 300; }
        .modal-content { background: var(--panel-bg); padding: 25px; border-top-left-radius: 25px; border-top-right-radius: 25px; width: 100%; box-sizing: border-box; border-top: 1px solid var(--border); animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .search-input-box input { width: 100%; padding: 12px 15px 12px 40px; border-radius: 20px; border: none; background: var(--glass-bg); color: white; outline: none; box-sizing: border-box; }
        .btn-follow { background: var(--primary); color: #fff; border: none; padding: 6px 15px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .emoji-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 15px 0; }
        .emoji-item { font-size: 2rem; cursor: pointer; text-align: center; padding: 10px; border-radius: 10px; background: var(--glass-bg); transition: 0.2s; }
        .emoji-item.selected { border: 2px solid var(--primary); background: rgba(0, 210, 255, 0.2); }

        /* --- GLITCH & DANGER ANIMATION (PRIVATE MODE) --- */
        #danger-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 0, 0, 0.95); z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center; }
        
        .glitch-wrapper { text-align: center; margin-bottom: 40px; }
        .glitch-icon { font-size: 6rem; color: #ff0000; position: relative; display: inline-block; animation: glitch-skew 1s infinite linear alternate-reverse; }
        .glitch-icon::before, .glitch-icon::after { content: '\f54c'; font-family: "Font Awesome 6 Free"; font-weight: 900; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .glitch-icon::before { left: 3px; text-shadow: -2px 0 #00ffff; animation: glitch-anim 2s infinite linear alternate-reverse; clip-path: polygon(0 0, 100% 0, 100% 33%, 0 33%); }
        .glitch-icon::after { left: -3px; text-shadow: -2px 0 #ff00ff; animation: glitch-anim2 3s infinite linear alternate-reverse; clip-path: polygon(0 66%, 100% 66%, 100% 100%, 0 100%); }
        
        .glitch-text { color: #ff0000; font-size: 1.5rem; font-weight: bold; letter-spacing: 5px; position: relative; animation: glitch-skew 1.5s infinite linear alternate-reverse; }
        .glitch-text::before, .glitch-text::after { content: 'RESTRICTED AREA'; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .glitch-text::before { left: 2px; text-shadow: -1px 0 #00ffff; animation: glitch-anim 2s infinite linear alternate-reverse; clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%); }
        .glitch-text::after { left: -2px; text-shadow: -1px 0 #ff00ff; animation: glitch-anim2 2.5s infinite linear alternate-reverse; clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%); }

        @keyframes glitch-anim { 0% { transform: translate(0); } 20% { transform: translate(-2px, 2px); } 40% { transform: translate(-2px, -2px); } 60% { transform: translate(2px, 2px); } 80% { transform: translate(2px, -2px); } 100% { transform: translate(0); } }
        @keyframes glitch-anim2 { 0% { transform: translate(0); } 20% { transform: translate(2px, -2px); } 40% { transform: translate(2px, 2px); } 60% { transform: translate(-2px, -2px); } 80% { transform: translate(-2px, 2px); } 100% { transform: translate(0); } }
        @keyframes glitch-skew { 0% { transform: skew(0deg); } 20% { transform: skew(-2deg); } 40% { transform: skew(2deg); } 60% { transform: skew(-1deg); } 80% { transform: skew(1deg); } 100% { transform: skew(0deg); } }

        .bottom-password { position: absolute; bottom: 50px; width: 85%; text-align: center; }
        .bottom-password p { color: #ff4b2b; font-weight: bold; margin-bottom: 10px; font-size: 0.9rem; }
        .bottom-password input { width: 100%; padding: 15px; border-radius: 12px; text-align: center; background: rgba(255,0,0,0.1); color: #ff0000; border: 2px solid #ff0000; font-size: 1.2rem; outline:none; box-sizing: border-box; font-family: monospace; letter-spacing: 3px; }
        .bottom-password input:focus { box-shadow: 0 0 15px rgba(255,0,0,0.5); }
        .close-glitch { position: absolute; top: 20px; right: 20px; color: #ff0000; font-size: 2rem; cursor: pointer; }

        /* --- ROMANTIC HEARTS ANIMATION --- */
        .heart { position: absolute; font-size: 1.5rem; color: #ff1493; animation: floatUp 4s linear infinite; opacity: 0; pointer-events: none; z-index: 1;}
        @keyframes floatUp { 0% { transform: translateY(100vh) scale(0.5); opacity: 1; } 100% { transform: translateY(-10vh) scale(1.5); opacity: 0; } }
        #hearts-container { position: absolute; width: 100%; height: 100%; top:0; left:0; pointer-events: none; overflow: hidden; display: none; }
        body.private-mode #hearts-container { display: block; }
    </style>
</head>
<body>

    <div id="hearts-container"></div>

    <div class="app-container">
        <div id="auth-screen">
            <div class="logo-box"><i class="fa-solid fa-ghost"></i></div>
            <h2 style="margin: 0 0 5px 0; letter-spacing: 1px;">Ghost Chat</h2>
            <p style="color:var(--text-muted); margin-bottom: 30px;">Connect. Secure. Hidden.</p>
            
            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="auth-email" class="auth-input" placeholder="Email Address">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="auth-pass" class="auth-input" placeholder="Password">
            </div>
            <div class="input-group" id="auth-user-group" style="display:none;">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="auth-user" class="auth-input" placeholder="Choose Username (lowercase)">
            </div>
            
            <button class="btn-main" id="btn-login" onclick="login()"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
            <button class="btn-main" id="btn-signup" onclick="signup()" style="display:none;"><i class="fa-solid fa-user-plus"></i> Create Account</button>
            
            <div class="auth-links">
                <span onclick="toggleAuth()" id="toggle-text">New here? Sign Up</span>
                <span onclick="forgotPassword()"><i class="fa-solid fa-key"></i> Forgot Password?</span>
            </div>
        </div>

        <div id="dashboard" style="display:none; height:100%; flex-direction:column;">
            <div class="header">
                <div class="profile-area" id="profile-trigger">
                    <div class="dp-emoji" id="my-dp">👻</div>
                    <div>
                        <div id="my-username" style="font-weight:600; font-size:1.1rem;">User</div>
                        <div style="font-size:0.7rem; color:var(--success);"><i class="fa-solid fa-circle" style="font-size:0.5rem;"></i> Online</div>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" onclick="openSearchModal()"><i class="fa-solid fa-magnifying-glass"></i></button>
                    <button class="icon-btn" onclick="openRequestsModal()"><i class="fa-solid fa-bell"></i><span class="badge" id="req-badge">0</span></button>
                    <button class="icon-btn" onclick="openSettings()"><i class="fa-solid fa-gear"></i></button>
                </div>
            </div>

            <div class="tabs">
                <div class="tab active" onclick="switchTab('chats')"><i class="fa-solid fa-message"></i> Chats</div>
                <div class="tab" onclick="switchTab('calls')"><i class="fa-solid fa-phone"></i> Calls</div>
            </div>

            <div class="list-container" id="chats-list"><i>Loading chats...</i></div>
            <div class="list-container" id="calls-list" style="display:none;"><i>No call history.</i></div>
        </div>

        <div id="chat-screen">
            <div class="chat-header">
                <div style="display:flex; align-items:center; gap:10px;">
                    <i class="fa-solid fa-arrow-left icon-btn" onclick="closeChat()"></i>
                    <div class="dp-emoji" style="width:35px; height:35px; font-size:1rem;" id="chat-partner-dp">👻</div>
                    <div id="chat-partner-name" style="font-weight:bold;">Partner</div>
                </div>
                <div style="display:flex; gap:15px;">
                    <i class="fa-solid fa-phone icon-btn" onclick="startCall('voice')"></i>
                    <i class="fa-solid fa-video icon-btn" onclick="startCall('video')"></i>
                </div>
            </div>
            
            <div class="chat-messages" id="chat-messages"></div>
            
            <div class="chat-input-area">
                <input type="text" id="msg-input" placeholder="Type a message...">
                <button class="icon-btn" id="btn-mic" onmousedown="startVoiceRecord()" onmouseup="stopVoiceRecord()" ontouchstart="startVoiceRecord()" ontouchend="stopVoiceRecord()"><i class="fa-solid fa-microphone"></i></button>
                <button class="icon-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>

        <div id="call-screen">
            <video id="local-video" class="caller-video" autoplay muted playsinline></video>
            <div class="caller-overlay">
                <div style="text-align:center;">
                    <div class="dp-emoji" id="calling-dp" style="width:80px; height:80px; font-size:3rem; margin:0 auto 15px auto;">👻</div>
                    <h2 id="calling-name" style="margin:0;">Partner Name</h2>
                    <p id="call-status" style="color:var(--primary); margin-top:5px;">Ringing...</p>
                    <p id="call-timer" style="display:none; font-size:1.5rem; font-weight:bold;">00:00</p>
                </div>
                <div class="call-controls">
                    <button class="ctrl-btn" id="btn-mute" onclick="toggleMute()"><i class="fa-solid fa-microphone-slash"></i></button>
                    <button class="ctrl-btn" id="btn-video" onclick="toggleVideo()"><i class="fa-solid fa-video-slash"></i></button>
                    <button class="ctrl-btn" id="btn-hold" onclick="toggleHold()"><i class="fa-solid fa-pause"></i></button>
                    <button class="ctrl-btn hangup" onclick="hangup()"><i class="fa-solid fa-phone-slash"></i></button>
                </div>
            </div>
        </div>

        <div class="incoming-popup" id="incoming-popup">
            <div style="display:flex; align-items:center; gap:15px;">
                <div class="dp-emoji" id="inc-dp" style="border-color:#fff;">📞</div>
                <div>
                    <div style="font-weight:bold; font-size:1.1rem;" id="inc-name">Incoming...</div>
                    <div style="font-size:0.8rem; color:var(--primary);" id="inc-type">Video Call</div>
                </div>
            </div>
            <div style="display:flex; gap:15px;">
                <button class="btn-call-reject" onclick="rejectIncomingCall()"><i class="fa-solid fa-xmark"></i></button>
                <button class="btn-call-accept" onclick="acceptIncomingCall()"><i class="fa-solid fa-phone"></i></button>
            </div>
        </div>

        <div id="danger-overlay">
            <i class="fa-solid fa-xmark close-glitch" onclick="cancelPrivateEntry()"></i>
            <div class="glitch-wrapper">
                <i class="fa-solid fa-skull glitch-icon"></i>
                <div class="glitch-text">RESTRICTED AREA</div>
            </div>
            <div class="bottom-password">
                <p id="pass-instruction">ENTER ACCESS CODE</p>
                <input type="password" id="private-pass-input" placeholder="****" maxlength="8" onkeypress="verifyPrivatePass(event)">
            </div>
        </div>

        <div class="modal" id="search-modal">
            <div class="modal-content" style="height: 80%; display: flex; flex-direction: column;">
                <div style="display:flex; justify-content:space-between; margin-bottom:15px;"><h3 style="margin:0;">Find Friends</h3><i class="fa-solid fa-xmark icon-btn" onclick="closeModal('search-modal')"></i></div>
                <div class="search-input-box" style="margin-bottom:15px;"><i class="fa-solid fa-search"></i><input type="text" id="search-input" placeholder="Search username..." onkeyup="liveSearch()"></div>
                <div class="list-container" id="search-results-list" style="padding:0;"></div>
            </div>
        </div>

        <div class="modal" id="requests-modal">
            <div class="modal-content" style="max-height: 70%;">
                <div style="display:flex; justify-content:space-between; margin-bottom:15px;"><h3 style="margin:0;">Requests</h3><i class="fa-solid fa-xmark icon-btn" onclick="closeModal('requests-modal')"></i></div>
                <div id="requests-list-container"></div>
            </div>
        </div>

        <div class="modal" id="settings-modal">
            <div class="modal-content">
                <div style="display:flex; justify-content:space-between;"><h3 style="margin:0;">Edit Profile</h3><i class="fa-solid fa-xmark icon-btn" onclick="closeModal('settings-modal')"></i></div>
                <div class="emoji-grid" id="emoji-selector">
                    <div class="emoji-item" onclick="selectEmoji('👨')">👨</div><div class="emoji-item" onclick="selectEmoji('👩')">👩</div><div class="emoji-item" onclick="selectEmoji('👦')">👦</div><div class="emoji-item" onclick="selectEmoji('👧')">👧</div><div class="emoji-item" onclick="selectEmoji('👽')">👽</div>
                    <div class="emoji-item" onclick="selectEmoji('🤖')">🤖</div><div class="emoji-item" onclick="selectEmoji('👻')">👻</div><div class="emoji-item" onclick="selectEmoji('😎')">😎</div><div class="emoji-item" onclick="selectEmoji('🐶')">🐶</div><div class="emoji-item" onclick="selectEmoji('🐱')">🐱</div>
                </div>
                <div class="input-group" style="margin-top:15px;"><i class="fa-solid fa-at"></i><input type="text" id="new-username" class="auth-input" placeholder="Change Username"></div>
                <button class="btn-main" onclick="saveSettings()">Save Changes</button>
                <button class="btn-main" style="background:var(--danger); margin-top:10px;" onclick="logout()">Logout</button>
            </div>
        </div>

        <div id="context-menu">
            <button onclick="deleteMsg('me')"><i class="fa-solid fa-trash"></i> Delete for me</button>
            <button onclick="deleteMsg('everyone')" id="btn-del-everyone"><i class="fa-solid fa-trash-can"></i> Delete for everyone</button>
        </div>

    </div>

<script type="module">
    // --- FIREBASE SETUP ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, onSnapshot, addDoc, query, where, getDocs, orderBy, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyDMSGPEngVmGtTRfcnIC4unH7Rh3FwgcRE", authDomain: "sv-billing-250c2.firebaseapp.com", projectId: "sv-billing-250c2", storageBucket: "sv-billing-250c2.firebasestorage.app", messagingSenderId: "847927101892", appId: "1:847927101892:web:800c182fe47f133d537c91" };
    const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

    // --- GLOBAL STATE ---
    let currentUser = null; let userData = { username: "", avatar: "👻", privateCode: null };
    let isLoginMode = true; let isPrivateMode = false; let selectedEmoji = "👻";
    let currentChatId = null; let currentPartnerId = null; let currentPartnerName = ""; let currentPartnerAvatar = "";
    
    let mediaRecorder; let audioChunks = []; let localStream; let callTimerInt;
    let currentRingtone = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3'); currentRingtone.loop = true;
    let incomingCallId = null; let incomingCallData = null;

    // --- AUTHENTICATION ---
    window.toggleAuth = () => { isLoginMode = !isLoginMode; document.getElementById('auth-user-group').style.display = isLoginMode ? 'none' : 'block'; document.getElementById('btn-login').style.display = isLoginMode ? 'block' : 'none'; document.getElementById('btn-signup').style.display = isLoginMode ? 'none' : 'block'; document.getElementById('toggle-text').innerText = isLoginMode ? "New here? Sign Up" : "Already have an account? Login"; };
    window.login = async () => { const e = document.getElementById('auth-email').value; const p = document.getElementById('auth-pass').value; if(!e||!p) return; try { await signInWithEmailAndPassword(auth, e, p); } catch (err) { alert(err.message); } };
    window.signup = async () => { const e = document.getElementById('auth-email').value; const p = document.getElementById('auth-pass').value; const u = document.getElementById('auth-user').value.toLowerCase().trim(); if(!u||!e||!p) return; try { const cred = await createUserWithEmailAndPassword(auth, e, p); await setDoc(doc(db, "users", cred.user.uid), { email: e, username: u, avatar: "👻", privateCode: null }); } catch (err) { alert(err.message); } };
    window.forgotPassword = async () => { const e = document.getElementById('auth-email').value; if(!e) return alert("Enter email first."); try { await sendPasswordResetEmail(auth, e); alert("Reset link sent!"); } catch (err) { alert(err.message); } };
    window.logout = () => { signOut(auth); };

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user; document.getElementById('auth-screen').style.display = 'none'; document.getElementById('dashboard').style.display = 'flex';
            const docSnap = await getDoc(doc(db, "users", user.uid));
            if(docSnap.exists()){ userData = docSnap.data(); if(!userData.avatar) userData.avatar = "👻"; updateProfileUI(); }
            listenForRequests(); loadChats(); listenForCalls();
        } else {
            currentUser = null; document.getElementById('auth-screen').style.display = 'flex'; document.getElementById('dashboard').style.display = 'none';
            closeModal('settings-modal'); closeModal('search-modal'); closeModal('requests-modal'); if(isPrivateMode) disablePrivateMode();
        }
    });

    function updateProfileUI() { document.getElementById('my-username').innerText = userData.username; document.getElementById('my-dp').innerText = userData.avatar; document.getElementById('new-username').value = userData.username; selectEmoji(userData.avatar); }
    window.switchTab = (tab) => { document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); event.currentTarget.classList.add('active'); document.getElementById('chats-list').style.display = tab === 'chats' ? 'block' : 'none'; document.getElementById('calls-list').style.display = tab === 'calls' ? 'block' : 'none'; if(tab==='calls') loadCallHistory(); };
    window.openSearchModal = () => { document.getElementById('search-modal').style.display = 'flex'; }; window.openRequestsModal = () => { document.getElementById('requests-modal').style.display = 'flex'; }; window.openSettings = () => { document.getElementById('settings-modal').style.display = 'flex'; }; window.closeModal = (id) => { document.getElementById(id).style.display = 'none'; };
    
    // Settings Save
    window.selectEmoji = (emoji) => { selectedEmoji = emoji; document.querySelectorAll('.emoji-item').forEach(el => el.classList.remove('selected')); event.currentTarget.classList.add('selected'); };
    window.saveSettings = async () => { const nu = document.getElementById('new-username').value.toLowerCase().trim(); if(!nu) return; await updateDoc(doc(db, "users", currentUser.uid), { username: nu, avatar: selectedEmoji }); userData.username = nu; userData.avatar = selectedEmoji; updateProfileUI(); closeModal('settings-modal'); };

    // --- INSTAGRAM SEARCH & REQUESTS ---
    window.liveSearch = async () => {
        const val = document.getElementById('search-input').value.toLowerCase().trim(); const resBox = document.getElementById('search-results-list');
        if(val.length < 1) { resBox.innerHTML = ''; return; }
        const q = query(collection(db, "users"), where("username", ">=", val), where("username", "<=", val + '\uf8ff'));
        const snap = await getDocs(q); let html = '';
        snap.forEach(doc => {
            if(doc.id !== currentUser.uid) { const p = doc.data(); html += `<div class="list-item" style="justify-content:space-between;"><div style="display:flex; align-items:center; gap:10px;"><div class="dp-emoji" style="width:40px; height:40px; font-size:1.2rem;">${p.avatar||'👻'}</div><div style="font-weight:600;">${p.username}</div></div><button class="btn-follow" id="btn-add-${doc.id}" onclick="sendFriendRequest('${doc.id}', '${p.username}')">Add</button></div>`; }
        });
        resBox.innerHTML = html || 'No users found';
    };

    window.sendFriendRequest = async (tId, tName) => {
        document.getElementById(`btn-add-${tId}`).innerText = 'Sent'; document.getElementById(`btn-add-${tId}`).classList.add('requested');
        await addDoc(collection(db, "friendRequests"), { fromId: currentUser.uid, fromName: userData.username, fromAvatar: userData.avatar, toId: tId, status: "pending", isPrivateScope: isPrivateMode });
    };

    function listenForRequests() {
        const q = query(collection(db, "friendRequests"), where("toId", "==", currentUser.uid), where("status", "==", "pending"));
        onSnapshot(q, (snap) => {
            const badge = document.getElementById('req-badge'); const list = document.getElementById('requests-list-container');
            if(snap.size > 0) {
                badge.innerText = snap.size; badge.style.display = "block"; let html = '';
                snap.forEach(doc => { const req = doc.data(); html += `<div class="list-item" style="justify-content:space-between;"><div style="display:flex; align-items:center; gap:10px;"><div class="dp-emoji" style="width:40px; height:40px;">${req.fromAvatar}</div><div><div style="font-weight:600;">${req.fromName}</div><div style="font-size:0.75rem; color:var(--primary);">${req.isPrivateScope ? 'Private Req' : 'New Req'}</div></div></div><button class="btn-main" style="padding:6px 12px; margin:0;" onclick="acceptRequest('${doc.id}', '${req.fromId}', ${req.isPrivateScope})">Accept</button></div>`; });
                list.innerHTML = html;
            } else { badge.style.display = "none"; list.innerHTML = "No requests."; }
        });
    }

    window.acceptRequest = async (reqId, fromId, isPriv) => {
        await updateDoc(doc(db, "friendRequests", reqId), { status: "accepted" });
        const combId = currentUser.uid > fromId ? currentUser.uid + fromId : fromId + currentUser.uid;
        await setDoc(doc(db, "chats", combId), { users: [currentUser.uid, fromId], isPrivate: isPriv, timestamp: Date.now() });
    };

    // --- GLITCH PASSWORD SYSTEM (PRIVATE MODE) ---
    let pressTimer; const profileTrigger = document.getElementById('profile-trigger');
    profileTrigger.addEventListener('mousedown', () => { pressTimer = setTimeout(triggerDangerUI, 1500); });
    profileTrigger.addEventListener('touchstart', () => { pressTimer = setTimeout(triggerDangerUI, 1500); });
    profileTrigger.addEventListener('mouseup', () => clearTimeout(pressTimer));
    profileTrigger.addEventListener('touchend', () => clearTimeout(pressTimer));

    function triggerDangerUI() {
        if(navigator.vibrate) navigator.vibrate([100, 50, 100]); // Haptic warning
        if(isPrivateMode) { disablePrivateMode(); return; } // Toggle Off
        
        document.getElementById('danger-overlay').style.display = 'flex';
        const passIn = document.getElementById('private-pass-input');
        passIn.value = ''; passIn.focus();
        document.getElementById('pass-instruction').innerText = userData.privateCode ? "ENTER ACCESS CODE" : "CREATE NEW ACCESS CODE";
    }

    window.cancelPrivateEntry = () => { document.getElementById('danger-overlay').style.display = 'none'; }

    window.verifyPrivatePass = async (e) => {
        if(e.key === 'Enter') {
            const val = document.getElementById('private-pass-input').value;
            if(val.length < 4) return alert("Code too short!");
            
            if(!userData.privateCode) {
                await updateDoc(doc(db, "users", currentUser.uid), { privateCode: val });
                userData.privateCode = val; enablePrivateMode();
            } else {
                if(val === userData.privateCode) enablePrivateMode();
                else alert("ACCESS DENIED");
            }
        }
    };

    function enablePrivateMode() {
        document.getElementById('danger-overlay').style.display = 'none';
        document.body.classList.add('private-mode'); isPrivateMode = true;
        generateRomanticHearts(); loadChats();
    }

    function disablePrivateMode() {
        document.body.classList.remove('private-mode'); isPrivateMode = false;
        document.getElementById('hearts-container').innerHTML = ''; loadChats();
    }

    function generateRomanticHearts() {
        const container = document.getElementById('hearts-container'); container.innerHTML = '';
        const types = ['fa-solid fa-heart', 'fa-regular fa-heart', 'fa-solid fa-heart-pulse'];
        for(let i=0; i<15; i++) {
            let h = document.createElement('i'); h.className = types[Math.floor(Math.random()*types.length)] + ' heart';
            h.style.left = Math.random()*100+'vw'; h.style.animationDuration = (Math.random()*3+2)+'s'; h.style.fontSize = (Math.random()*1.5+1)+'rem';
            container.appendChild(h);
        }
    }

    // --- CHATS & MESSAGING ---
    function loadChats() {
        if(!currentUser) return;
        const q = query(collection(db, "chats"), where("users", "array-contains", currentUser.uid));
        onSnapshot(q, async (snap) => {
            let html = '';
            for (const d of snap.docs) {
                const data = d.data(); if(data.isPrivate !== isPrivateMode) continue;
                const pId = data.users.find(id => id !== currentUser.uid);
                const pSnap = await getDoc(doc(db, "users", pId));
                if(pSnap.exists()) {
                    const pData = pSnap.data();
                    html += `<div class="list-item" onclick="openChat('${d.id}', '${pId}', '${pData.username}', '${pData.avatar}')"><div class="dp-emoji">${pData.avatar||'👻'}</div><div style="flex:1; padding-left:15px;"><div style="font-weight:bold;">${pData.username}</div><div style="font-size:0.8rem; color:var(--text-muted);">${data.lastMsg||'Tap to chat'}</div></div></div>`;
                }
            }
            document.getElementById('chats-list').innerHTML = html || "<i>No chats yet.</i>";
        });
    }

    window.openChat = (cId, pId, pName, pAvatar) => {
        currentChatId = cId; currentPartnerId = pId; currentPartnerName = pName; currentPartnerAvatar = pAvatar || '👻';
        document.getElementById('chat-partner-name').innerText = pName; document.getElementById('chat-partner-dp').innerText = currentPartnerAvatar;
        document.getElementById('dashboard').style.display = 'none'; document.getElementById('chat-screen').style.display = 'flex';
        
        const q = query(collection(db, `chats/${cId}/messages`), orderBy('timestamp'));
        onSnapshot(q, (snap) => {
            let html = '';
            snap.forEach(d => {
                const msg = d.data(); if(msg.deletedFor && msg.deletedFor.includes(currentUser.uid)) return;
                const isMe = msg.sender === currentUser.uid; const time = new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                let content = msg.type === 'audio' ? `<audio controls src="${msg.text}" style="height:35px; width:200px;"></audio>` : msg.text;
                let ticks = isMe ? `<i class="fa-solid fa-check-double tick ${msg.status==='read'?'read':''}"></i>` : '';
                if(!isMe && msg.status !== 'read') updateDoc(doc(db, `chats/${cId}/messages`, d.id), { status: 'read' });
                
                // Add event listeners correctly for hold to delete
                html += `<div class="msg-bubble ${isMe ? 'mine' : 'theirs'}" id="msg-${d.id}" data-id="${d.id}" data-isme="${isMe}">${content}<div class="msg-time">${time} ${ticks}</div></div>`;
            });
            const box = document.getElementById('chat-messages'); box.innerHTML = html; box.scrollTop = box.scrollHeight;
            attachHoldListeners();
        });
    };

    window.closeChat = () => { document.getElementById('chat-screen').style.display = 'none'; document.getElementById('dashboard').style.display = 'flex'; currentChatId = null; };

    window.sendMessage = async () => {
        const inp = document.getElementById('msg-input'); const txt = inp.value.trim(); if(!txt) return; inp.value = '';
        await addDoc(collection(db, `chats/${currentChatId}/messages`), { sender: currentUser.uid, text: txt, type: 'text', timestamp: Date.now(), status: 'sent', deletedFor: [] });
        await updateDoc(doc(db, "chats", currentChatId), { lastMsg: txt });
    };

    // HOLD TO DELETE
    let msgTimer; let selMsgId = null;
    function attachHoldListeners() {
        document.querySelectorAll('.msg-bubble').forEach(el => {
            el.onmousedown = () => { msgTimer = setTimeout(() => showContext(el, event), 800); };
            el.ontouchstart = (e) => { msgTimer = setTimeout(() => showContext(el, e.touches[0]), 800); };
            el.onmouseup = () => clearTimeout(msgTimer); el.ontouchend = () => clearTimeout(msgTimer);
        });
    }
    function showContext(el, ev) {
        selMsgId = el.getAttribute('data-id'); const isMe = el.getAttribute('data-isme') === 'true';
        if(navigator.vibrate) navigator.vibrate(50);
        const menu = document.getElementById('context-menu'); menu.style.display = 'flex';
        menu.style.top = (ev.clientY - 50) + 'px'; menu.style.left = (ev.clientX > 200 ? ev.clientX - 150 : ev.clientX) + 'px';
        document.getElementById('btn-del-everyone').style.display = isMe ? 'block' : 'none';
    }
    document.addEventListener('click', (e) => { if(!e.target.closest('.msg-bubble') && !e.target.closest('#context-menu')) document.getElementById('context-menu').style.display = 'none'; });
    
    window.deleteMsg = async (type) => {
        const ref = doc(db, `chats/${currentChatId}/messages`, selMsgId);
        if(type === 'me') { const s = await getDoc(ref); let arr = s.data().deletedFor || []; arr.push(currentUser.uid); await updateDoc(ref, { deletedFor: arr }); } 
        else if (type === 'everyone') { await deleteDoc(ref); }
        document.getElementById('context-menu').style.display = 'none';
    };

    // VOICE MESSAGES
    window.startVoiceRecord = async () => {
        try { const stream = await navigator.mediaDevices.getUserMedia({ audio: true }); mediaRecorder = new MediaRecorder(stream); document.getElementById('btn-mic').classList.add('recording'); mediaRecorder.start(); audioChunks = []; mediaRecorder.addEventListener("dataavailable", e => audioChunks.push(e.data)); } catch(e) { console.log(e); }
    };
    window.stopVoiceRecord = () => {
        if(!mediaRecorder) return; document.getElementById('btn-mic').classList.remove('recording'); mediaRecorder.stop();
        mediaRecorder.addEventListener("stop", () => {
            const blob = new Blob(audioChunks); const reader = new FileReader(); reader.readAsDataURL(blob);
            reader.onloadend = async () => { await addDoc(collection(db, `chats/${currentChatId}/messages`), { sender: currentUser.uid, text: reader.result, type: 'audio', timestamp: Date.now(), status: 'sent', deletedFor: [] }); }
        });
    };

    // --- CALLING SYSTEM ---
    window.startCall = async (type) => {
        document.getElementById('call-screen').style.display = 'flex'; document.getElementById('calling-name').innerText = currentPartnerName; document.getElementById('calling-dp').innerText = currentPartnerAvatar; document.getElementById('call-status').innerText = "Calling...";
        
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: type==='video', audio: true });
            if(type==='video') { document.getElementById('local-video').style.display = 'block'; document.getElementById('local-video').srcObject = localStream; document.getElementById('btn-video').style.display = 'inline-block'; } 
            else { document.getElementById('local-video').style.display = 'none'; document.getElementById('btn-video').style.display = 'none'; }
            
            await setDoc(doc(db, "calls", currentChatId), { caller: currentUser.uid, receiver: currentPartnerId, callerName: userData.username, callerAvatar: userData.avatar, type: type, status: 'ringing', isPrivate: isPrivateMode, timestamp: Date.now() });
            currentRingtone.play();
        } catch(e) { alert("Camera/Mic permission denied"); document.getElementById('call-screen').style.display = 'none'; }
    };

    function listenForCalls() {
        const q = query(collection(db, "calls"), where("receiver", "==", currentUser.uid));
        onSnapshot(q, (snap) => {
            snap.docChanges().forEach(change => {
                const data = change.doc.data();
                if(change.type === "added" && data.status === 'ringing') {
                    if(data.isPrivate !== isPrivateMode) return; // Strict mode separation
                    incomingCallId = change.doc.id; incomingCallData = data;
                    document.getElementById('inc-name').innerText = data.callerName; document.getElementById('inc-dp').innerText = data.callerAvatar; document.getElementById('inc-type').innerText = data.type === 'video' ? 'Incoming Video Call' : 'Incoming Voice Call';
                    document.getElementById('incoming-popup').classList.add('show'); currentRingtone.play();
                }
                if(change.type === "modified") {
                    if(data.status === 'connected' && incomingCallId !== change.doc.id) { currentRingtone.pause(); document.getElementById('call-status').innerText = "Connected"; startCallTimer(); }
                    if(data.status === 'ended') { cleanupCall(); }
                }
            });
        });
    }

    window.acceptIncomingCall = async () => {
        document.getElementById('incoming-popup').classList.remove('show'); currentRingtone.pause();
        currentChatId = incomingCallId; currentPartnerName = incomingCallData.callerName;
        
        document.getElementById('call-screen').style.display = 'flex'; document.getElementById('calling-name').innerText = currentPartnerName; document.getElementById('calling-dp').innerText = incomingCallData.callerAvatar; document.getElementById('call-status').innerText = "Connected";
        
        localStream = await navigator.mediaDevices.getUserMedia({ video: incomingCallData.type==='video', audio: true });
        if(incomingCallData.type==='video') { document.getElementById('local-video').style.display = 'block'; document.getElementById('local-video').srcObject = localStream; document.getElementById('btn-video').style.display = 'inline-block'; }
        else { document.getElementById('local-video').style.display = 'none'; document.getElementById('btn-video').style.display = 'none'; }
        
        await updateDoc(doc(db, "calls", currentChatId), { status: 'connected' }); startCallTimer();
    };

    window.rejectIncomingCall = async () => { document.getElementById('incoming-popup').classList.remove('show'); currentRingtone.pause(); await updateDoc(doc(db, "calls", incomingCallId), { status: 'ended' }); incomingCallId = null; };
    
    function startCallTimer() {
        let sec = 0; document.getElementById('call-timer').style.display = 'block'; document.getElementById('calling-dp').style.display = 'none';
        callTimerInt = setInterval(() => { sec++; let m = Math.floor(sec/60).toString().padStart(2,'0'); let s = (sec%60).toString().padStart(2,'0'); document.getElementById('call-timer').innerText = `${m}:${s}`; }, 1000);
    }

    window.toggleMute = () => { const t = localStream.getAudioTracks()[0]; t.enabled = !t.enabled; document.getElementById('btn-mute').classList.toggle('active'); };
    window.toggleVideo = () => { const t = localStream.getVideoTracks()[0]; if(t){ t.enabled = !t.enabled; document.getElementById('btn-video').classList.toggle('active'); } };
    window.toggleHold = () => { document.getElementById('btn-hold').classList.toggle('active'); };
    
    window.hangup = async () => {
        await updateDoc(doc(db, "calls", currentChatId), { status: 'ended' });
        await addDoc(collection(db, "callHistory"), { uid: currentUser.uid, partnerName: currentPartnerName, isPrivate: isPrivateMode, time: Date.now(), type: 'outgoing' });
        cleanupCall();
    };

    function cleanupCall() {
        if(localStream) localStream.getTracks().forEach(t => t.stop()); clearInterval(callTimerInt); currentRingtone.pause();
        document.getElementById('call-screen').style.display = 'none'; document.getElementById('call-timer').style.display = 'none'; document.getElementById('call-timer').innerText = "00:00"; document.getElementById('calling-dp').style.display = 'block'; document.getElementById('incoming-popup').classList.remove('show'); incomingCallId = null;
    }

    // CALL HISTORY
    window.loadCallHistory = async () => {
        const q = query(collection(db, "callHistory"), where("uid", "==", currentUser.uid), orderBy("time", "desc"));
        const snap = await getDocs(q); let html = '';
        snap.forEach(d => {
            const data = d.data(); if(data.isPrivate !== isPrivateMode) return;
            const timeStr = new Date(data.time).toLocaleString([], {hour:'2-digit', minute:'2-digit', day:'numeric', month:'short'});
            html += `<div class="list-item"><div class="dp-emoji" style="border-color:${data.type==='incoming'?'var(--success)':'var(--primary)'}; font-size:1rem;"><i class="fa-solid fa-phone"></i></div><div style="flex:1; padding-left:15px;"><div style="font-weight:bold;">${data.partnerName}</div><div style="font-size:0.8rem; color:var(--text-muted);">${data.type.toUpperCase()} • ${timeStr}</div></div></div>`;
        });
        document.getElementById('calls-list').innerHTML = html || "<i>No call history.</i>";
    };

</script>
</body>
</html>
