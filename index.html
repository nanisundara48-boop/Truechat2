<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Chat - Pro Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://unpkg.com/ml5@latest/dist/ml5.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #0f172a; --bg-panel: #1e293b; --bg-hover: #334155;
            --primary: #3b82f6; --primary-hover: #2563eb;
            --text-main: #f8fafc; --text-muted: #94a3b8;
            --danger: #ef4444; --success: #10b981;
            --chat-mine: #2563eb; --chat-theirs: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { background: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; justify-content: center; overflow: hidden; }
        .app-container { width: 100%; max-width: 480px; height: 100vh; background: var(--bg-panel); display: flex; flex-direction: column; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.5); }

        /* HEADER */
        .header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: #0f172a; border-bottom: 1px solid #334155; z-index: 10; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .dp-circle { width: 40px; height: 40px; border-radius: 50%; background: #475569; overflow: hidden; border: 2px solid var(--primary); display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .dp-circle img { width: 100%; height: 100%; object-fit: cover; }
        .signal-indicator { font-size: 0.75rem; color: var(--success); display: flex; align-items: center; gap: 4px; }
        .icon-btn { background: none; border: none; color: var(--text-main); font-size: 1.2rem; cursor: pointer; transition: 0.2s; }
        .icon-btn:hover { color: var(--primary); }

        /* MAIN CONTENT AREA */
        .main-content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; position: relative; }
        .list-container { flex: 1; padding: 10px; display: none; }
        .list-container.active { display: block; }
        
        .list-item { display: flex; align-items: center; padding: 15px; border-radius: 12px; margin-bottom: 8px; background: var(--bg-dark); cursor: pointer; transition: 0.2s; justify-content: space-between; }
        .list-item:hover { background: var(--bg-hover); }
        .item-details { flex: 1; padding-left: 15px; }
        .item-title { font-weight: 600; font-size: 1rem; }
        .item-sub { font-size: 0.8rem; color: var(--text-muted); }

        /* FOOTER NAV */
        .footer-nav { height: 65px; background: #0f172a; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #334155; z-index: 10; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); cursor: pointer; font-size: 0.75rem; gap: 4px; transition: 0.2s; }
        .nav-item i { font-size: 1.3rem; }
        .nav-item.active { color: var(--primary); }

        /* SEARCH & INPUTS */
        .search-bar { width: 100%; padding: 12px 15px; background: var(--bg-dark); border: 1px solid #334155; border-radius: 8px; color: white; outline: none; margin-bottom: 15px; }
        .btn-primary { padding: 8px 15px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; }
        .btn-danger { background: var(--danger); }

        /* CHAT SCREEN */
        .chat-screen { position: absolute; top:0; left:0; width:100%; height:100%; background: var(--bg-dark); display: none; flex-direction: column; z-index: 100; }
        .chat-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; background: var(--bg-panel); border-bottom: 1px solid #334155; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg-bubble { max-width: 75%; padding: 10px 15px; border-radius: 12px; position: relative; word-wrap: break-word; font-size: 0.95rem; }
        .msg-mine { align-self: flex-end; background: var(--chat-mine); border-bottom-right-radius: 2px; }
        .msg-theirs { align-self: flex-start; background: var(--chat-theirs); border-bottom-left-radius: 2px; }
        .chat-input-area { padding: 10px 15px; background: var(--bg-panel); display: flex; gap: 10px; align-items: center; }
        .chat-input-area input { flex: 1; padding: 12px 15px; border-radius: 20px; border: none; background: var(--bg-dark); color: white; outline: none; }

        /* GAME / AI PANIC SCREEN */
        #game-screen { position: absolute; top:0; left:0; width:100%; height:100%; background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 500; }
        canvas { border: 2px solid #333; background: #111; border-radius: 8px; margin: 20px 0; }

        /* MODALS */
        .modal { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 200; }
        .modal-content { background: var(--bg-panel); padding: 20px; border-radius: 12px; width: 85%; }

        /* AUTH SCREEN */
        #auth-screen { display: flex; flex-direction: column; justify-content: center; padding: 30px; height: 100%; text-align: center; }
    </style>
</head>
<body>

<div class="app-container">
    <video id="ai-video" style="display:none;" width="320" height="240" autoplay muted></video>

    <div id="auth-screen">
        <h1 style="color:var(--primary); margin-bottom:30px;"><i class="fa-solid fa-shield-halved"></i> TrueChat Secure</h1>
        <input type="email" id="auth-email" class="search-bar" placeholder="Email Address">
        <input type="password" id="auth-pass" class="search-bar" placeholder="Password">
        <input type="text" id="auth-user" class="search-bar" placeholder="Username (Signup only)" style="display:none;">
        <button class="btn-primary" id="btn-login" onclick="login()" style="width:100%; padding:15px; font-size:1rem;">Login</button>
        <button class="btn-primary" id="btn-signup" onclick="signup()" style="width:100%; padding:15px; font-size:1rem; display:none;">Create Account</button>
        <p onclick="toggleAuth()" style="color:var(--primary); margin-top:20px; cursor:pointer;">New User? Sign Up Here</p>
    </div>

    <div id="main-app" style="display:none; flex-direction:column; height:100%;">
        <div class="header">
            <div class="user-info">
                <div class="dp-circle"><i class="fa-solid fa-user"></i></div>
                <div>
                    <div id="my-username" style="font-weight:600;">User</div>
                    <div class="signal-indicator"><i class="fa-solid fa-signal"></i> Encrypted Connection</div>
                </div>
            </div>
            <div>
                <button class="icon-btn" id="ai-toggle" onclick="toggleAI()"><i class="fa-solid fa-eye-slash"></i></button>
            </div>
        </div>

        <div class="main-content">
            <div class="list-container active" id="tab-chats">
                <div id="chats-list" style="margin-top:10px;"></div>
            </div>

            <div class="list-container" id="tab-requests">
                <h3 style="margin-bottom:10px; font-size:1rem;">Add Friends</h3>
                <input type="text" id="search-input" class="search-bar" placeholder="Type 2+ letters to search..." onkeyup="searchUsers()">
                <div id="search-results" style="margin-bottom:20px;"></div>
                
                <h3 style="margin-bottom:10px; font-size:1rem;">Pending Requests</h3>
                <div id="requests-list"></div>
            </div>

            <div class="list-container" id="tab-games" style="text-align:center; padding-top:40px;">
                <i class="fa-solid fa-gamepad" style="font-size:3rem; color:var(--primary); margin-bottom:20px;"></i>
                <h2>Arcade Zone</h2>
                <div class="list-item" style="margin-top:20px;" onclick="startSnakeGame()">
                    <div class="item-details"><div class="item-title">Snake Classic</div><div class="item-sub">Single Player</div></div>
                    <button class="btn-primary">Play</button>
                </div>
            </div>
        </div>

        <div class="footer-nav">
            <div class="nav-item active" onclick="switchNav('chats')"><i class="fa-solid fa-message"></i>Chats</div>
            <div class="nav-item" onclick="switchNav('requests')"><i class="fa-solid fa-user-plus"></i>Requests</div>
            <div class="nav-item" onclick="switchNav('games')"><i class="fa-solid fa-gamepad"></i>Games</div>
        </div>
    </div>

    <div id="chat-screen" class="chat-screen">
        <div class="chat-header">
            <div style="display:flex; align-items:center; gap:10px;">
                <button class="icon-btn" onclick="closeChat()"><i class="fa-solid fa-arrow-left"></i></button>
                <div>
                    <div id="chat-partner-name" style="font-weight:600; font-size:1rem;">Partner</div>
                    <div id="chat-nickname-status" style="font-size:0.7rem; color:var(--success);">E2E Encrypted</div>
                </div>
            </div>
            <div style="display:flex; gap:15px;">
                <button class="icon-btn" onclick="initiateCall()"><i class="fa-solid fa-phone"></i></button>
                <button class="icon-btn" onclick="openChatSettings()"><i class="fa-solid fa-ellipsis-vertical"></i></button>
            </div>
        </div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="msg-input" placeholder="Type a message...">
            <button class="icon-btn" style="color:var(--primary);" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <div class="modal" id="chat-settings-modal">
        <div class="modal-content">
            <h3 style="margin-bottom:15px;">Chat Settings</h3>
            <input type="text" id="nickname-input" class="search-bar" placeholder="Set a Nickname for them">
            <button class="btn-primary" style="width:100%; margin-bottom:10px;" onclick="setNickname()">Save Nickname</button>
            <button class="btn-primary btn-danger" style="width:100%; margin-bottom:10px;" onclick="blockUser()" id="block-btn">Block User</button>
            <button class="btn-primary" style="width:100%; background:#475569;" onclick="document.getElementById('chat-settings-modal').style.display='none'">Cancel</button>
        </div>
    </div>

    <div id="game-screen">
        <h2 style="color:#10b981; font-family:monospace;">SCORE: <span id="score-display">0</span></h2>
        <canvas id="snakeCanvas" width="300" height="300"></canvas>
        <button class="btn-primary btn-danger" onclick="closeGame()">Exit Game</button>
    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection, addDoc, query, orderBy, where, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDMSGPEngVmGtTRfcnIC4unH7Rh3FwgcRE",
        authDomain: "sv-billing-250c2.firebaseapp.com",
        projectId: "sv-billing-250c2",
        storageBucket: "sv-billing-250c2.firebasestorage.app",
        messagingSenderId: "847927101892",
        appId: "1:847927101892:web:800c182fe47f133d537c91"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null; let userData = null;
    let currentChatId = null; let currentPartnerId = null; let currentPartnerName = "";
    let chatDataRaw = null; 
    let isLoginMode = true; let aiActive = false;

    // --- AUTHENTICATION ---
    window.toggleAuth = () => {
        isLoginMode = !isLoginMode;
        document.getElementById('auth-user').style.display = isLoginMode ? 'none' : 'block';
        document.getElementById('btn-login').style.display = isLoginMode ? 'block' : 'none';
        document.getElementById('btn-signup').style.display = isLoginMode ? 'none' : 'block';
    };

    window.login = async () => {
        const e = document.getElementById('auth-email').value; const p = document.getElementById('auth-pass').value;
        try { await signInWithEmailAndPassword(auth, e, p); } catch(err) { alert(err.message); }
    };

    window.signup = async () => {
        const e = document.getElementById('auth-email').value; const p = document.getElementById('auth-pass').value; const u = document.getElementById('auth-user').value;
        if(!u) return alert("Username required");
        try {
            const cred = await createUserWithEmailAndPassword(auth, e, p);
            await setDoc(doc(db, "users", cred.user.uid), { email: e, username: u, searchKey: u.toLowerCase() });
        } catch(err) { alert(err.message); }
    };

    onAuthStateChanged(auth, async (user) => {
        if(user) {
            currentUser = user;
            const snap = await getDoc(doc(db, "users", user.uid));
            userData = snap.data();
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            document.getElementById('my-username').innerText = userData.username;
            loadChats(); loadRequests();
        }
    });

    // --- UI NAVIGATION ---
    window.switchNav = (tab) => {
        document.querySelectorAll('.list-container').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.getElementById(`tab-${tab}`).classList.add('active');
        event.currentTarget.classList.add('active');
    };

    // --- SEARCH & FRIEND REQUESTS ---
    window.searchUsers = async () => {
        const text = document.getElementById('search-input').value.toLowerCase().trim();
        const resBox = document.getElementById('search-results');
        if(text.length < 2) { resBox.innerHTML = ''; return; }

        const q = query(collection(db, "users"), where("searchKey", ">=", text), where("searchKey", "<=", text + '\uf8ff'));
        onSnapshot(q, (snap) => {
            let html = '';
            snap.forEach(d => {
                if(d.id !== currentUser.uid) {
                    html += `
                    <div class="list-item">
                        <div class="item-details"><div class="item-title">${d.data().username}</div></div>
                        <button class="btn-primary" onclick="sendRequest('${d.id}')">Add</button>
                    </div>`;
                }
            });
            resBox.innerHTML = html || "<p style='color:gray; font-size:0.8rem;'>No users found</p>";
        });
    };

    window.sendRequest = async (targetId) => {
        await setDoc(doc(db, `friend_requests/${currentUser.uid}_${targetId}`), {
            sender: currentUser.uid, senderName: userData.username, receiver: targetId, status: 'pending'
        });
        alert("Request Sent!");
        document.getElementById('search-input').value = ''; document.getElementById('search-results').innerHTML = '';
    };

    function loadRequests() {
        const q = query(collection(db, "friend_requests"), where("receiver", "==", currentUser.uid), where("status", "==", "pending"));
        onSnapshot(q, (snap) => {
            let html = '';
            snap.forEach(d => {
                const req = d.data();
                html += `
                <div class="list-item">
                    <div class="item-details"><div class="item-title">${req.senderName}</div><div class="item-sub">Wants to connect</div></div>
                    <div style="display:flex; gap:5px;">
                        <button class="btn-primary" style="background:var(--success);" onclick="acceptRequest('${d.id}', '${req.sender}', '${req.senderName}')"><i class="fa-solid fa-check"></i></button>
                        <button class="btn-primary btn-danger" onclick="rejectRequest('${d.id}')"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>`;
            });
            document.getElementById('requests-list').innerHTML = html || "<p style='color:gray; font-size:0.8rem;'>No pending requests</p>";
        });
    }

    window.acceptRequest = async (reqId, senderId, senderName) => {
        const chatId = currentUser.uid > senderId ? currentUser.uid + senderId : senderId + currentUser.uid;
        await setDoc(doc(db, "chats", chatId), { users: [currentUser.uid, senderId], nicknames: {}, blocked: [] });
        await deleteDoc(doc(db, "friend_requests", reqId));
        switchNav('chats');
    };
    window.rejectRequest = async (reqId) => { await deleteDoc(doc(db, "friend_requests", reqId)); };

    // --- CHATS & ENCRYPTION ---
    // Encrypt/Decrypt using CryptoJS (AES) with ChatId as secret key
    function encryptText(text, key) { return CryptoJS.AES.encrypt(text, key).toString(); }
    function decryptText(cipher, key) { 
        try { const bytes = CryptoJS.AES.decrypt(cipher, key); return bytes.toString(CryptoJS.enc.Utf8); } 
        catch(e) { return "🔒 [Encrypted Message]"; }
    }

    function loadChats() {
        const q = query(collection(db, "chats"), where("users", "array-contains", currentUser.uid));
        onSnapshot(q, (snap) => {
            let html = '';
            snap.forEach(async d => {
                const chat = d.data();
                const partnerId = chat.users.find(id => id !== currentUser.uid);
                const pSnap = await getDoc(doc(db, "users", partnerId));
                if(pSnap.exists()) {
                    let displayTitle = pSnap.data().username;
                    // Check if I set a nickname for them
                    if(chat.nicknames && chat.nicknames[partnerId] && chat.nicknames[partnerId].setBy === currentUser.uid) {
                        displayTitle = chat.nicknames[partnerId].name;
                    }

                    html += `
                    <div class="list-item" onclick="openChat('${d.id}', '${partnerId}', '${pSnap.data().username}')">
                        <div class="dp-circle"><i class="fa-solid fa-user"></i></div>
                        <div class="item-details">
                            <div class="item-title">${displayTitle}</div>
                            <div class="item-sub">Tap to open encrypted chat</div>
                        </div>
                    </div>`;
                }
            });
            document.getElementById('chats-list').innerHTML = html || "<p style='color:gray; text-align:center; margin-top:20px;'>No chats. Go to Requests to add friends.</p>";
        });
    }

    window.openChat = async (chatId, pId, pNameOriginal) => {
        currentChatId = chatId; currentPartnerId = pId; currentPartnerName = pNameOriginal;
        document.getElementById('chat-screen').style.display = 'flex';
        
        // Listen to Chat metadata (Nicknames, Blocks)
        onSnapshot(doc(db, "chats", chatId), (docSnap) => {
            chatDataRaw = docSnap.data();
            let headerName = currentPartnerName;
            let statusText = "E2E Encrypted";

            if(chatDataRaw.blocked && chatDataRaw.blocked.includes(currentPartnerId)) statusText = "You blocked this user";
            if(chatDataRaw.blocked && chatDataRaw.blocked.includes(currentUser.uid)) statusText = "You were blocked";

            // If I set a nickname for them
            if(chatDataRaw.nicknames && chatDataRaw.nicknames[currentPartnerId] && chatDataRaw.nicknames[currentPartnerId].setBy === currentUser.uid) {
                headerName = chatDataRaw.nicknames[currentPartnerId].name;
            }
            // If THEY set a nickname for ME, show it to me
            if(chatDataRaw.nicknames && chatDataRaw.nicknames[currentUser.uid] && chatDataRaw.nicknames[currentUser.uid].setBy === currentPartnerId) {
                statusText = `(They call you: ${chatDataRaw.nicknames[currentUser.uid].name})`;
            }

            document.getElementById('chat-partner-name').innerText = headerName;
            document.getElementById('chat-nickname-status').innerText = statusText;
            document.getElementById('block-btn').innerText = (chatDataRaw.blocked && chatDataRaw.blocked.includes(currentUser.uid)) ? "Unblock User" : "Block User";
        });

        // Listen to Messages
        const q = query(collection(db, `chats/${chatId}/messages`), orderBy("timestamp"));
        onSnapshot(q, (snap) => {
            let mHtml = '';
            snap.forEach(m => {
                const msg = m.data();
                const decryptedText = decryptText(msg.text, chatId);
                const isMe = msg.sender === currentUser.uid;
                mHtml += `<div class="msg-bubble ${isMe ? 'msg-mine' : 'msg-theirs'}">${decryptedText}</div>`;
            });
            const box = document.getElementById('chat-messages');
            box.innerHTML = mHtml;
            box.scrollTop = box.scrollHeight;
        });
    };

    window.closeChat = () => { document.getElementById('chat-screen').style.display = 'none'; currentChatId = null; };

    window.sendMessage = async () => {
        if(chatDataRaw.blocked && chatDataRaw.blocked.length > 0) return alert("Action not allowed. User is blocked.");
        const inp = document.getElementById('msg-input');
        const text = inp.value.trim();
        if(!text) return;
        inp.value = '';
        
        const encryptedText = encryptText(text, currentChatId);
        await addDoc(collection(db, `chats/${currentChatId}/messages`), { sender: currentUser.uid, text: encryptedText, timestamp: Date.now() });
    };

    // --- CHAT SETTINGS (NICKNAMES & BLOCK) ---
    window.openChatSettings = () => { document.getElementById('chat-settings-modal').style.display = 'flex'; };
    
    window.setNickname = async () => {
        const newName = document.getElementById('nickname-input').value.trim();
        if(!newName) return;
        
        // Structure: nicknames -> { targetUserId: { name: 'Likhi', setBy: 'NaniUid' } }
        let currentNicknames = chatDataRaw.nicknames || {};
        currentNicknames[currentPartnerId] = { name: newName, setBy: currentUser.uid };
        
        await updateDoc(doc(db, "chats", currentChatId), { nicknames: currentNicknames });
        document.getElementById('chat-settings-modal').style.display = 'none';
        document.getElementById('nickname-input').value = '';
    };

    window.blockUser = async () => {
        let blockedArr = chatDataRaw.blocked || [];
        if(blockedArr.includes(currentUser.uid)) {
            blockedArr = blockedArr.filter(id => id !== currentUser.uid); // Unblock
        } else {
            blockedArr.push(currentUser.uid); // Block
        }
        await updateDoc(doc(db, "chats", currentChatId), { blocked: blockedArr });
        document.getElementById('chat-settings-modal').style.display = 'none';
    };

    // --- CALL ISOLATION ---
    window.initiateCall = async () => {
        // Signaling targets the SPECIFIC receiver UID. Will not broadcast.
        await setDoc(doc(db, "active_calls", currentChatId), {
            caller: currentUser.uid, receiver: currentPartnerId, status: 'ringing', timestamp: Date.now()
        });
        alert(`Calling ${document.getElementById('chat-partner-name').innerText}... (Isolated WebRTC Signal sent)`);
    };

    // --- AI SNOOP DETECTION & GAMES ---
    window.toggleAI = async () => {
        aiActive = !aiActive;
        const btn = document.getElementById('ai-toggle');
        if(aiActive) {
            btn.style.color = 'var(--success)'; btn.innerHTML = '<i class="fa-solid fa-eye"></i>';
            startAI();
        } else {
            btn.style.color = 'white'; btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
            document.getElementById('ai-video').srcObject?.getTracks().forEach(t => t.stop());
        }
    };

    async function startAI() {
        const video = document.getElementById('ai-video');
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        const faceapi = ml5.faceApi(video, { withLandmarks: false, withDescriptors: false }, () => {
            setInterval(() => {
                if(!aiActive) return;
                faceapi.detect((err, res) => {
                    if(res && res.length > 1) { document.getElementById('game-screen').style.display = 'flex'; initSnake(); }
                });
            }, 1000);
        });
    }

    // --- SNAKE GAME ---
    let gameInt;
    window.startSnakeGame = () => { document.getElementById('game-screen').style.display = 'flex'; initSnake(); };
    window.closeGame = () => { document.getElementById('game-screen').style.display = 'none'; clearInterval(gameInt); };

    window.initSnake = () => {
        const can = document.getElementById('snakeCanvas'); const ctx = can.getContext('2d');
        let snake = [{x:15, y:15}]; let food = {x:5, y:5}; let d={x:1,y:0}; let score = 0;
        clearInterval(gameInt);
        gameInt = setInterval(() => {
            ctx.fillStyle = '#111'; ctx.fillRect(0,0,300,300);
            ctx.fillStyle = '#10b981'; snake.forEach(p => ctx.fillRect(p.x*10, p.y*10, 9, 9));
            ctx.fillStyle = '#ef4444'; ctx.fillRect(food.x*10, food.y*10, 9, 9);
            let head = {x: snake[0].x+d.x, y: snake[0].y+d.y};
            snake.unshift(head);
            if(head.x === food.x && head.y === food.y) { score+=10; document.getElementById('score-display').innerText = score; food = {x:Math.floor(Math.random()*29), y:Math.floor(Math.random()*29)}; } 
            else snake.pop();
        }, 100);
    };

</script>
