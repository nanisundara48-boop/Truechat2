<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Chat - Dual Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- GLOBAL VARIABLES & THEMES --- */
        :root {
            /* Public Theme (Default) */
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --primary: #00e5ff;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --danger: #ff4b2b;
            --success: #00b09b;
            --chat-bubble: #334155;
            --chat-mine: #0284c7;
        }

        body.private-mode {
            /* Private Theme (Romantic) */
            --bg-color: #2a0a18;
            --panel-bg: #4a152c;
            --primary: #ff1493;
            --text-main: #ffe4e1;
            --text-muted: #ffb6c1;
            --danger: #ff0000;
            --success: #ff69b4;
            --chat-bubble: #800040;
            --chat-mine: #c70055;
        }

        body {
            margin: 0; font-family: 'Poppins', sans-serif;
            background: var(--bg-color); color: var(--text-main);
            display: flex; justify-content: center; height: 100vh; overflow: hidden;
            transition: background 0.5s ease;
        }

        .app-container {
            width: 100%; max-width: 500px; height: 100%;
            background: var(--panel-bg); display: flex; flex-direction: column;
            position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.5);
            transition: background 0.5s ease;
        }

        /* --- AUTHENTICATION UI --- */
        #auth-screen {
            padding: 30px; display: flex; flex-direction: column;
            justify-content: center; height: 100%; text-align: center;
        }
        .auth-input {
            width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px;
            background: rgba(0,0,0,0.3); border: 1px solid var(--primary);
            color: white; outline: none; box-sizing: border-box; font-family: inherit;
        }
        .btn-main {
            width: 100%; padding: 15px; border-radius: 12px; border: none;
            background: var(--primary); color: #000; font-weight: bold; font-size: 1rem;
            cursor: pointer; margin-top: 10px; transition: 0.3s;
        }
        .btn-main:hover { transform: scale(1.02); }
        .auth-links { margin-top: 15px; color: var(--primary); cursor: pointer; font-size: 0.9rem; }

        /* --- DASHBOARD UI --- */
        .header {
            padding: 15px 20px; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.2); z-index: 10;
        }
        .profile-area { display: flex; align-items: center; gap: 10px; }
        .dp-circle {
            width: 45px; height: 45px; border-radius: 50%; background: #555;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        .dp-circle img { width: 100%; height: 100%; object-fit: cover; }
        .hidden-trigger { cursor: pointer; user-select: none; }
        
        .tabs { display: flex; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .tab { flex: 1; text-align: center; padding: 15px; cursor: pointer; transition: 0.3s; }
        .tab.active { border-bottom: 3px solid var(--primary); font-weight: bold; }

        .list-container { flex: 1; overflow-y: auto; padding: 10px; }
        .list-item {
            display: flex; align-items: center; padding: 15px; border-radius: 12px;
            margin-bottom: 10px; background: rgba(0,0,0,0.2); cursor: pointer;
            transition: 0.3s;
        }
        .list-item:hover { background: rgba(255,255,255,0.05); }

        /* --- DANGER ANIMATION (SWITCHING TO PRIVATE) --- */
        #danger-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 9999; display: none;
            flex-direction: column; justify-content: center; align-items: center;
            animation: flashBg 1s infinite alternate;
        }
        @keyframes flashBg {
            0% { background: rgba(50,0,0,0.9); }
            100% { background: rgba(200,0,0,0.95); }
        }
        .danger-icon {
            font-size: 5rem; color: #ff0000; animation: shake 0.5s infinite; text-shadow: 0 0 20px #ff0000;
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(5deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            80% { transform: translate(-1px, -1px) rotate(-5deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .bottom-password {
            position: absolute; bottom: 40px; width: 80%;
        }
        .bottom-password input {
            width: 100%; padding: 15px; border-radius: 8px; text-align: center;
            background: #000; color: #ff0000; border: 2px solid #ff0000; font-size: 1.2rem; outline:none;
        }

        /* --- ROMANTIC HEARTS ANIMATION --- */
        .heart { position: absolute; font-size: 1.5rem; color: #ff1493; animation: floatUp 4s linear infinite; opacity: 0; pointer-events: none; z-index: 1;}
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
        #hearts-container { position: absolute; width: 100%; height: 100%; top:0; left:0; pointer-events: none; overflow: hidden; display: none; }
        body.private-mode #hearts-container { display: block; }

        /* --- CHAT INTERFACE --- */
        #chat-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--panel-bg); display: none; flex-direction: column; z-index: 50;
        }
        .chat-header {
            padding: 15px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(0,0,0,0.3); border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        
        .msg-bubble {
            max-width: 75%; padding: 10px 15px; border-radius: 15px; position: relative;
            word-wrap: break-word; user-select: none; transition: 0.2s;
        }
        .msg-bubble.mine { align-self: flex-end; background: var(--chat-mine); border-bottom-right-radius: 2px; }
        .msg-bubble.theirs { align-self: flex-start; background: var(--chat-bubble); border-bottom-left-radius: 2px; }
        .msg-time { font-size: 0.7rem; color: rgba(255,255,255,0.6); text-align: right; margin-top: 5px; }
        
        .tick { color: #aaa; margin-left: 5px; }
        .tick.read { color: #34b7f1; } /* Blue tick */

        .chat-input-area {
            display: flex; padding: 10px; background: rgba(0,0,0,0.3); align-items: center; gap: 10px;
        }
        .chat-input-area input {
            flex: 1; padding: 12px; border-radius: 20px; border: none; outline: none;
            background: rgba(255,255,255,0.1); color: white;
        }
        .icon-btn { background: none; border: none; color: var(--primary); font-size: 1.2rem; cursor: pointer; }
        .recording { color: var(--danger); animation: flashBg 1s infinite alternate; border-radius: 50%; }

        /* --- LONG PRESS CONTEXT MENU --- */
        #context-menu {
            position: absolute; background: #000; border: 1px solid var(--primary);
            border-radius: 8px; padding: 10px; display: none; flex-direction: column; z-index: 100;
        }
        #context-menu button {
            background: none; border: none; color: white; padding: 10px; text-align: left; cursor: pointer;
        }
        #context-menu button:hover { color: var(--danger); }

        /* --- UNIQUE CALLER UI --- */
        #call-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: none; flex-direction: column; z-index: 200;
        }
        .caller-video { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        .caller-overlay {
            position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column;
            justify-content: space-between; padding: 40px 20px; box-sizing: border-box; z-index: 201;
        }
        .call-controls { display: flex; justify-content: space-around; background: rgba(0,0,0,0.5); padding: 20px; border-radius: 20px; backdrop-filter: blur(10px); }
        .ctrl-btn { width: 50px; height: 50px; border-radius: 50%; border: none; cursor: pointer; font-size: 1.2rem; color: white; background: rgba(255,255,255,0.2); }
        .ctrl-btn.active { background: var(--primary); color: #000; }
        .ctrl-btn.hangup { background: var(--danger); }

        /* Modals */
        .modal {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 300;
        }
        .modal-content { background: var(--panel-bg); padding: 20px; border-radius: 12px; width: 80%; text-align: center; }

    </style>
</head>
<body>

    <div id="hearts-container"></div>

    <div class="app-container">
        
        <div id="auth-screen">
            <h1 style="color:var(--primary);"><i class="fa-solid fa-ghost"></i> Ghost Chat</h1>
            <input type="email" id="auth-email" class="auth-input" placeholder="Email Address">
            <input type="password" id="auth-pass" class="auth-input" placeholder="Password">
            <input type="text" id="auth-user" class="auth-input" placeholder="Username (Signup Only)" style="display:none;">
            
            <button class="btn-main" id="btn-login" onclick="login()">Login</button>
            <button class="btn-main" id="btn-signup" onclick="signup()" style="display:none;">Create Account</button>
            
            <div class="auth-links" onclick="toggleAuth()">New User? Sign Up</div>
            <div class="auth-links" onclick="forgotPassword()" style="color:var(--text-muted);">Forgot Password?</div>
        </div>

        <div id="dashboard" style="display:none; height:100%; flex-direction:column;">
            <div class="header">
                <div class="profile-area">
                    <div class="dp-circle" onclick="openSettings()"><i class="fa-solid fa-user"></i></div>
                    <div class="hidden-trigger" onmousedown="startPrivateTimer()" onmouseup="clearPrivateTimer()" ontouchstart="startPrivateTimer()" ontouchend="clearPrivateTimer()">
                        <div id="my-username" style="font-weight:bold; font-size:1.1rem;">Username</div>
                        <div style="font-size:0.7rem; color:var(--text-muted);">Online</div>
                    </div>
                </div>
                <div style="display:flex; gap:15px;">
                    <i class="fa-solid fa-user-plus icon-btn" onclick="openSearchModal()"></i>
                    <i class="fa-solid fa-right-from-bracket icon-btn" onclick="logout()" style="color:var(--danger);"></i>
                </div>
            </div>

            <div class="tabs">
                <div class="tab active" onclick="switchTab('chats')">Chats</div>
                <div class="tab" onclick="switchTab('calls')">Call History</div>
            </div>

            <div class="list-container" id="chats-list"><i>Loading chats...</i></div>
            <div class="list-container" id="calls-list" style="display:none;"><i>No call history.</i></div>
        </div>

        <div id="chat-screen">
            <div class="chat-header">
                <div style="display:flex; align-items:center; gap:10px;">
                    <i class="fa-solid fa-arrow-left icon-btn" onclick="closeChat()"></i>
                    <div class="dp-circle" style="width:35px; height:35px;"><i class="fa-solid fa-user"></i></div>
                    <div id="chat-partner-name" style="font-weight:bold;">Partner</div>
                </div>
                <div style="display:flex; gap:15px;">
                    <i class="fa-solid fa-phone icon-btn" onclick="startCall('voice')"></i>
                    <i class="fa-solid fa-video icon-btn" onclick="startCall('video')"></i>
                </div>
            </div>
            
            <div class="chat-messages" id="chat-messages"></div>
            
            <div class="chat-input-area">
                <input type="text" id="msg-input" placeholder="Type a message...">
                <button class="icon-btn" id="btn-mic" onmousedown="startVoiceRecord()" onmouseup="stopVoiceRecord()"><i class="fa-solid fa-microphone"></i></button>
                <button class="icon-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>

        <div id="call-screen">
            <video id="local-video" class="caller-video" style="z-index: 199;" autoplay muted playsinline></video>
            <div class="caller-overlay">
                <div style="text-align:center;">
                    <h2 id="calling-name">Partner Name</h2>
                    <p id="call-status">Ringing...</p>
                    <p id="call-timer" style="display:none;">00:00</p>
                </div>
                <div class="call-controls">
                    <button class="ctrl-btn" id="btn-mute" onclick="toggleMute()"><i class="fa-solid fa-microphone-slash"></i></button>
                    <button class="ctrl-btn" id="btn-video" onclick="toggleVideo()"><i class="fa-solid fa-video-slash"></i></button>
                    <button class="ctrl-btn" id="btn-switch-cam" onclick="switchCamera()"><i class="fa-solid fa-camera-rotate"></i></button>
                    <button class="ctrl-btn" id="btn-hold" onclick="toggleHold()"><i class="fa-solid fa-pause"></i></button>
                    <button class="ctrl-btn hangup" onclick="hangup()"><i class="fa-solid fa-phone-slash"></i></button>
                </div>
            </div>
        </div>

        <div id="danger-overlay">
            <i class="fa-solid fa-skull danger-icon"></i>
            <h2 style="color:red; letter-spacing: 2px; text-shadow: 0 0 10px red;">RESTRICTED AREA</h2>
            <div class="bottom-password">
                <input type="password" id="private-pass-input" placeholder="ENTER ACCESS CODE" onkeypress="verifyPrivatePass(event)">
                <p id="private-hint" style="color:#aaa; font-size:0.8rem; text-align:center; display:none;">Create a new code for Private Mode</p>
            </div>
        </div>

        <div class="modal" id="search-modal">
            <div class="modal-content">
                <h3>Add Friend</h3>
                <input type="text" id="search-input" class="auth-input" placeholder="Search exactly by username">
                <button class="btn-main" onclick="addFriend()">Search & Add</button>
                <button class="btn-main" style="background:#555; margin-top:10px;" onclick="document.getElementById('search-modal').style.display='none'">Cancel</button>
            </div>
        </div>

        <div class="modal" id="settings-modal">
            <div class="modal-content">
                <h3>Account Info</h3>
                <input type="text" id="new-username" class="auth-input" placeholder="New Username">
                <button class="btn-main" onclick="updateUsername()">Change Username</button>
                <button class="btn-main" style="background:#555; margin-top:10px;" onclick="document.getElementById('settings-modal').style.display='none'">Close</button>
            </div>
        </div>

        <div id="context-menu">
            <button onclick="deleteMsg('me')"><i class="fa-solid fa-trash"></i> Delete for me</button>
            <button onclick="deleteMsg('everyone')" id="btn-del-everyone"><i class="fa-solid fa-trash-can"></i> Delete for everyone</button>
            <button onclick="document.getElementById('context-menu').style.display='none'">Cancel</button>
        </div>

    </div>

<script type="module">
    // --- FIREBASE INITIALIZATION ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, onSnapshot, addDoc, query, where, getDocs, orderBy, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDMSGPEngVmGtTRfcnIC4unH7Rh3FwgcRE",
        authDomain: "sv-billing-250c2.firebaseapp.com",
        projectId: "sv-billing-250c2",
        storageBucket: "sv-billing-250c2.firebasestorage.app",
        messagingSenderId: "847927101892",
        appId: "1:847927101892:web:800c182fe47f133d537c91"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // --- GLOBAL STATE ---
    let currentUser = null;
    let userData = null;
    let isLoginMode = true;
    let isPrivateMode = false;
    let currentChatId = null;
    let currentPartnerId = null;
    let currentPartnerName = "";
    
    // Media & Call State
    let mediaRecorder;
    let audioChunks = [];
    let localStream;
    let callTimerInt;
    let currentRingtone = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
    currentRingtone.loop = true;

    // --- AUTHENTICATION LOGIC ---
    window.toggleAuth = () => {
        isLoginMode = !isLoginMode;
        document.getElementById('auth-user').style.display = isLoginMode ? 'none' : 'block';
        document.getElementById('btn-login').style.display = isLoginMode ? 'block' : 'none';
        document.getElementById('btn-signup').style.display = isLoginMode ? 'none' : 'block';
    };

    window.login = async () => {
        const e = document.getElementById('auth-email').value;
        const p = document.getElementById('auth-pass').value;
        try { await signInWithEmailAndPassword(auth, e, p); } 
        catch (err) { alert(err.message); }
    };

    window.signup = async () => {
        const e = document.getElementById('auth-email').value;
        const p = document.getElementById('auth-pass').value;
        const u = document.getElementById('auth-user').value;
        if(!u) return alert("Username required");
        try {
            const cred = await createUserWithEmailAndPassword(auth, e, p);
            await setDoc(doc(db, "users", cred.user.uid), {
                email: e, username: u, privateCode: null, isOnline: true
            });
        } catch (err) { alert(err.message); }
    };

    window.forgotPassword = async () => {
        const e = document.getElementById('auth-email').value;
        if(!e) return alert("Enter email first to reset password");
        try {
            await sendPasswordResetEmail(auth, e);
            alert("Password reset email sent!");
        } catch (err) { alert(err.message); }
    };

    window.logout = () => { signOut(auth); };

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'flex';
            
            const docSnap = await getDoc(doc(db, "users", user.uid));
            userData = docSnap.data();
            document.getElementById('my-username').innerText = userData.username;
            
            loadFriendsList();
            listenForCalls();
        } else {
            currentUser = null;
            document.getElementById('auth-screen').style.display = 'flex';
            document.getElementById('dashboard').style.display = 'none';
            disablePrivateMode();
        }
    });

    // --- DASHBOARD & PROFILE ---
    window.switchTab = (tab) => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('chats-list').style.display = tab === 'chats' ? 'block' : 'none';
        document.getElementById('calls-list').style.display = tab === 'calls' ? 'block' : 'none';
        if(tab === 'calls') loadCallHistory();
    };

    window.openSettings = () => { document.getElementById('settings-modal').style.display = 'flex'; };
    
    window.updateUsername = async () => {
        const nu = document.getElementById('new-username').value;
        if(!nu) return;
        await updateDoc(doc(db, "users", currentUser.uid), { username: nu });
        document.getElementById('my-username').innerText = nu;
        userData.username = nu;
        document.getElementById('settings-modal').style.display = 'none';
        alert("Username updated!");
    };

    // --- ADD FRIEND REAL LOGIC ---
    window.openSearchModal = () => { document.getElementById('search-modal').style.display = 'flex'; };
    
    window.addFriend = async () => {
        const uname = document.getElementById('search-input').value.trim();
        if(!uname || uname === userData.username) return alert("Invalid username");
        
        const q = query(collection(db, "users"), where("username", "==", uname));
        const snap = await getDocs(q);
        if(snap.empty) return alert("User not found!");
        
        const targetUser = snap.docs[0];
        const combinedId = currentUser.uid > targetUser.id ? currentUser.uid + targetUser.id : targetUser.id + currentUser.uid;
        
        await setDoc(doc(db, "chats", combinedId), {
            users: [currentUser.uid, targetUser.id],
            isPrivate: isPrivateMode, // Creates relationship based on current mode!
            lastMsg: "Connected", timestamp: Date.now()
        });
        document.getElementById('search-modal').style.display = 'none';
        alert("Friend added to " + (isPrivateMode ? "Private" : "Public") + " list!");
    };

    // --- FETCH CHATS LIST ---
    function loadFriendsList() {
        const q = query(collection(db, "chats"), where("users", "array-contains", currentUser.uid));
        onSnapshot(q, async (snap) => {
            let html = '';
            for (const d of snap.docs) {
                const data = d.data();
                if(data.isPrivate !== isPrivateMode) continue; // Privacy Separation Rule

                const partnerId = data.users.find(id => id !== currentUser.uid);
                const pSnap = await getDoc(doc(db, "users", partnerId));
                if(pSnap.exists()) {
                    const pData = pSnap.data();
                    html += `
                    <div class="list-item" onclick="openChat('${d.id}', '${partnerId}', '${pData.username}')">
                        <div class="dp-circle"><i class="fa-solid fa-user"></i></div>
                        <div style="flex:1; padding-left:10px;">
                            <div style="font-weight:bold;">${pData.username}</div>
                            <div style="font-size:0.8rem; color:var(--text-muted);">${data.lastMsg}</div>
                        </div>
                    </div>`;
                }
            }
            document.getElementById('chats-list').innerHTML = html || "<i>No chats yet. Search & Add friends!</i>";
        });
    }

    // --- DANGER ANIMATION & PRIVATE MODE SWITCHING ---
    let pressTimer;
    window.startPrivateTimer = () => { pressTimer = setTimeout(triggerDangerUI, 1500); }; // Long press 1.5s
    window.clearPrivateTimer = () => { clearTimeout(pressTimer); };

    function triggerDangerUI() {
        if(isPrivateMode) { disablePrivateMode(); return; } // Toggle off
        
        const overlay = document.getElementById('danger-overlay');
        const passInput = document.getElementById('private-pass-input');
        const hint = document.getElementById('private-hint');
        
        overlay.style.display = 'flex';
        passInput.value = '';
        passInput.focus();
        
        if(!userData.privateCode) hint.style.display = 'block'; // Setup first time
        else hint.style.display = 'none';
    }

    window.verifyPrivatePass = async (e) => {
        if(e.key === 'Enter') {
            const val = document.getElementById('private-pass-input').value;
            if(!userData.privateCode) {
                await updateDoc(doc(db, "users", currentUser.uid), { privateCode: val });
                userData.privateCode = val;
                enablePrivateMode();
            } else {
                if(val === userData.privateCode) enablePrivateMode();
                else alert("ACCESS DENIED");
            }
        }
    };

    function enablePrivateMode() {
        document.getElementById('danger-overlay').style.display = 'none';
        document.body.classList.add('private-mode');
        isPrivateMode = true;
        generateRomanticHearts();
        loadFriendsList(); // Reload lists for private
    }

    function disablePrivateMode() {
        document.body.classList.remove('private-mode');
        isPrivateMode = false;
        document.getElementById('hearts-container').innerHTML = ''; // Clear hearts
        loadFriendsList();
    }

    function generateRomanticHearts() {
        const container = document.getElementById('hearts-container');
        container.innerHTML = '';
        for(let i=0; i<20; i++) {
            let heart = document.createElement('i');
            heart.className = Math.random() > 0.5 ? 'fa-solid fa-heart heart' : 'fa-brands fa-gratipay heart';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            heart.style.fontSize = (Math.random() * 1 + 1) + 'rem';
            container.appendChild(heart);
        }
    }

    // --- CHATTING SYSTEM ---
    window.openChat = (chatId, pId, pName) => {
        currentChatId = chatId; currentPartnerId = pId; currentPartnerName = pName;
        document.getElementById('chat-partner-name').innerText = pName;
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'flex';
        
        // Listen to messages
        const q = query(collection(db, `chats/${chatId}/messages`), orderBy('timestamp'));
        onSnapshot(q, (snap) => {
            let html = '';
            snap.forEach(d => {
                const msg = d.data();
                // If deleted for me, skip rendering
                if(msg.deletedFor && msg.deletedFor.includes(currentUser.uid)) return;

                const isMe = msg.sender === currentUser.uid;
                const time = new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                let content = msg.type === 'audio' ? `<audio controls src="${msg.text}" style="height:30px;"></audio>` : msg.text;
                let ticks = isMe ? `<i class="fa-solid fa-check-double tick ${msg.status==='read'?'read':''}"></i>` : '';
                
                // Update read status if I'm receiving
                if(!isMe && msg.status !== 'read') {
                    updateDoc(doc(db, `chats/${chatId}/messages`, d.id), { status: 'read' });
                }

                html += `
                <div class="msg-bubble ${isMe ? 'mine' : 'theirs'}" 
                     onmousedown="holdMsg('${d.id}', ${isMe})" onmouseup="clearHoldMsg()" 
                     ontouchstart="holdMsg('${d.id}', ${isMe})" ontouchend="clearHoldMsg()">
                    ${content}
                    <div class="msg-time">${time} ${ticks}</div>
                </div>`;
            });
            const box = document.getElementById('chat-messages');
            box.innerHTML = html;
            box.scrollTop = box.scrollHeight;
        });
    };

    window.closeChat = () => {
        document.getElementById('chat-screen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'flex';
        currentChatId = null;
    };

    window.sendMessage = async () => {
        const input = document.getElementById('msg-input');
        const txt = input.value.trim();
        if(!txt) return;
        input.value = '';
        
        await addDoc(collection(db, `chats/${currentChatId}/messages`), {
            sender: currentUser.uid, text: txt, type: 'text',
            timestamp: Date.now(), status: 'sent', deletedFor: []
        });
        await updateDoc(doc(db, "chats", currentChatId), { lastMsg: txt });
    };

    // --- HOLD TO DELETE LOGIC ---
    let msgHoldTimer; let selectedMsgId = null;
    window.holdMsg = (msgId, isMe) => {
        msgHoldTimer = setTimeout(() => {
            selectedMsgId = msgId;
            document.getElementById('context-menu').style.display = 'flex';
            document.getElementById('context-menu').style.top = event.clientY + 'px';
            document.getElementById('context-menu').style.left = event.clientX + 'px';
            // Only allow delete for everyone if it's my message
            document.getElementById('btn-del-everyone').style.display = isMe ? 'block' : 'none';
        }, 800);
    };
    window.clearHoldMsg = () => { clearTimeout(msgHoldTimer); };
    
    window.deleteMsg = async (type) => {
        const msgRef = doc(db, `chats/${currentChatId}/messages`, selectedMsgId);
        if(type === 'me') {
            const snap = await getDoc(msgRef);
            let delArr = snap.data().deletedFor || [];
            delArr.push(currentUser.uid);
            await updateDoc(msgRef, { deletedFor: delArr });
        } else if (type === 'everyone') {
            await deleteDoc(msgRef); // Physically remove from DB
        }
        document.getElementById('context-menu').style.display = 'none';
    };

    // --- VOICE RECORDING (Base64 for DB) ---
    window.startVoiceRecord = async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            document.getElementById('btn-mic').classList.add('recording');
            mediaRecorder.start();
            audioChunks = [];
            mediaRecorder.addEventListener("dataavailable", event => { audioChunks.push(event.data); });
        } catch(e) { alert("Microphone access denied"); }
    };
    window.stopVoiceRecord = () => {
        if(!mediaRecorder) return;
        document.getElementById('btn-mic').classList.remove('recording');
        mediaRecorder.stop();
        mediaRecorder.addEventListener("stop", () => {
            const audioBlob = new Blob(audioChunks);
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob); 
            reader.onloadend = async () => {
                const base64Audio = reader.result;
                await addDoc(collection(db, `chats/${currentChatId}/messages`), {
                    sender: currentUser.uid, text: base64Audio, type: 'audio',
                    timestamp: Date.now(), status: 'sent', deletedFor: []
                });
            }
        });
    };

    // --- CALLING ARCHITECTURE (Simulated WebRTC Signaling via DB) ---
    window.startCall = async (type) => {
        document.getElementById('call-screen').style.display = 'flex';
        document.getElementById('calling-name').innerText = currentPartnerName;
        document.getElementById('call-status').innerText = "Calling...";
        
        if(type === 'video') {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('local-video').srcObject = localStream;
            document.getElementById('btn-video').style.display = 'inline-block';
            document.getElementById('btn-switch-cam').style.display = 'inline-block';
        } else {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            document.getElementById('btn-video').style.display = 'none';
            document.getElementById('btn-switch-cam').style.display = 'none';
        }

        // Write Call Signal to DB
        await setDoc(doc(db, "active_calls", currentChatId), {
            caller: currentUser.uid, receiver: currentPartnerId,
            type: type, status: 'ringing', isPrivate: isPrivateMode, timestamp: Date.now()
        });
        
        currentRingtone.play();
    };

    function listenForCalls() {
        if(!currentUser) return;
        const q = query(collection(db, "active_calls"), where("receiver", "==", currentUser.uid));
        onSnapshot(q, (snap) => {
            snap.docChanges().forEach(async change => {
                const data = change.doc.data();
                if(change.type === "added" && data.status === 'ringing') {
                    // Check Privacy scope matching
                    if(data.isPrivate !== isPrivateMode) return; 
                    
                    // Incoming call logic
                    currentChatId = change.doc.id;
                    currentPartnerId = data.caller;
                    document.getElementById('call-screen').style.display = 'flex';
                    document.getElementById('calling-name').innerText = "Incoming Call...";
                    currentRingtone.play();
                    
                    // Auto-accept mock for demo
                    setTimeout(() => { acceptCallLogic(data.type); }, 2000); 
                }
                if(change.type === "modified" && data.status === 'ended') {
                    forceHangupCleanup(); // End call for both
                }
            });
        });
    }

    async function acceptCallLogic(type) {
        currentRingtone.pause();
        document.getElementById('call-status').innerText = "Connected";
        document.getElementById('call-timer').style.display = 'block';
        
        localStream = await navigator.mediaDevices.getUserMedia({ video: type==='video', audio: true });
        document.getElementById('local-video').srcObject = localStream;
        
        let sec = 0;
        callTimerInt = setInterval(() => {
            sec++;
            let m = Math.floor(sec/60).toString().padStart(2,'0');
            let s = (sec%60).toString().padStart(2,'0');
            document.getElementById('call-timer').innerText = `${m}:${s}`;
        }, 1000);

        await updateDoc(doc(db, "active_calls", currentChatId), { status: 'connected' });
    }

    // Call Controls
    window.toggleMute = () => {
        const track = localStream.getAudioTracks()[0];
        track.enabled = !track.enabled;
        document.getElementById('btn-mute').classList.toggle('active');
    };
    window.toggleVideo = () => {
        const track = localStream.getVideoTracks()[0];
        if(track) { track.enabled = !track.enabled; document.getElementById('btn-video').classList.toggle('active'); }
    };
    window.toggleHold = () => { document.getElementById('btn-hold').classList.toggle('active'); };
    window.switchCamera = () => { alert("Switching to back camera (requires WebRTC facingMode toggle)"); };

    window.hangup = async () => {
        await updateDoc(doc(db, "active_calls", currentChatId), { status: 'ended' });
        
        // Log to Call History
        await addDoc(collection(db, "call_history"), {
            uid: currentUser.uid, partner: currentPartnerId, 
            isPrivate: isPrivateMode, time: Date.now(), type: 'outgoing'
        });
        
        forceHangupCleanup();
    };

    function forceHangupCleanup() {
        if(localStream) localStream.getTracks().forEach(track => track.stop());
        clearInterval(callTimerInt);
        currentRingtone.pause();
        document.getElementById('call-screen').style.display = 'none';
        document.getElementById('call-timer').style.display = 'none';
        document.getElementById('call-timer').innerText = "00:00";
    }

    // --- CALL HISTORY ---
     window.loadCallHistory = async () => {
        const q = query(collection(db, "call_history"), where("uid", "==", currentUser.uid), orderBy("time", "desc"));
        const snap = await getDocs(q);
        let html = '';
        for (const d of snap.docs) {
            const data = d.data();
            if(data.isPrivate !== isPrivateMode) continue;
            
            const pSnap = await getDoc(doc(db, "users", data.partner));
            const pName = pSnap.exists() ? pSnap.data().username : "Unknown";
            const timeStr = new Date(data.time).toLocaleString([], {hour:'2-digit', minute:'2-digit', day:'numeric', month:'short'});
            
            html += `
            <div class="list-item">
                <div class="dp-circle"><i class="fa-solid fa-phone"></i></div>
                <div style="flex:1; padding-left:10px;">
                    <div style="font-weight:bold;">${pName}</div>
                    <div style="font-size:0.8rem; color:${data.type==='incoming'?'var(--success)':'var(--primary)'};">
                        ${data.type.toUpperCase()} • ${timeStr}
                    </div>
                </div>
            </div>`;
        }
        document.getElementById('calls-list').innerHTML = html || "<i>No call history.</i>";
    };

</script>
</body>
</html>
