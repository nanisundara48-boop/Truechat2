<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TrueChats - Ultimate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://unpkg.com/ml5@latest/dist/ml5.min.js"></script>
    
    <style>
        /* --- DYNAMIC THEMES & BUBBLE ANIMATION --- */
        :root {
            --bg-panel: rgba(255, 255, 255, 0.85); --bg-hover: rgba(245, 246, 246, 0.9);
            --primary: #00a884; --text-main: #111b21; --text-muted: #667781;
            --danger: #ef4444; --success: #00a884; --chat-mine: #d9fdd3; --chat-theirs: #ffffff;
            --header-bg: rgba(240, 242, 245, 0.95); --footer-bg: rgba(255, 255, 255, 0.95); --border-color: #d1d7db;
            --bg-gradient: linear-gradient(135deg, #e0f2f1, #ffffff, #e8f5e9, #b2dfdb);
        }

        body.dark-mode {
            --bg-panel: rgba(17, 27, 33, 0.85); --bg-hover: rgba(32, 44, 51, 0.9);
            --text-main: #e9edef; --text-muted: #8696a0; --chat-mine: #005c4b; --chat-theirs: #202c33;
            --header-bg: rgba(32, 44, 51, 0.95); --footer-bg: rgba(32, 44, 51, 0.95); --border-color: #2a3942;
            --bg-gradient: linear-gradient(135deg, #0b141a, #111b21, #004d40, #0b141a);
        }

        body.ghost-mode {
            --bg-panel: rgba(36, 0, 16, 0.85); --bg-hover: rgba(61, 0, 27, 0.9);
            --primary: #ff1493; --text-main: #ffe4e1; --text-muted: #ffb6c1; --chat-mine: #8b0046; --chat-theirs: #3d001b;
            --header-bg: rgba(36, 0, 16, 0.95); --footer-bg: rgba(36, 0, 16, 0.95); --border-color: #4a152c;
            --bg-gradient: linear-gradient(135deg, #120008, #240010, #3d001b, #120008);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background: var(--bg-gradient); background-size: 300% 300%; animation: gradMove 12s ease infinite; color: var(--text-main); height: 100dvh; width: 100vw; display: flex; flex-direction: column; overflow: hidden; position: relative;}
        @keyframes gradMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        /* Floating Particles */
        .particle { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.1); animation: floatUp 10s linear infinite; pointer-events: none; z-index: 0; }
        @keyframes floatUp { 0% { transform: translateY(100dvh) scale(0); opacity: 1; } 100% { transform: translateY(-10dvh) scale(1.5); opacity: 0; } }

        .header { height: 65px; flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; background: var(--header-bg); border-bottom: 1px solid var(--border-color); z-index: 10; backdrop-filter: blur(10px); }
        .main-content { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; z-index: 1; }
        .footer-nav { height: 60px; flex-shrink: 0; display: flex; justify-content: space-around; align-items: center; background: var(--footer-bg); border-top: 1px solid var(--border-color); z-index: 10; padding-bottom: env(safe-area-inset-bottom); backdrop-filter: blur(10px); }

        .icon-btn { background: none; border: none; color: var(--text-muted); font-size: 1.3rem; cursor: pointer; padding: 10px; transition: 0.2s; }
        .icon-btn:hover, .icon-btn.active { color: var(--primary); }
        .dp-circle { width: 42px; height: 42px; border-radius: 50%; background: #ccc; overflow: hidden; display: flex; justify-content: center; align-items: center; cursor: pointer; border: 1px solid var(--primary); flex-shrink: 0; }
        .dp-circle img { width: 100%; height: 100%; object-fit: cover; }
        
        .list-view { display: none; padding: 10px; height: 100%; }
        .list-view.active { display: block; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .list-item { display: flex; align-items: center; padding: 12px 10px; border-radius: 12px; margin-bottom: 5px; cursor: pointer; background: var(--bg-panel); border: 1px solid var(--border-color); backdrop-filter: blur(5px); }
        .item-info { flex: 1; padding-left: 15px; overflow: hidden; }
        .item-title { font-weight: 600; font-size: 1rem; color: var(--text-main); white-space: nowrap; text-overflow: ellipsis; }
        .item-sub { font-size: 0.85rem; color: var(--text-muted); margin-top: 3px; }
        .status-badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .badge-pending { background: #f59e0b; color: white; } .badge-accepted { background: var(--success); color: white; } .badge-rejected { background: var(--danger); color: white; }

        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 0.75rem; gap: 4px; cursor: pointer; width: 25%; }
        .nav-item.active { color: var(--primary); }

        .input-box { width: 100%; padding: 12px 15px; background: transparent; border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-main); outline: none; margin-bottom: 10px; font-size: 1rem; backdrop-filter: blur(5px); }
        .btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-sm { width: auto; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; }
        .btn-danger { background: var(--danger); }

        /* --- CHAT SCREEN --- */
        #chat-screen { position: absolute; top:0; left:0; width:100%; height:100dvh; background: var(--bg-gradient); background-size: 300% 300%; animation: gradMove 12s ease infinite; display: none; flex-direction: column; z-index: 100; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; z-index: 1; }
        .msg-bubble { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.1); transition: filter 0.3s ease;}
        .msg-mine { align-self: flex-end; background: var(--chat-mine); border-top-right-radius: 0; }
        .msg-theirs { align-self: flex-start; background: var(--chat-theirs); border-top-left-radius: 0; }
        .blurred-msg .msg-bubble { filter: blur(8px); }
        .blurred-msg .msg-bubble:active { filter: blur(0); }
        .msg-bubble img, .msg-bubble video { max-width: 100%; border-radius: 8px; margin-top: 5px; }
        
        .chat-input-area { min-height: 60px; padding: 10px; background: var(--header-bg); display: flex; align-items: center; gap: 8px; backdrop-filter: blur(10px); z-index: 2; }
        .chat-input-area input { flex: 1; padding: 12px 15px; border-radius: 20px; border: none; background: var(--bg-panel); color: var(--text-main); border: 1px solid var(--border-color); outline: none;}

        /* --- SNAPSHOTS UI --- */
        .snap-item { display:flex; justify-content:space-between; align-items:center; background:var(--bg-panel); padding:15px; border-radius:12px; margin-bottom:10px; border:1px solid var(--primary); }
        #snap-camera-view { position:absolute; top:0; left:0; width:100%; height:100dvh; background:#000; display:none; flex-direction:column; z-index:200; color:white; }
        #snap-video { width:100%; height:100%; object-fit:cover; position:absolute; top:0; left:0; }
        .snap-overlay { position:absolute; top:20px; left:20px; z-index:10; text-shadow: 2px 2px 4px #000; }
        .snap-time { font-size:1.5rem; font-weight:bold; }
        .snap-date { font-size:1rem; }
        .snap-loc { font-family: 'Courier Prime', monospace; font-size:1.8rem; font-weight:bold; color:#ffeb3b; margin-top:10px; text-transform:uppercase; }
        .snap-controls { position:absolute; bottom:30px; width:100%; display:flex; justify-content:space-around; align-items:center; z-index:10; }
        .capture-btn { width:70px; height:70px; border-radius:50%; border:4px solid white; background:rgba(255,255,255,0.3); cursor:pointer; }
        
        #snap-view-modal { position:absolute; top:0; left:0; width:100%; height:100dvh; background:#000; display:none; flex-direction:column; z-index:250; }
        .snap-timer-bar { height:5px; background:var(--primary); width:100%; transition: width 1s linear; }

        /* --- MODALS & GAMES --- */
        .modal { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 200; padding: 20px; backdrop-filter: blur(5px);}
        .modal-content { background: var(--bg-panel); padding: 20px; border-radius: 15px; width: 100%; max-width: 320px; border: 1px solid var(--border-color); }
        
        #game-screen { position: absolute; top:0; left:0; width:100%; height:100%; background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; color: white; }
        
        /* --- CALLING UI --- */
        #call-screen { position: absolute; top:0; left:0; width:100%; height:100%; background: #1a1a1a; display: none; flex-direction: column; z-index: 2000; color: white; }
        .call-video { position: absolute; top:0; left:0; width:100%; height:100%; object-fit: cover; }
        .remote-video { width: 100%; height: 100%; }
        .local-video { position: absolute; top: 20px; right: 20px; width: 100px; height: 150px; border-radius: 10px; object-fit: cover; border: 2px solid white; z-index: 5; background: #000; }
        .call-controls { position: absolute; bottom: 40px; width: 100%; display: flex; justify-content: space-evenly; align-items: center; z-index: 10; }
        .call-btn { width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 1.5rem; color: white; background: rgba(255,255,255,0.2); cursor: pointer; backdrop-filter: blur(5px); }
        .call-btn.hangup { background: var(--danger); }
        .call-btn.accept { background: var(--success); }
    </style>
</head>
<body class="light-mode">

    <div id="particles"></div>
    <audio id="ringtone" loop src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>
    <video id="ai-video" style="display:none;" width="320" height="240" autoplay muted></video>

        <input type="email" id="auth-email" class="input-box" placeholder="Email Address">
        <input type="password" id="auth-pass" class="input-box" placeholder="Password">
        <input type="text" id="auth-user" class="input-box" placeholder="Username (Signup only)" style="display:none;">

        <button class="btn" id="btn-signup" onclick="signup()" style="display:none;">Create Account</button>
        <p onclick="toggleAuth()" style="color:var(--primary); margin-top:20px; text-align:center; cursor:pointer;">New User? Sign Up Here</p>
    </div>

    <div id="main-app" style="display:none; flex-direction:column; height:100dvh;">
        <header class="header">
            <div style="display:flex; align-items:center; gap:12px;">
                <div class="dp-circle" onclick="document.getElementById('dp-upload').click()"><img id="my-dp" src="https://via.placeholder.com/42"></div>
                <div>
                    <div id="my-username" style="font-weight:600;" onmousedown="startGhostTimer()" onmouseup="clearGhostTimer()" ontouchstart="startGhostTimer()" ontouchend="clearGhostTimer()">User</div>
                    <div style="font-size:0.7rem; color:var(--success);"><i class="fa-solid fa-shield-check"></i> Secured</div>
                </div>
            </div>
            <div>
                <button class="icon-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
                <button class="icon-btn" id="ai-toggle" onclick="toggleAI()"><i class="fa-solid fa-user-shield"></i></button>
            </div>
        </header>

        <main class="main-content">
            <div class="list-view active" id="tab-chats">
                <div id="chats-list"></div>
            </div>

            <div class="list-view" id="tab-requests">
                <input type="text" id="search-input" class="input-box" placeholder="Search to add friends..." oninput="searchUsersLive()">
                <div id="search-results" style="margin-bottom:20px;"></div>
                <h3 style="font-size:0.85rem; color:var(--text-muted); margin-bottom:10px; padding-left:5px;">REQUEST HISTORY</h3>
                <div id="requests-list"></div>
            </div>

            <div class="list-view" id="tab-snaps">

                <div id="snaps-list"></div>
                <div style="position:absolute; bottom:20px; width:calc(100% - 20px); text-align:center;">
                    <button class="btn" style="border-radius:30px; font-size:1.1rem; box-shadow: 0 4px 15px rgba(0,168,132,0.5);" onclick="openSnapCamera()"><i class="fa-solid fa-camera"></i> Send Snap</button>

                    <div class="item-title">Snake Classic</div>

            </div>
        </main>

        <footer class="footer-nav">

            <div class="nav-item" onclick="switchNav('games')"><i class="fa-solid fa-gamepad"></i>Games</div>
        </footer>
    </div>

    <div id="chat-screen">
        <header class="header">
            <div style="display:flex; align-items:center; gap:10px;">
                <button class="icon-btn" onclick="closeChat()" style="padding-left:0;"><i class="fa-solid fa-arrow-left"></i></button>
                <div class="dp-circle" style="width:36px; height:36px;"><img id="partner-dp" src="https://via.placeholder.com/36"></div>
                <div style="max-width:140px; cursor:pointer;" onclick="document.getElementById('chat-options-modal').style.display='flex'">
                    <div id="chat-partner-name" style="font-weight:600; font-size:1rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Partner</div>

    // --- AUTH ---
    let isLoginMode = true;
    window.toggleAuth = () => { isLoginMode = !isLoginMode; document.getElementById('auth-user').style.display = isLoginMode ? 'none' : 'block'; document.getElementById('btn-login').style.display = isLoginMode ? 'block' : 'none'; document.getElementById('btn-signup').style.display = isLoginMode ? 'none' : 'block'; };
    window.login = async () => { try { await signInWithEmailAndPassword(auth, document.getElementById('auth-email').value, document.getElementById('auth-pass').value); } catch(err) { alert(err.message); } };
    window.signup = async () => { const e=document.getElementById('auth-email').value, p=document.getElementById('auth-pass').value, u=document.getElementById('auth-user').value; if(!u) return; try { const cred = await createUserWithEmailAndPassword(auth, e, p); await setDoc(doc(db, "users", cred.user.uid), { username: u, dp: "" }); } catch(err) { alert(err.message); } };

    onAuthStateChanged(auth, async (user) => {
        if(user) {
            currentUser = user; const snap = await getDoc(doc(db, "users", user.uid)); userData = snap.data();
            document.getElementById('auth-screen').style.display = 'none'; document.getElementById('main-app').style.display = 'flex';
            document.getElementById('my-username').innerText = userData.username;
            if(userData.dp) document.getElementById('my-dp').src = userData.dp;
            loadChats(); loadRequests(); loadSnaps(); listenForIncomingCalls();
        }
    });

    window.switchNav = (tab) => { document.querySelectorAll('.list-view').forEach(el => el.classList.remove('active')); document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active')); document.getElementById(`tab-${tab}`).classList.add('active'); event.currentTarget.classList.add('active'); };
    
    // --- SEARCH & REQUESTS (FIXED HISTORY) ---
    window.searchUsersLive = async () => {
        const text = document.getElementById('search-input').value.toLowerCase().trim(); const resBox = document.getElementById('search-results');
        if(text.length < 2) { resBox.innerHTML = ''; return; }
        const snap = await getDocs(collection(db, "users")); let html = '';
        snap.forEach(d => { if(d.id !== currentUser.uid && d.data().username?.toLowerCase().includes(text)) { html += `<div class="list-item"><div class="dp-circle" style="width:36px;height:36px;"><img src="${d.data().dp||'https://via.placeholder.com/36'}"></div><div class="item-info"><div class="item-title">${d.data().username}</div></div><button class="btn btn-sm" onclick="sendRequest('${d.id}', '${d.data().username}')">Add</button></div>`; } });
        resBox.innerHTML = html || "<p style='padding:10px; font-size:0.8rem;'>No users found</p>";
    };

    window.sendRequest = async (tid, tName) => { await setDoc(doc(db, `friend_requests/${currentUser.uid}_${tid}`), { sender: currentUser.uid, senderName: userData.username, receiver: tid, status: 'pending', timestamp: Date.now() }); alert(`Request sent to ${tName}`); document.getElementById('search-input').value=''; document.getElementById('search-results').innerHTML=''; };

    function loadRequests() {
        onSnapshot(query(collection(db, "friend_requests"), where("receiver", "==", currentUser.uid), orderBy("timestamp", "desc")), (snap) => {
            let html = ''; snap.forEach(d => { 
                const req = d.data(); 
                html += `<div class="list-item"><div class="item-info"><div class="item-title">${req.senderName}</div>`;
                if(req.status === 'pending') { html += `<div class="item-sub">Wants to connect</div></div><div style="display:flex; gap:8px;"><button class="btn btn-sm" style="background:var(--success);" onclick="acceptReq('${d.id}', '${req.sender}')"><i class="fa-solid fa-check"></i></button><button class="btn btn-sm btn-danger" onclick="rejectReq('${d.id}')"><i class="fa-solid fa-xmark"></i></button></div></div>`; } 
                else if (req.status === 'accepted') { html += `<div class="item-sub"><span class="status-badge badge-accepted">Accepted</span></div></div></div>`; }
                else { html += `<div class="item-sub"><span class="status-badge badge-rejected">Rejected</span></div></div></div>`; }
            });
            document.getElementById('requests-list').innerHTML = html || "<p style='padding:10px; font-size:0.8rem;'>No request history.</p>";
        });
    }

    // FIX: Explictly set isPrivate to false so chat isn't hidden
    window.acceptReq = async (reqId, senderId) => {
        await updateDoc(doc(db, "friend_requests", reqId), { status: 'accepted' });
        const chatId = currentUser.uid > senderId ? currentUser.uid + senderId : senderId + currentUser.uid;
        await setDoc(doc(db, "chats", chatId), { users: [currentUser.uid, senderId], isPrivate: false, blocked: [] }, {merge: true});
        switchNav('chats');
    };
    window.rejectReq = async (reqId) => { await updateDoc(doc(db, "friend_requests", reqId), { status: 'rejected' }); };

    // --- ENCRYPTION & COMPRESSION ---
    function encryptData(data) { return CryptoJS.AES.encrypt(data, "truechat-key").toString(); }
    function decryptData(cipher) { try { return CryptoJS.AES.decrypt(cipher, "truechat-key").toString(CryptoJS.enc.Utf8); } catch(e) { return "🔒 Encrypted"; } }

    window.updateDP = async (e) => { const file = e.target.files[0]; if(!file) return; const b64 = await compressImage(file, 200); await updateDoc(doc(db, "users", currentUser.uid), { dp: b64 }); document.getElementById('my-dp').src = b64; userData.dp = b64; };
    window.handleMediaUpload = async (e) => { const file = e.target.files[0]; if(!file) return; const b64 = await compressImage(file, 600); const encMsg = encryptData(b64); await addDoc(collection(db, `chats/${currentChatId}/messages`), { sender: currentUser.uid, text: encMsg, type: 'image', timestamp: Date.now() }); };
    function compressImage(file, maxW) { return new Promise(res => { const reader = new FileReader(); reader.readAsDataURL(file); reader.onload = e => { const img = new Image(); img.src = e.target.result; img.onload = () => { const cvs = document.createElement('canvas'); const scale = maxW/img.width; cvs.width = maxW; cvs.height = img.height*scale; cvs.getContext('2d').drawImage(img,0,0,cvs.width,cvs.height); res(cvs.toDataURL('image/jpeg',0.7)); }} }); }

    // --- CHATS ---
    function loadChats() {
        onSnapshot(query(collection(db, "chats"), where("users", "array-contains", currentUser.uid)), (snap) => {
            let html = ''; myFriendsList = []; // Populate for snaps
            snap.forEach(async d => {
                const chat = d.data(); if((chat.isPrivate||false) !== isPrivate) return;
                const partnerId = chat.users.find(id => id !== currentUser.uid); const pSnap = await getDoc(doc(db, "users", partnerId));
                if(pSnap.exists()) {
                    myFriendsList.push({ id: partnerId, name: pSnap.data().username, chatId: d.id });
                    html += `<div class="list-item" onclick="openChat('${d.id}', '${partnerId}', '${pSnap.data().username}', '${pSnap.data().dp||'https://via.placeholder.com/36'}')">
                        <div class="dp-circle"><img src="${pSnap.data().dp||'https://via.placeholder.com/36'}"></div>
                        <div class="item-info"><div class="item-title">${pSnap.data().username}</div><div class="item-sub" style="color:var(--success)"><i class="fa-solid fa-lock" style="font-size:0.6rem;"></i> Encrypted Chat</div></div>
                    </div>`;
                    document.getElementById('chats-list').innerHTML = html;
                }
            });
            if(snap.empty) document.getElementById('chats-list').innerHTML = "<p style='padding:20px; text-align:center;'>No chats. Go to Requests.</p>";
        });
    }

    window.openChat = async (chatId, pId, pName, dpSrc) => {
        currentChatId = chatId; currentPartnerId = pId; document.getElementById('chat-partner-name').innerText = pName; document.getElementById('partner-dp').src = dpSrc; document.getElementById('chat-screen').style.display = 'flex'; document.getElementById('opt-title').innerText = `Options: ${pName}`;
        onSnapshot(doc(db, "chats", chatId), (d) => { chatDataRaw = d.data(); document.getElementById('block-btn').innerText = chatDataRaw?.blocked?.includes(currentUser.uid) ? "Unblock User" : "Block User"; });
        onSnapshot(query(collection(db, `chats/${chatId}/messages`), orderBy("timestamp")), (snap) => {
            if(snap.empty) document.getElementById('msg-input').value = "Hi 👋";
            let html = ''; snap.forEach(m => {
                const msg = m.data(); const isMe = msg.sender === currentUser.uid;
                const dec = decryptData(msg.text); const content = msg.type==='image' ? `<img src="${dec}">` : dec;
                html += `<div class="msg-container ${maskActive?'blurred-msg':''}"><div class="msg-bubble ${isMe?'msg-mine':'msg-theirs'}">${content}</div></div>`;
            });
            document.getElementById('chat-messages').innerHTML = html; setTimeout(()=>document.getElementById('chat-messages').scrollTop = 9999, 100);
        });
    };
    window.closeChat = () => { document.getElementById('chat-screen').style.display = 'none'; currentChatId = null; };
    window.sendMessage = async () => { if(chatDataRaw?.blocked?.length > 0) return alert("Blocked."); const inp = document.getElementById('msg-input'); const t = inp.value.trim(); if(!t) return; inp.value = ''; await addDoc(collection(db, `chats/${currentChatId}/messages`), { sender: currentUser.uid, text: encryptData(t), type: 'text', timestamp: Date.now() }); };

    window.clearChat = async () => { if(!confirm("Clear all messages?")) return; const snap = await getDocs(collection(db, `chats/${currentChatId}/messages`)); snap.forEach(d => deleteDoc(d.ref)); document.getElementById('chat-options-modal').style.display='none'; };
    window.blockUser = async () => { let blk = chatDataRaw?.blocked || []; if(blk.includes(currentUser.uid)) blk = blk.filter(id=>id!==currentUser.uid); else blk.push(currentUser.uid); await updateDoc(doc(db, "chats", currentChatId), { blocked: blk }); document.getElementById('chat-options-modal').style.display='none'; };
    window.removeFriend = async () => { if(confirm("Remove friend entirely?")) { await deleteDoc(doc(db, "chats", currentChatId)); closeChat(); document.getElementById('chat-options-modal').style.display='none'; }};
    window.toggleMask = () => { maskActive = !maskActive; document.getElementById('mask-btn').style.color = maskActive?'var(--primary)':'var(--text-muted)'; if(currentChatId) openChat(currentChatId, currentPartnerId, document.getElementById('chat-partner-name').innerText, document.getElementById('partner-dp').src); };

    // --- SNAPSHOTS FEATURE ---
    let capturedSnapBase64 = null;
    setInterval(() => {
        const d = new Date();
        document.getElementById('snap-time-disp').innerText = d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        document.getElementById('snap-date-disp').innerText = d.toLocaleDateString([], {month:'short', day:'numeric', year:'numeric'});
    }, 1000);

    window.openSnapCamera = async () => {
        document.getElementById('snap-camera-view').style.display = 'flex'; document.getElementById('snap-loc-disp').innerText = '';
        try { snapStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } }); document.getElementById('snap-video').srcObject = snapStream; } catch(e) { alert("Camera access denied"); }
    };
    window.closeSnapCamera = () => { document.getElementById('snap-camera-view').style.display = 'none'; snapStream?.getTracks().forEach(t=>t.stop()); };
    window.addLocation = () => {
        if(navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`)
                .then(r=>r.json()).then(data => { document.getElementById('snap-loc-disp').innerText = data.address.city || data.address.town || data.address.county || "UNKNOWN LOC"; });
            });
        }
    };
    
    window.captureSnap = () => {
        const vid = document.getElementById('snap-video'); const cvs = document.createElement('canvas');
        cvs.width = vid.videoWidth; cvs.height = vid.videoHeight; const ctx = cvs.getContext('2d');
        ctx.drawImage(vid, 0, 0, cvs.width, cvs.height);
        // Draw Overlay Data on Image
        ctx.fillStyle = "white"; ctx.shadowColor = "black"; ctx.shadowBlur = 4; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
        ctx.font = "bold 30px Arial"; ctx.fillText(document.getElementById('snap-time-disp').innerText, 20, 50);
        ctx.font = "20px Arial"; ctx.fillText(document.getElementById('snap-date-disp').innerText, 20, 80);
        const loc = document.getElementById('snap-loc-disp').innerText;
        if(loc) { ctx.fillStyle = "#ffeb3b"; ctx.font = "bold 40px 'Courier New'"; ctx.fillText(loc, 20, 130); }
        
        capturedSnapBase64 = cvs.toDataURL('image/jpeg', 0.8);
        
        // Show Send Modal
        document.getElementById('snap-send-modal').style.display = 'flex';
        let html = ''; myFriendsList.forEach(f => { html += `<div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid var(--border-color); color:var(--text-main);"><label>${f.name}</label><input type="checkbox" class="snap-cb" value="${f.id}"></div>`; });
        document.getElementById('snap-friends-list').innerHTML = html;
    };

    window.selectAllSnaps = () => { document.querySelectorAll('.snap-cb').forEach(cb => cb.checked = true); };
    window.sendSnapFinal = async () => {
        let receivers = []; document.querySelectorAll('.snap-cb:checked').forEach(cb => receivers.push(cb.value));
        if(receivers.length === 0) return alert("Select at least one friend");
        await addDoc(collection(db, "snaps"), { sender: currentUser.uid, senderName: userData.username, receivers: receivers, image: encryptData(capturedSnapBase64), timestamp: Date.now() });
        document.getElementById('snap-send-modal').style.display = 'none'; closeSnapCamera(); alert("Snap Sent!");
    };

    function loadSnaps() {
        onSnapshot(query(collection(db, "snaps"), where("receivers", "array-contains", currentUser.uid)), (snap) => {
            let html = ''; snap.forEach(d => {
                html += `<div class="snap-item" onclick="viewSnap('${d.id}', '${d.data().image}', '${d.data().sender}')">
                    <div style="display:flex; align-items:center; gap:10px;"><div class="dp-circle" style="background:var(--danger); color:white;"><i class="fa-solid fa-camera"></i></div>
                    <div style="font-weight:bold; color:var(--text-main);">${d.data().senderName}</div></div>
                    <div style="font-size:0.8rem; color:var(--danger); font-weight:bold;">Tap to view</div>
                </div>`;
            });
            document.getElementById('snaps-list').innerHTML = html || "<p style='padding:10px; font-size:0.8rem; text-align:center;'>No snaps received</p>";
        });
    }

    window.viewSnap = (snapId, encImg, senderId) => {
        activeSnapData = { snapId, encImg, senderId };
        document.getElementById('snap-view-img').src = decryptData(encImg);
        document.getElementById('snap-view-modal').style.display = 'flex';
        
        let timeLeft = 60; document.getElementById('snap-countdown').innerText = timeLeft + "s";
        document.getElementById('snap-progress').style.width = '100%';
        clearInterval(snapTimer);
        snapTimer = setInterval(async () => {
            timeLeft--; document.getElementById('snap-countdown').innerText = timeLeft + "s";
            document.getElementById('snap-progress').style.width = (timeLeft/60)*100 + '%';
            if(timeLeft <= 0) { clearInterval(snapTimer); await deleteSnapFromDB(); closeSnapView(); }
        }, 1000);
    };

    window.closeSnapView = () => { document.getElementById('snap-view-modal').style.display = 'none'; clearInterval(snapTimer); };
    async function deleteSnapFromDB() {
        const snapDoc = await getDoc(doc(db, "snaps", activeSnapData.snapId));
        if(snapDoc.exists()) {
            let recs = snapDoc.data().receivers.filter(id => id !== currentUser.uid);
            if(recs.length === 0) await deleteDoc(doc(db, "snaps", activeSnapData.snapId)); // Delete entirely if I'm the last receiver
            else await updateDoc(doc(db, "snaps", activeSnapData.snapId), { receivers: recs }); // Just remove me
        }
    }
    
    window.saveSnapToChat = async () => {
        const chatId = currentUser.uid > activeSnapData.senderId ? currentUser.uid + activeSnapData.senderId : activeSnapData.senderId + currentUser.uid;
        await addDoc(collection(db, `chats/${chatId}/messages`), { sender: currentUser.uid, text: activeSnapData.encImg, type: 'image', timestamp: Date.now() });
        alert("Saved to chat!");
    };

    // --- WEBRTC VIDEO CALLS ---
    window.startVideoCall = async () => {
        callDocId = currentChatId; document.getElementById('call-screen').style.display = 'flex'; document.getElementById('calling-name').innerText = document.getElementById('chat-partner-name').innerText; document.getElementById('call-status-text').innerText = "Calling..."; document.getElementById('ringtone').play(); document.getElementById('btn-accept-call').style.display = 'none'; document.getElementById('btn-mute').style.display = 'inline-block';
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true }); document.getElementById('local-video').srcObject = localStream;
        peerConnection = new RTCPeerConnection(servers); remoteStream = new MediaStream(); document.getElementById('remote-video').srcObject = remoteStream;
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream)); peerConnection.ontrack = event => event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
        const callDoc = doc(db, 'calls', callDocId); const offerCandidates = collection(callDoc, 'offerCandidates'); const answerCandidates = collection(callDoc, 'answerCandidates');
        peerConnection.onicecandidate = event => { if(event.candidate) addDoc(offerCandidates, event.candidate.toJSON()); };
        const offerDescription = await peerConnection.createOffer(); await peerConnection.setLocalDescription(offerDescription);
        await setDoc(callDoc, { offer: { sdp: offerDescription.sdp, type: offerDescription.type }, caller: currentUser.uid, receiver: currentPartnerId });
        onSnapshot(callDoc, (snapshot) => { const data = snapshot.data(); if (!peerConnection.currentRemoteDescription && data?.answer) { peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer)); document.getElementById('ringtone').pause(); document.getElementById('call-status-text').innerText = "Connected"; }});
        onSnapshot(answerCandidates, (snapshot) => { snapshot.docChanges().forEach((change) => { if (change.type === 'added') peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data())); }); });
    };

    function listenForIncomingCalls() {
        onSnapshot(query(collection(db, "calls"), where("receiver", "==", currentUser.uid)), (snap) => {
            snap.docChanges().forEach(change => {
                if(change.type === "added") {
                    callDocId = change.doc.id; document.getElementById('call-screen').style.display = 'flex'; document.getElementById('calling-name').innerText = "Incoming Video Call"; document.getElementById('call-status-text').innerText = "Ringing..."; document.getElementById('ringtone').play(); document.getElementById('btn-accept-call').style.display = 'inline-block'; document.getElementById('btn-mute').style.display = 'none';
                }
            });
        });
    }

    window.answerCall = async () => {
        document.getElementById('ringtone').pause(); document.getElementById('btn-accept-call').style.display = 'none'; document.getElementById('btn-mute').style.display = 'inline-block'; document.getElementById('call-status-text').innerText = "Connected";
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true }); document.getElementById('local-video').srcObject = localStream;
        peerConnection = new RTCPeerConnection(servers); remoteStream = new MediaStream(); document.getElementById('remote-video').srcObject = remoteStream;
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream)); peerConnection.ontrack = event => event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
        const callDoc = doc(db, 'calls', callDocId); const answerCandidates = collection(callDoc, 'answerCandidates'); const offerCandidates = collection(callDoc, 'offerCandidates');
        peerConnection.onicecandidate = event => { if(event.candidate) addDoc(answerCandidates, event.candidate.toJSON()); };
        const callData = (await getDoc(callDoc)).data(); await peerConnection.setRemoteDescription(new RTCSessionDescription(callData.offer));
        const answerDescription = await peerConnection.createAnswer(); await peerConnection.setLocalDescription(answerDescription);
        await updateDoc(callDoc, { answer: { type: answerDescription.type, sdp: answerDescription.sdp } });
        onSnapshot(offerCandidates, (snapshot) => { snapshot.docChanges().forEach((change) => { if (change.type === 'added') peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data())); }); });
    };

    window.hangupCall = async () => { document.getElementById('call-screen').style.display = 'none'; document.getElementById('ringtone').pause(); if(localStream) localStream.getTracks().forEach(t => t.stop()); if(remoteStream) remoteStream.getTracks().forEach(t => t.stop()); if(peerConnection) peerConnection.close(); if(callDocId) await deleteDoc(doc(db, 'calls', callDocId)); callDocId = null; };
    window.toggleMute = () => { const t = localStream?.getAudioTracks()[0]; if(t) { t.enabled = !t.enabled; document.getElementById('btn-mute').style.background = t.enabled?'rgba(255,255,255,0.2)':'var(--danger)'; }};

    // --- AI SNOOP DETECTION (FIXED w/ Cocossd) ---
    window.toggleAI = async () => {
        aiActive = !aiActive; const btn = document.getElementById('ai-toggle');
        if(aiActive) {
            btn.style.color = 'var(--success)'; const stream = await navigator.mediaDevices.getUserMedia({ video: true }); document.getElementById('ai-video').srcObject = stream;
            // Using object detector (cocossd) as it reliably loads from CDN
            ml5.objectDetector('cocossd', (err, detector) => {
                if(err) return alert("AI Model failed to load");
                setInterval(() => {
                    if(!aiActive) return;
                    detector.detect(document.getElementById('ai-video'), (err, results) => {
                        if(results) { const persons = results.filter(r => r.label === 'person'); if(persons.length > 1) { switchNav('games'); openGame('snake'); } }
                    });
                }, 1000);
            });
        } else { btn.style.color = 'var(--text-muted)'; document.getElementById('ai-video').srcObject?.getTracks().forEach(t => t.stop()); }
    };

    // --- GAME ---
    let gameInt; let sSnake = [], sFood = {}, sDir = {x:1, y:0};
    window.openGame = (t) => { document.getElementById('game-screen').style.display='flex'; if(t==='snake') initSnake(); };
    window.closeGame = () => { document.getElementById('game-screen').style.display='none'; clearInterval(gameInt); };
    window.initSnake = () => { const ctx = document.getElementById('snakeCanvas').getContext('2d'); sSnake = [{x:15, y:15}]; sFood = {x:5, y:5}; sDir = {x:1, y:0}; let score = 0; clearInterval(gameInt); gameInt = setInterval(() => { ctx.fillStyle = '#111'; ctx.fillRect(0,0,300,300); ctx.fillStyle = '#00a884'; sSnake.forEach(p => ctx.fillRect(p.x*10, p.y*10, 9, 9)); ctx.fillStyle = '#ef4444'; ctx.fillRect(sFood.x*10, sFood.y*10, 9, 9); let head = {x: sSnake[0].x+sDir.x, y: sSnake[0].y+sDir.y}; if(head.x<0||head.x>29||head.y<0||head.y>29) { clearInterval(gameInt); alert(`Game Over! Score: ${score}`); return; } sSnake.unshift(head); if(head.x===sFood.x&&head.y===sFood.y) { score+=10; document.getElementById('score-display').innerText = score; sFood = {x:Math.floor(Math.random()*29), y:Math.floor(Math.random()*29)}; } else sSnake.pop(); }, 100); };
    window.changeDir = (x, y) => { if (sDir.x !== -x && sDir.y !== -y) sDir = {x, y}; };

</script>
</body>
</html>
