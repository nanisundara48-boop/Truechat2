<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghost Chat - Dual Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- GLOBAL VARIABLES & THEMES --- */
        :root {
            --bg-public-1: #0f172a;
            --bg-public-2: #1e293b;
            --panel-bg: rgba(30, 41, 59, 0.85);
            --primary: #00e5ff;
            --text-main: #f8fafc; 
            --text-muted: #94a3b8;
            --danger: #ff4b2b;
            --success: #00b09b;
            --chat-bubble: #334155;
            --chat-mine: #0284c7;
        }

        body.private-mode {
            --bg-public-1: #2a0a18;
            --bg-public-2: #1a050f;
            --panel-bg: rgba(74, 21, 44, 0.9);
            --primary: #ff1493;
            --text-main: #fff0f5; 
            --text-muted: #ffb6c1;
            --danger: #ff0000;
            --success: #ff69b4;
            --chat-bubble: #800040;
            --chat-mine: #c70055;
        }

        html, body { margin: 0; padding: 0; height: 100dvh; width: 100%; box-sizing: border-box; }
        *, *:before, *:after { box-sizing: inherit; }
        
        body {
            font-family: 'Poppins', sans-serif;
            color: var(--text-main);
            display: flex; justify-content: center; height: 100dvh; overflow: hidden;
            transition: background 0.5s ease;
            background: linear-gradient(135deg, var(--bg-public-1), var(--bg-public-2));
            background-size: 400% 400%;
            animation: bgMove 15s ease infinite, thunderFlash 12s infinite;
        }

        body.private-mode { animation: bgMove 10s ease infinite; }

        @keyframes bgMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes thunderFlash {
            0%, 95%, 98%, 100% { filter: brightness(1); }
            96% { filter: brightness(2.5) contrast(1.2); }
            97% { filter: brightness(1.5); }
            99% { filter: brightness(3); }
        }

        .app-container {
            width: 100%; max-width: 500px; height: 100dvh;
            background: var(--panel-bg); display: flex; flex-direction: column;
            position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.8);
            transition: background 0.5s ease; backdrop-filter: blur(5px);
        }

        /* --- GLITCH SYMBOL --- */
        .glitch-bg-icon {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); font-size: 10rem;
            color: rgba(255, 0, 0, 0.08); z-index: 0; pointer-events: none;
        }
        body.private-mode .glitch-bg-icon { display: block; animation: glitchAnim 2.5s infinite; }
        
        @keyframes glitchAnim {
            0% { transform: translate(-50%, -50%) skew(0deg); text-shadow: 3px 0 red, -3px 0 blue; }
            10% { transform: translate(-52%, -50%) skew(-10deg); text-shadow: -3px 0 red, 3px 0 blue; }
            20% { transform: translate(-50%, -48%) skew(10deg); text-shadow: 3px 0 red, -3px 0 blue; }
            30% { transform: translate(-48%, -50%) skew(-5deg); text-shadow: -3px 0 red, 3px 0 blue; }
            40% { transform: translate(-50%, -52%) skew(5deg); text-shadow: 3px 0 red, -3px 0 blue; }
            50% { transform: translate(-50%, -50%) skew(0deg); text-shadow: none; }
            100% { transform: translate(-50%, -50%) skew(0deg); text-shadow: none; }
        }

        /* --- AUTHENTICATION UI --- */
        #auth-screen { padding: 30px; display: flex; flex-direction: column; justify-content: center; height: 100%; text-align: center; z-index: 2; }
        .auth-input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; background: rgba(0,0,0,0.5); border: 1px solid var(--primary); color: var(--text-main); outline: none; font-family: inherit; font-size: 1rem; }
        .btn-main { width: 100%; padding: 15px; border-radius: 12px; border: none; background: var(--primary); color: #000; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-main:hover { transform: scale(1.02); }
        .auth-links { margin-top: 15px; color: var(--primary); cursor: pointer; font-size: 0.9rem; }

        /* --- DASHBOARD UI --- */
        .header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.4); z-index: 10; }
        .profile-area { display: flex; align-items: center; gap: 10px; }
        .dp-circle { width: 45px; height: 45px; border-radius: 50%; background: #555; display: flex; justify-content: center; align-items: center; overflow: hidden; cursor: pointer; }
        .hidden-trigger { cursor: pointer; user-select: none; }
        
        .tabs { display: flex; border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 2; position: relative;}
        .tab { flex: 1; text-align: center; padding: 15px; cursor: pointer; transition: 0.3s; }
        .tab.active { border-bottom: 3px solid var(--primary); font-weight: bold; }

        .list-container { flex: 1; overflow-y: auto; padding: 10px; z-index: 2; position: relative; }
        .list-item { display: flex; align-items: center; padding: 15px; border-radius: 12px; margin-bottom: 10px; background: rgba(0,0,0,0.3); cursor: pointer; transition: 0.3s; border-left: 3px solid transparent; }
        .list-item:hover { background: rgba(255,255,255,0.1); border-left: 3px solid var(--primary); }

        /* --- DANGER ANIMATION --- */
        #danger-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center; animation: flashDanger 0.8s infinite alternate; }
        @keyframes flashDanger { 0% { background: rgba(30,0,0,0.95); } 100% { background: rgba(120,0,0,0.98); } }
        .danger-icon { font-size: 6rem; color: #ff0000; animation: shake 0.5s infinite; text-shadow: 0 0 30px #ff0000; }
        @keyframes shake { 0%, 60% { transform: translate(2px, 2px) rotate(0deg); } 20%, 80% { transform: translate(-3px, 0px) rotate(5deg); } 40%, 100% { transform: translate(2px, -2px) rotate(-1deg); } }
        .bottom-password { position: absolute; bottom: 50px; width: 85%; }
        .bottom-password input { width: 100%; padding: 15px; border-radius: 8px; text-align: center; background: #000; color: #ff0000; border: 2px solid #ff0000; font-size: 1.2rem; outline:none; letter-spacing: 5px; }

        /* --- ROMANTIC HEARTS --- */
        .heart { position: absolute; color: #ff1493; animation: floatUp 4s linear infinite; opacity: 0; pointer-events: none; z-index: 1;}
        @keyframes floatUp { 0% { transform: translateY(100vh) scale(0.5); opacity: 1; } 100% { transform: translateY(-10vh) scale(1.5); opacity: 0; } }
        #hearts-container { position: absolute; width: 100%; height: 100%; top:0; left:0; pointer-events: none; overflow: hidden; display: none; z-index: 1;}
        body.private-mode #hearts-container { display: block; }

        /* --- CHAT INTERFACE --- */
        #chat-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--panel-bg); display: none; flex-direction: column; z-index: 50; }
        .chat-header { padding: 15px; display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.5); border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 10; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; z-index: 2; position: relative;}
        
        .msg-bubble { max-width: 80%; padding: 10px 15px; border-radius: 18px; position: relative; word-wrap: break-word; user-select: none; transition: 0.2s; font-size: 0.95rem; line-height: 1.4; }
        .msg-bubble.mine { align-self: flex-end; background: var(--chat-mine); border-bottom-right-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);}
        .msg-bubble.theirs { align-self: flex-start; background: var(--chat-bubble); border-bottom-left-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);}
        .msg-time { font-size: 0.7rem; color: rgba(255,255,255,0.7); text-align: right; margin-top: 5px; }
        audio { height: 35px; max-width: 220px; outline: none; border-radius: 20px; }
        .tick { color: #aaa; margin-left: 5px; font-size: 0.8rem;}
        .tick.read { color: #34b7f1; } 

        .chat-input-area { display: flex; padding: 12px; background: rgba(0,0,0,0.6); align-items: center; gap: 10px; z-index: 10; }
        .chat-input-area input { flex: 1; padding: 14px 18px; border-radius: 25px; border: none; outline: none; background: rgba(255,255,255,0.15); color: var(--text-main); font-size: 0.95rem; }
        .icon-btn { background: none; border: none; color: var(--primary); font-size: 1.3rem; cursor: pointer; padding: 5px;}
        .recording { color: var(--danger); animation: flashDanger 0.5s infinite alternate; border-radius: 50%; }

        #context-menu { position: absolute; background: rgba(0,0,0,0.9); border: 1px solid var(--primary); border-radius: 12px; padding: 10px; display: none; flex-direction: column; z-index: 100; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        #context-menu button { background: none; border: none; color: white; padding: 12px; text-align: left; cursor: pointer; font-family: inherit; font-size: 0.95rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
        #context-menu button:last-child { border-bottom: none; }
        #context-menu button:hover { color: var(--danger); background: rgba(255,255,255,0.05);}

        /* --- WEBRTC CALLER UI --- */
        #call-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: none; flex-direction: column; z-index: 200; }
        
        /* Remote video takes full screen */
        .remote-video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 198; background: #111; }
        
        /* Local video is Picture-in-Picture (Preview) */
        .local-video-pip { 
            position: absolute; bottom: 120px; right: 20px; width: 100px; height: 140px; 
            object-fit: cover; border-radius: 12px; z-index: 199; 
            border: 2px solid var(--primary); box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            transform: scaleX(-1); /* Mirror local camera */
        }

        .caller-overlay { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 60px 20px 40px 20px; box-sizing: border-box; z-index: 201; background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 40%, transparent 60%, rgba(0,0,0,0.9) 100%); pointer-events: none;}
        
        .call-controls { display: flex; justify-content: space-around; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 30px; backdrop-filter: blur(15px); pointer-events: auto;}
        .ctrl-btn { width: 55px; height: 55px; border-radius: 50%; border: none; cursor: pointer; font-size: 1.3rem; color: white; background: rgba(255,255,255,0.2); transition: 0.3s; display: flex; justify-content: center; align-items: center;}
        .ctrl-btn.active { background: var(--primary); color: #000; }
        
        .ctrl-btn.hangup { background: var(--danger); transform: scale(1.1); }
        .ctrl-btn.hangup:hover { background: #d32f2f; }
        .ctrl-btn.answer { background: var(--success); transform: scale(1.1); display: none; }
        .ctrl-btn.answer:hover { background: #008f7d; }

        .modal { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 300; backdrop-filter: blur(3px); }
        .modal-content { background: var(--panel-bg); padding: 25px; border-radius: 16px; width: 85%; max-width: 350px; text-align: center; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5);}

    </style>
</head>
<body>

    <div id="hearts-container"></div>

    <div class="app-container">
        <i class="fa-solid fa-skull glitch-bg-icon"></i>

        <div id="auth-screen">
            <h1 style="color:var(--primary); font-size: 2.5rem; text-shadow: 0 0 10px var(--primary);"><i class="fa-solid fa-ghost"></i> Ghost Chat</h1>
            <p style="color:var(--text-muted); margin-bottom: 30px;">Secure WebRTC Messaging</p>
            <input type="email" id="auth-email" class="auth-input" placeholder="Email Address">
            <input type="password" id="auth-pass" class="auth-input" placeholder="Password">
            <input type="text" id="auth-user" class="auth-input" placeholder="Username (Signup Only)" style="display:none;">
            <button class="btn-main" id="btn-login" onclick="login()">Login</button>
            <button class="btn-main" id="btn-signup" onclick="signup()" style="display:none;">Create Account</button>
            <div class="auth-links" onclick="toggleAuth()">New User? Sign Up</div>
        </div>

        <div id="dashboard" style="display:none; height:100%; flex-direction:column;">
            <div class="header">
                <div class="profile-area">
                    <div class="dp-circle" onclick="openSettings()"><i class="fa-solid fa-user"></i></div>
                    <div class="hidden-trigger" onmousedown="startPrivateTimer()" onmouseup="clearPrivateTimer()" ontouchstart="startPrivateTimer()" ontouchend="clearPrivateTimer()">
                        <div id="my-username" style="font-weight:bold; font-size:1.1rem; letter-spacing: 0.5px;">Username</div>
                        <div style="font-size:0.75rem; color:var(--success);"><i class="fa-solid fa-circle" style="font-size: 0.5rem; margin-right: 3px;"></i> Online</div>
                    </div>
                </div>
                <div style="display:flex; gap:15px;">
                    <i class="fa-solid fa-user-plus icon-btn" onclick="openSearchModal()"></i>
                    <i class="fa-solid fa-right-from-bracket icon-btn" onclick="logout()" style="color:var(--danger);"></i>
                </div>
            </div>

            <div class="tabs">
                <div class="tab active" onclick="switchTab('chats')">Chats</div>
                <div class="tab" onclick="switchTab('calls')">Call History</div>
            </div>

            <div class="list-container" id="chats-list"><i>Loading chats...</i></div>
            <div class="list-container" id="calls-list" style="display:none;"><i>No call history.</i></div>
        </div>

        <div id="chat-screen">
            <i class="fa-solid fa-skull glitch-bg-icon"></i>
            <div class="chat-header">
                <div style="display:flex; align-items:center; gap:10px;">
                    <i class="fa-solid fa-arrow-left icon-btn" onclick="closeChat()"></i>
                    <div class="dp-circle" style="width:40px; height:40px;" onclick="openPartnerProfile()"><i class="fa-solid fa-user"></i></div>
                    <div id="chat-partner-name" style="font-weight:600; font-size:1.1rem;">Partner</div>
                </div>
                <div style="display:flex; gap:20px;">
                    <i class="fa-solid fa-phone icon-btn" onclick="startCall('voice')"></i>
                    <i class="fa-solid fa-video icon-btn" onclick="startCall('video')"></i>
                </div>
            </div>
            
            <div class="chat-messages" id="chat-messages"></div>
            
            <div class="chat-input-area">
                <input type="text" id="msg-input" placeholder="Type a message...">
                <button class="icon-btn" id="btn-mic" onmousedown="startVoiceRecord()" onmouseup="stopVoiceRecord()" ontouchstart="startVoiceRecord()" ontouchend="stopVoiceRecord()"><i class="fa-solid fa-microphone"></i></button>
                <button class="icon-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>

        <div id="call-screen">
            <video id="remote-video" class="remote-video" autoplay playsinline></video>
            <video id="local-video" class="local-video-pip" autoplay muted playsinline style="display:none;"></video>
            
            <div class="caller-overlay">
                <div style="text-align:center;">
                    <h2 id="calling-name" style="font-size: 2rem; margin-bottom: 5px; text-shadow: 0 2px 5px #000;">Partner Name</h2>
                    <p id="call-status" style="font-size: 1.1rem; color: #ccc; margin-top: 0;">Ringing...</p>
                    <p id="call-timer" style="display:none; font-size: 1.5rem; font-weight: bold; margin-top: 10px; text-shadow: 0 2px 5px #000;">00:00</p>
                </div>
                <div class="call-controls">
                    <button class="ctrl-btn answer" id="btn-answer" onclick="acceptIncomingCall()"><i class="fa-solid fa-phone"></i></button>
                    <button class="ctrl-btn" id="btn-mute" onclick="toggleMute()"><i class="fa-solid fa-microphone-slash"></i></button>
                    <button class="ctrl-btn" id="btn-video" onclick="toggleVideo()"><i class="fa-solid fa-video-slash"></i></button>
                    <button class="ctrl-btn" id="btn-switch-cam" onclick="switchCamera()"><i class="fa-solid fa-camera-rotate"></i></button>
                    <button class="ctrl-btn hangup" onclick="hangup()"><i class="fa-solid fa-phone-slash"></i></button>
                </div>
            </div>
        </div>

        <div id="danger-overlay">
            <i class="fa-solid fa-skull danger-icon"></i>
            <h2 style="color:red; letter-spacing: 3px; text-shadow: 0 0 15px red; margin-top: 20px;">RESTRICTED AREA</h2>
            <div class="bottom-password">
                <input type="password" id="private-pass-input" placeholder="ENTER ACCESS CODE" onkeypress="verifyPrivatePass(event)">
                <p id="private-hint" style="color:#aaa; font-size:0.85rem; text-align:center; display:none; margin-top: 10px;">Create a new code for Private Mode</p>
            </div>
        </div>

        <div class="modal" id="search-modal">
            <div class="modal-content">
                <h3 style="margin-top:0;">Add Friend</h3>
                <input type="text" id="search-input" class="auth-input" placeholder="Exact Username">
                <button class="btn-main" onclick="addFriend()"><i class="fa-solid fa-magnifying-glass"></i> Search & Add</button>
                <button class="btn-main" style="background:transparent; border: 1px solid #555; color: white; margin-top:10px;" onclick="document.getElementById('search-modal').style.display='none'">Cancel</button>
            </div>
        </div>

        <div class="modal" id="settings-modal">
            <div class="modal-content">
                <h3 style="margin-top:0;">Account Info</h3>
                <input type="text" id="new-username" class="auth-input" placeholder="New Username">
                <button class="btn-main" onclick="updateUsername()">Change Username</button>
                <button class="btn-main" style="background:transparent; border: 1px solid #555; color: white; margin-top:10px;" onclick="document.getElementById('settings-modal').style.display='none'">Close</button>
            </div>
        </div>

        <div class="modal" id="partner-profile-modal">
            <div class="modal-content">
                <h3 id="partner-modal-name" style="margin-top:0;">Partner Info</h3>
                <button class="btn-main" id="btn-toggle-mode" onclick="toggleChatMode()"><i class="fa-solid fa-lock"></i> Move to Private Mode</button>
                <button class="btn-main" style="background:var(--danger); margin-top:10px;" onclick="removeFriend()"><i class="fa-solid fa-user-minus"></i> Remove Friend</button>
                <button class="btn-main" style="background:transparent; border: 1px solid #555; color: white; margin-top:10px;" onclick="document.getElementById('partner-profile-modal').style.display='none'">Close</button>
            </div>
        </div>

        <div id="context-menu">
            <button onclick="deleteMsg('me')"><i class="fa-solid fa-trash"></i> Delete for me</button>
            <button onclick="deleteMsg('everyone')" id="btn-del-everyone"><i class="fa-solid fa-trash-can" style="color:var(--danger);"></i> Delete for everyone</button>
            <button onclick="document.getElementById('context-menu').style.display='none'">Cancel</button>
        </div>

    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, onSnapshot, addDoc, query, where, getDocs, orderBy, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDMSGPEngVmGtTRfcnIC4unH7Rh3FwgcRE",
        authDomain: "sv-billing-250c2.firebaseapp.com",
        projectId: "sv-billing-250c2",
        storageBucket: "sv-billing-250c2.firebasestorage.app",
        messagingSenderId: "847927101892",
        appId: "1:847927101892:web:800c182fe47f133d537c91"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Globals
    let currentUser = null; let userData = null;
    let isLoginMode = true; let isPrivateMode = false;
    let currentChatId = null; let currentPartnerId = null; let currentPartnerName = "";
    
    // WebRTC & Media State
    let localStream = null;
    let remoteStream = null;
    let peerConnection = null;
    let activeCallListener = null; 
    let callTimerInt;
    let isVideoCall = false;
    
    // Free public STUN servers for WebRTC
    const servers = { iceServers: [{ urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }] };

    const incomingRingtone = new Audio('https://assets.mixkit.co/active_storage/sfx/2870/2870-preview.mp3'); incomingRingtone.loop = true;
    const outgoingRingtone = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3'); outgoingRingtone.loop = true;

    // --- AUTH & UI LOGIC --- (Kept exactly as before)
    window.toggleAuth = () => { isLoginMode = !isLoginMode; document.getElementById('auth-user').style.display = isLoginMode ? 'none' : 'block'; document.getElementById('btn-login').style.display = isLoginMode ? 'block' : 'none'; document.getElementById('btn-signup').style.display = isLoginMode ? 'none' : 'block'; };
    window.login = async () => { try { await signInWithEmailAndPassword(auth, document.getElementById('auth-email').value, document.getElementById('auth-pass').value); } catch (err) { alert(err.message); } };
    window.signup = async () => { const u = document.getElementById('auth-user').value; if(!u) return alert("Username required"); try { const cred = await createUserWithEmailAndPassword(auth, document.getElementById('auth-email').value, document.getElementById('auth-pass').value); await setDoc(doc(db, "users", cred.user.uid), { email: cred.user.email, username: u, privateCode: null, isOnline: true }); } catch (err) { alert(err.message); } };
    window.forgotPassword = async () => { try { await sendPasswordResetEmail(auth, document.getElementById('auth-email').value); alert("Email sent!"); } catch (err) { alert(err.message); } };
    window.logout = () => { signOut(auth); };

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user; document.getElementById('auth-screen').style.display = 'none'; document.getElementById('dashboard').style.display = 'flex';
            const docSnap = await getDoc(doc(db, "users", user.uid)); userData = docSnap.data(); document.getElementById('my-username').innerText = userData.username;
            loadFriendsList(); listenForCalls();
        } else {
            currentUser = null; document.getElementById('auth-screen').style.display = 'flex'; document.getElementById('dashboard').style.display = 'none'; disablePrivateMode();
        }
    });

    window.switchTab = (tab) => { document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); event.target.classList.add('active'); document.getElementById('chats-list').style.display = tab === 'chats' ? 'block' : 'none'; document.getElementById('calls-list').style.display = tab === 'calls' ? 'block' : 'none'; if(tab === 'calls') loadCallHistory(); };
    window.openSettings = () => { document.getElementById('settings-modal').style.display = 'flex'; };
    window.updateUsername = async () => { const nu = document.getElementById('new-username').value; if(!nu) return; await updateDoc(doc(db, "users", currentUser.uid), { username: nu }); document.getElementById('my-username').innerText = nu; userData.username = nu; document.getElementById('settings-modal').style.display = 'none'; };
    window.openPartnerProfile = () => { document.getElementById('partner-modal-name').innerText = currentPartnerName; document.getElementById('btn-toggle-mode').innerHTML = isPrivateMode ? '<i class="fa-solid fa-unlock"></i> Move to Public Mode' : '<i class="fa-solid fa-lock"></i> Move to Restrict Mode'; document.getElementById('partner-profile-modal').style.display = 'flex'; };
    window.toggleChatMode = async () => { if(currentChatId) { await updateDoc(doc(db, "chats", currentChatId), { isPrivate: !isPrivateMode }); document.getElementById('partner-profile-modal').style.display = 'none'; closeChat(); } };
    window.removeFriend = async () => { if(currentChatId && confirm("Remove permanently?")) { await deleteDoc(doc(db, "chats", currentChatId)); document.getElementById('partner-profile-modal').style.display = 'none'; closeChat(); } };
    window.openSearchModal = () => { document.getElementById('search-modal').style.display = 'flex'; };
    window.addFriend = async () => { const uname = document.getElementById('search-input').value.trim(); const snap = await getDocs(query(collection(db, "users"), where("username", "==", uname))); if(snap.empty) return alert("Not found"); const targetUser = snap.docs[0]; const combinedId = currentUser.uid > targetUser.id ? currentUser.uid + targetUser.id : targetUser.id + currentUser.uid; await setDoc(doc(db, "chats", combinedId), { users: [currentUser.uid, targetUser.id], isPrivate: isPrivateMode, lastMsg: "Connected", timestamp: Date.now() }); document.getElementById('search-modal').style.display = 'none'; };

    function loadFriendsList() {
        onSnapshot(query(collection(db, "chats"), where("users", "array-contains", currentUser.uid)), async (snap) => {
            let html = '';
            for (const d of snap.docs) {
                const data = d.data(); if(data.isPrivate !== isPrivateMode) continue; 
                const partnerId = data.users.find(id => id !== currentUser.uid);
                const pSnap = await getDoc(doc(db, "users", partnerId));
                if(pSnap.exists()) {
                    html += `<div class="list-item" onclick="openChat('${d.id}', '${partnerId}', '${pSnap.data().username}')"><div class="dp-circle"><i class="fa-solid fa-user"></i></div><div style="flex:1; padding-left:15px;"><div style="font-weight:600;">${pSnap.data().username}</div><div style="font-size:0.8rem; color:var(--text-muted);">${data.lastMsg.includes('data:audio') ? 'Voice message' : data.lastMsg}</div></div></div>`;
                }
            }
            document.getElementById('chats-list').innerHTML = html || "<div style='text-align:center; padding: 20px; color: #888;'>No chats yet.</div>";
        });
    }

    let pressTimer;
    window.startPrivateTimer = () => { pressTimer = setTimeout(() => { if(isPrivateMode) disablePrivateMode(); else { document.getElementById('danger-overlay').style.display = 'flex'; document.getElementById('private-pass-input').value = ''; document.getElementById('private-hint').style.display = userData.privateCode ? 'none' : 'block'; } }, 1200); }; 
    window.clearPrivateTimer = () => { clearTimeout(pressTimer); };
    window.verifyPrivatePass = async (e) => { if(e.key === 'Enter') { const val = document.getElementById('private-pass-input').value; if(!userData.privateCode) { await updateDoc(doc(db, "users", currentUser.uid), { privateCode: val }); userData.privateCode = val; enablePrivateMode(); } else if(val === userData.privateCode) enablePrivateMode(); else alert("ACCESS DENIED"); } };
    function enablePrivateMode() { document.getElementById('danger-overlay').style.display = 'none'; document.body.classList.add('private-mode'); isPrivateMode = true; document.getElementById('hearts-container').innerHTML=''; for(let i=0;i<25;i++){ let h = document.createElement('i'); h.className = Math.random()>0.5?'fa-solid fa-heart heart':'fa-brands fa-gratipay heart'; h.style.left = Math.random()*100+'vw'; h.style.animationDuration = (Math.random()*3+2.5)+'s'; document.getElementById('hearts-container').appendChild(h); } loadFriendsList(); }
    function disablePrivateMode() { document.body.classList.remove('private-mode'); isPrivateMode = false; document.getElementById('hearts-container').innerHTML = ''; loadFriendsList(); }

    window.openChat = (chatId, pId, pName) => {
        currentChatId = chatId; currentPartnerId = pId; currentPartnerName = pName;
        document.getElementById('chat-partner-name').innerText = pName; document.getElementById('dashboard').style.display = 'none'; document.getElementById('chat-screen').style.display = 'flex';
        onSnapshot(query(collection(db, `chats/${chatId}/messages`), orderBy('timestamp')), (snap) => {
            let html = '';
            snap.forEach(d => {
                const msg = d.data(); if(msg.deletedFor && msg.deletedFor.includes(currentUser.uid)) return;
                const isMe = msg.sender === currentUser.uid; const time = new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                let content = msg.type === 'audio' ? `<audio controls src="${msg.text}"></audio>` : msg.text;
                let ticks = isMe ? `<i class="fa-solid fa-check-double tick ${msg.status==='read'?'read':''}"></i>` : '';
                if(!isMe && msg.status !== 'read') updateDoc(doc(db, `chats/${chatId}/messages`, d.id), { status: 'read' });
                html += `<div class="msg-bubble ${isMe ? 'mine' : 'theirs'}" onmousedown="holdMsg('${d.id}', ${isMe})" onmouseup="clearHoldMsg()" ontouchstart="holdMsg('${d.id}', ${isMe})" ontouchend="clearHoldMsg()">${content}<div class="msg-time">${time} ${ticks}</div></div>`;
            });
            const box = document.getElementById('chat-messages'); box.innerHTML = html; box.scrollTop = box.scrollHeight;
        });
    };
    window.closeChat = () => { document.getElementById('chat-screen').style.display = 'none'; document.getElementById('dashboard').style.display = 'flex'; currentChatId = null; };
    window.sendMessage = async () => { const i = document.getElementById('msg-input'); const txt = i.value.trim(); if(!txt) return; i.value = ''; await addDoc(collection(db, `chats/${currentChatId}/messages`), { sender: currentUser.uid, text: txt, type: 'text', timestamp: Date.now(), status: 'sent', deletedFor: [] }); await updateDoc(doc(db, "chats", currentChatId), { lastMsg: txt }); };
    
    let msgHoldTimer; let selectedMsgId = null;
    window.holdMsg = (msgId, isMe) => { msgHoldTimer = setTimeout(() => { selectedMsgId = msgId; let menu = document.getElementById('context-menu'); menu.style.display = 'flex'; menu.style.top = (event.touches ? event.touches[0].clientY : event.clientY) + 'px'; menu.style.left = (event.touches ? event.touches[0].clientX : event.clientX) + 'px'; document.getElementById('btn-del-everyone').style.display = isMe ? 'block' : 'none'; }, 800); };
    window.clearHoldMsg = () => { clearTimeout(msgHoldTimer); };
    window.deleteMsg = async (type) => { const ref = doc(db, `chats/${currentChatId}/messages`, selectedMsgId); if(type === 'me') { let d = (await getDoc(ref)).data().deletedFor || []; d.push(currentUser.uid); await updateDoc(ref, { deletedFor: d }); } else await deleteDoc(ref); document.getElementById('context-menu').style.display = 'none'; };

    // Voice Notes
    let mediaRecorder; let audioChunks = [];
    window.startVoiceRecord = async (e) => { if(e) e.preventDefault(); try { const stream = await navigator.mediaDevices.getUserMedia({ audio: true }); mediaRecorder = new MediaRecorder(stream); document.getElementById('btn-mic').classList.add('recording'); mediaRecorder.start(); audioChunks = []; mediaRecorder.addEventListener("dataavailable", ev => audioChunks.push(ev.data)); } catch(e) { alert("Mic needed"); } };
    window.stopVoiceRecord = (e) => { if(e) e.preventDefault(); if(!mediaRecorder || mediaRecorder.state === "inactive") return; document.getElementById('btn-mic').classList.remove('recording'); mediaRecorder.stop(); mediaRecorder.addEventListener("stop", () => { const r = new FileReader(); r.readAsDataURL(new Blob(audioChunks, {type:'audio/ogg; codecs=opus'})); r.onloadend = async () => { await addDoc(collection(db, `chats/${currentChatId}/messages`), { sender: currentUser.uid, text: r.result, type: 'audio', timestamp: Date.now(), status: 'sent', deletedFor: [] }); await updateDoc(doc(db, "chats", currentChatId), { lastMsg: "Voice message" }); } }); };

    // --- REAL WEBRTC CALLING SYSTEM ---
    function stopAllRingtones() { incomingRingtone.pause(); incomingRingtone.currentTime = 0; outgoingRingtone.pause(); outgoingRingtone.currentTime = 0; }

    window.startCall = async (type) => {
        isVideoCall = (type === 'video');
        document.getElementById('call-screen').style.display = 'flex';
        document.getElementById('calling-name').innerText = currentPartnerName;
        document.getElementById('call-status').innerText = "Calling...";
        document.getElementById('btn-answer').style.display = 'none'; // Caller hides answer button
        
        // 1. Get Local Media
        localStream = await navigator.mediaDevices.getUserMedia({ video: isVideoCall, audio: true });
        
        // Show Local PIP if video
        if(isVideoCall) {
            document.getElementById('local-video').style.display = 'block';
            document.getElementById('local-video').srcObject = localStream;
            document.getElementById('btn-video').style.display = 'flex';
            document.getElementById('btn-switch-cam').style.display = 'flex';
        } else {
            document.getElementById('local-video').style.display = 'none';
            document.getElementById('btn-video').style.display = 'none';
            document.getElementById('btn-switch-cam').style.display = 'none';
        }

        // 2. Setup WebRTC PeerConnection
        peerConnection = new RTCPeerConnection(servers);
        
        remoteStream = new MediaStream();
        document.getElementById('remote-video').srcObject = remoteStream;

        // Add Local Tracks to PC
        localStream.getTracks().forEach((track) => {
            peerConnection.addTrack(track, localStream);
        });

        // Listen for Remote Tracks
        peerConnection.ontrack = (event) => {
            event.streams[0].getTracks().forEach((track) => {
                remoteStream.addTrack(track);
            });
        };

        // Write Caller ICE Candidates to Firestore
        const callDocRef = doc(db, "active_calls", currentChatId);
        peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                addDoc(collection(callDocRef, "callerCandidates"), event.candidate.toJSON());
            }
        };

        // 3. Create Offer
        const offerDescription = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offerDescription);

        const offer = { sdp: offerDescription.sdp, type: offerDescription.type };
        
        await setDoc(callDocRef, {
            caller: currentUser.uid, receiver: currentPartnerId,
            type: type, status: 'ringing', isPrivate: isPrivateMode, timestamp: Date.now(),
            offer: offer
        });

        // 4. Listen for Answer & Status Changes
        activeCallListener = onSnapshot(callDocRef, (docSnap) => {
            const data = docSnap.data();
            if(!data) return;

            // If receiver answered and provided an Answer SDP
            if (!peerConnection.currentRemoteDescription && data.answer) {
                const answerDescription = new RTCSessionDescription(data.answer);
                peerConnection.setRemoteDescription(answerDescription);
                stopAllRingtones();
                document.getElementById('call-status').innerText = "Connected";
                startCallTimer();
            }
            
            // If receiver hangs up
            if(data.status === 'ended') forceHangupCleanup();
        });

        // 5. Listen for Receiver ICE Candidates
        onSnapshot(collection(callDocRef, "receiverCandidates"), (snapshot) => {
            snapshot.docChanges().forEach((change) => {
                if (change.type === "added") {
                    const candidate = new RTCIceCandidate(change.doc.data());
                    peerConnection.addIceCandidate(candidate);
                }
            });
        });

        outgoingRingtone.play();
    };

    // Listen for Incoming Calls
    function listenForCalls() {
        if(!currentUser) return;
        onSnapshot(query(collection(db, "active_calls"), where("receiver", "==", currentUser.uid)), (snap) => {
            snap.docChanges().forEach(async change => {
                const data = change.doc.data();
                
                if(change.type === "added" && data.status === 'ringing') {
                    if(data.isPrivate !== isPrivateMode) return; 
                    
                    currentChatId = change.doc.id;
                    currentPartnerId = data.caller;
                    isVideoCall = (data.type === 'video');
                    
                    // Show UI
                    document.getElementById('call-screen').style.display = 'flex';
                    document.getElementById('calling-name').innerText = "Incoming Call...";
                    document.getElementById('call-status').innerText = "Ringing...";
                    
                    // Show Answer button for Receiver
                    document.getElementById('btn-answer').style.display = 'flex';
                    document.getElementById('local-video').style.display = 'none';

                    if(!isVideoCall) {
                        document.getElementById('btn-video').style.display = 'none';
                        document.getElementById('btn-switch-cam').style.display = 'none';
                    }
                    
                    incomingRingtone.play();
                    
                    // Listen if caller hangs up before we answer
                    activeCallListener = onSnapshot(doc(db, "active_calls", currentChatId), (docSnap) => {
                        if(docSnap.data()?.status === 'ended') forceHangupCleanup();
                    });
                }
            });
        });
    }

    // Manual Lift Call (Receiver clicks Answer)
    window.acceptIncomingCall = async () => {
        stopAllRingtones();
        document.getElementById('btn-answer').style.display = 'none'; // Hide answer button
        document.getElementById('call-status').innerText = "Connecting...";

        const callDocRef = doc(db, "active_calls", currentChatId);
        const callData = (await getDoc(callDocRef)).data();
        
        // 1. Get Local Media
        localStream = await navigator.mediaDevices.getUserMedia({ video: isVideoCall, audio: true });
        
        if(isVideoCall) {
            document.getElementById('local-video').style.display = 'block';
            document.getElementById('local-video').srcObject = localStream;
            document.getElementById('btn-video').style.display = 'flex';
            document.getElementById('btn-switch-cam').style.display = 'flex';
        }

        peerConnection = new RTCPeerConnection(servers);
        remoteStream = new MediaStream();
        document.getElementById('remote-video').srcObject = remoteStream;

        localStream.getTracks().forEach((track) => peerConnection.addTrack(track, localStream));

        peerConnection.ontrack = (event) => {
            event.streams[0].getTracks().forEach((track) => remoteStream.addTrack(track));
        };

        // Write Receiver ICE Candidates
        peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                addDoc(collection(callDocRef, "receiverCandidates"), event.candidate.toJSON());
            }
        };

        // 2. Set Remote Description (Offer)
        const offerDescription = callData.offer;
        await peerConnection.setRemoteDescription(new RTCSessionDescription(offerDescription));

        // 3. Create Answer
        const answerDescription = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answerDescription);

        const answer = { type: answerDescription.type, sdp: answerDescription.sdp };
        
        // Send Answer to DB
        await updateDoc(callDocRef, { answer: answer, status: 'connected' });

        // 4. Listen for Caller ICE Candidates
        onSnapshot(collection(callDocRef, "callerCandidates"), (snapshot) => {
            snapshot.docChanges().forEach((change) => {
                if (change.type === "added") {
                    const candidate = new RTCIceCandidate(change.doc.data());
                    peerConnection.addIceCandidate(candidate);
                }
            });
        });

        document.getElementById('call-status').innerText = "Connected";
        startCallTimer();
    };

    function startCallTimer() {
        document.getElementById('call-timer').style.display = 'block'; let sec = 0; clearInterval(callTimerInt);
        callTimerInt = setInterval(() => { sec++; let m = Math.floor(sec/60).toString().padStart(2,'0'); let s = (sec%60).toString().padStart(2,'0'); document.getElementById('call-timer').innerText = `${m}:${s}`; }, 1000);
    }

    window.toggleMute = () => { if(localStream) { const track = localStream.getAudioTracks()[0]; track.enabled = !track.enabled; document.getElementById('btn-mute').classList.toggle('active'); } };
    window.toggleVideo = () => { if(localStream) { const track = localStream.getVideoTracks()[0]; if(track) { track.enabled = !track.enabled; document.getElementById('btn-video').classList.toggle('active'); } } };
    window.switchCamera = () => { alert("Mobile back camera toggle requires exact device ID mapping."); };

    window.hangup = async () => {
        if(currentChatId) {
            await updateDoc(doc(db, "active_calls", currentChatId), { status: 'ended' });
            await addDoc(collection(db, "call_history"), { uid: currentUser.uid, partner: currentPartnerId, isPrivate: isPrivateMode, time: Date.now(), type: 'outgoing' });
        }
        forceHangupCleanup();
    };

    function forceHangupCleanup() {
        if(localStream) localStream.getTracks().forEach(track => track.stop());
        if(peerConnection) peerConnection.close();
        peerConnection = null;
        localStream = null; remoteStream = null;
        
        clearInterval(callTimerInt);
        if(activeCallListener) { activeCallListener(); activeCallListener = null; }
        stopAllRingtones();
        
        document.getElementById('remote-video').srcObject = null;
        document.getElementById('local-video').srcObject = null;
        document.getElementById('call-screen').style.display = 'none';
        document.getElementById('call-timer').style.display = 'none';
        document.getElementById('call-timer').innerText = "00:00";
        document.getElementById('call-status').innerText = "Ringing...";
        document.getElementById('btn-answer').style.display = 'none';
    }

    // --- CALL HISTORY ---
     window.loadCallHistory = async () => {
        const snap = await getDocs(query(collection(db, "call_history"), where("uid", "==", currentUser.uid), orderBy("time", "desc")));
        let html = '';
        for (const d of snap.docs) {
            const data = d.data(); if(data.isPrivate !== isPrivateMode) continue;
            const pSnap = await getDoc(doc(db, "users", data.partner));
            const pName = pSnap.exists() ? pSnap.data().username : "Unknown";
            html += `<div class="list-item"><div class="dp-circle" style="background:${data.type==='incoming'?'var(--success)':'var(--primary)'}; color:#000;"><i class="fa-solid fa-phone"></i></div><div style="flex:1; padding-left:15px;"><div style="font-weight:bold;">${pName}</div><div style="font-size:0.8rem; color:var(--text-muted);">${data.type.toUpperCase()} • ${new Date(data.time).toLocaleString([], {hour:'2-digit', minute:'2-digit', day:'numeric', month:'short'})}</div></div></div>`;
        }
        document.getElementById('calls-list').innerHTML = html || "<div style='text-align:center; padding: 20px; color: #888;'><i>No call history.</i></div>";
    };

</script>
</body>
</html>
