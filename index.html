<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghost Chat - Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://unpkg.com/ml5@latest/dist/ml5.min.js"></script>
    
    <style>
        :root {
            --bg-color: #0f172a; 
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #00e5ff; 
            --primary-glow: 0 0 10px rgba(0, 229, 255, 0.5);
            --text-main: #ffffff; 
            --text-muted: #94a3b8;
            --danger: #ff4b2b; 
            --success: #10b981;
            --chat-mine: rgba(2, 132, 199, 0.8); 
            --chat-theirs: rgba(51, 65, 85, 0.8);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            background: linear-gradient(135deg, #020617, #0f172a, #1e1b4b); 
            background-size: 200% 200%; animation: gradientBG 15s ease infinite; 
            color: var(--text-main); height: 100dvh; width: 100vw; display: flex; flex-direction: column; overflow: hidden; 
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* GLASSMORPHISM UI */
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--glass-border); }
        
        .header { height: 65px; flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; z-index: 10; border-bottom: 1px solid var(--glass-border); }
        .main-content { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; padding: 10px; }
        .footer-nav { height: 65px; flex-shrink: 0; display: flex; justify-content: space-around; align-items: center; z-index: 10; border-top: 1px solid var(--glass-border); padding-bottom: env(safe-area-inset-bottom); }

        .icon-btn { background: none; border: none; color: var(--text-muted); font-size: 1.3rem; cursor: pointer; padding: 10px; transition: 0.3s; }
        .icon-btn:hover, .icon-btn.active { color: var(--primary); text-shadow: var(--primary-glow); }
        
        /* Camera Animation */
        .cam-active { color: var(--danger) !important; animation: pulseRed 1.5s infinite; }
        @keyframes pulseRed { 0% { text-shadow: 0 0 5px red; transform: scale(1); } 50% { text-shadow: 0 0 20px red; transform: scale(1.1); } 100% { text-shadow: 0 0 5px red; transform: scale(1); } }

        .dp-circle { width: 45px; height: 45px; border-radius: 50%; background: rgba(255,255,255,0.1); overflow: hidden; display: flex; justify-content: center; align-items: center; border: 1px solid var(--primary); flex-shrink: 0; box-shadow: var(--primary-glow); }
        .dp-circle img { width: 100%; height: 100%; object-fit: cover; }
        
        .list-view { display: none; height: 100%; }
        .list-view.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .list-item { display: flex; align-items: center; padding: 15px; border-radius: 15px; margin-bottom: 10px; cursor: pointer; transition: 0.3s; background: var(--glass-bg); border: 1px solid var(--glass-border); }
        .list-item:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
        .item-info { flex: 1; padding-left: 15px; overflow: hidden; }
        .item-title { font-weight: 500; font-size: 1.05rem; color: var(--text-main); white-space: nowrap; text-overflow: ellipsis; display: flex; justify-content: space-between;}
        .item-sub { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; text-overflow: ellipsis; overflow: hidden; margin-top: 4px; }
        .badge { background: var(--primary); color: #000; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: bold; }

        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 0.75rem; gap: 4px; cursor: pointer; width: 25%; transition: 0.3s;}
        .nav-item.active { color: var(--primary); text-shadow: var(--primary-glow); }
        .nav-item i { font-size: 1.3rem; }

        .input-box { width: 100%; padding: 15px; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: 12px; color: var(--text-main); margin-bottom: 15px; font-size: 1rem; transition: 0.3s;}
        .input-box:focus { border-color: var(--primary); box-shadow: var(--primary-glow); }
        .btn { width: 100%; padding: 15px; background: var(--primary); color: #000; border: none; border-radius: 12px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.3s; box-shadow: var(--primary-glow); }
        .btn:active { transform: scale(0.95); }
        .btn-sm { width: auto; padding: 8px 15px; border-radius: 8px; font-size: 0.85rem; }
        .btn-danger { background: var(--danger); color: white; box-shadow: 0 0 10px rgba(255,75,43,0.5); }

        /* --- CHAT SCREEN --- */
        #chat-screen { position: absolute; top:0; left:0; width:100%; height:100dvh; display: none; flex-direction: column; z-index: 100; background: inherit; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg-bubble { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; position: relative; border: 1px solid var(--glass-border); backdrop-filter: blur(5px); }
        .msg-mine { align-self: flex-end; background: var(--chat-mine); border-bottom-right-radius: 4px; }
        .msg-theirs { align-self: flex-start; background: var(--chat-theirs); border-bottom-left-radius: 4px; }
        .msg-bubble img, .msg-bubble video { max-width: 100%; border-radius: 10px; margin-top: 5px; }
        
        /* Privacy Masking */
        .blurred-msg .msg-bubble { filter: blur(10px); transition: filter 0.3s ease; }
        .blurred-msg .msg-bubble:active { filter: blur(0); }

        .chat-input-area { padding: 10px 15px; display: flex; align-items: center; gap: 10px; z-index: 2; }
        .chat-input-area input { flex: 1; padding: 15px 20px; border-radius: 25px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.4); color: white; }

        /* --- MODALS & EXTRAS --- */
        .modal { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 500; padding: 20px; backdrop-filter: blur(8px); }
        .modal-content { background: var(--glass-bg); padding: 25px; border-radius: 20px; width: 100%; max-width: 350px; border: 1px solid var(--glass-border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        #game-screen { position: absolute; top:0; left:0; width:100%; height:100%; background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        #popup-notif { position: absolute; top: -100px; left: 5%; width: 90%; background: var(--primary); color: #000; padding: 15px; border-radius: 12px; font-weight: 500; display: flex; align-items: center; gap: 15px; z-index: 9999; transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: var(--primary-glow); }
        
        /* Typing Indicator */
        .typing-indicator { display: none; font-size: 0.8rem; color: var(--primary); font-style: italic; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3"></audio>
    <video id="ai-video" style="display:none;" width="320" height="240" autoplay muted></video>
    <input type="file" id="media-upload" accept="image/*,video/*" style="display:none;" onchange="handleMediaUpload(event)">

    <div id="popup-notif">
        <i class="fa-solid fa-bell" style="font-size: 1.5rem;"></i>
        <div>
            <div id="notif-title" style="font-weight: bold;">New Alert</div>
            <div id="notif-desc" style="font-size: 0.85rem;">Check your messages</div>
        </div>
    </div>

    <div id="auth-screen" class="glass-panel" style="height:100dvh; display:flex; flex-direction:column; justify-content:center; padding:30px; z-index:5000; border:none; border-radius:0;">
        <h1 style="color:var(--primary); margin-bottom:40px; text-align:center; text-shadow: var(--primary-glow);"><i class="fa-solid fa-bolt"></i> TrueChats</h1>
        <input type="text" id="auth-user" class="input-box" placeholder="Username (Signup)">
        <input type="email" id="auth-email" class="input-box" placeholder="Email Address">
        <input type="password" id="auth-pass" class="input-box" placeholder="Password">
        <button class="btn" id="btn-login" onclick="login()">Login</button>
        <button class="btn" id="btn-signup" onclick="signup()" style="display:none;">Sign Up</button>
        <p onclick="toggleAuth()" style="color:var(--primary); margin-top:20px; text-align:center; cursor:pointer;" id="auth-tog">New User? Create Account</p>
    </div>

    <div id="main-app" style="display:none; flex-direction:column; height:100dvh;">
        <header class="header glass-panel">
            <div style="display:flex; align-items:center; gap:12px;">
                <div class="dp-circle"><img id="my-dp" src="https://avatar.iran.liara.run/public"></div>
                <div>
                    <div id="my-username" style="font-weight:600; font-size:1.1rem;">User</div>
                    <div style="font-size:0.75rem; color:var(--primary); text-shadow: var(--primary-glow);">Premium Secured</div>
                </div>
            </div>
            <div>
                <button class="icon-btn" id="ai-toggle" onclick="toggleAI()"><i class="fa-solid fa-camera"></i></button>
            </div>
        </header>

        <main class="main-content">
            <div class="list-view active" id="tab-chats"><div id="chats-list"></div></div>
            
            <div class="list-view" id="tab-requests">
                <input type="text" id="search-input" class="input-box" placeholder="Search friends by name..." oninput="searchUsersLive()">
                <div id="search-results" style="margin-bottom:20px;"></div>
                <h3 style="font-size:0.85rem; color:var(--text-muted); margin-bottom:10px;">REQUESTS</h3>
                <div id="requests-list"></div>
            </div>

            <div class="list-view" id="tab-snaps">
                <div id="snaps-list"></div>
                <button class="btn" style="position:absolute; bottom:20px; left:10%; width:80%;" onclick="alert('Camera integration active')"><i class="fa-solid fa-camera-retro"></i> Send Snap</button>
            </div>

            <div class="list-view" id="tab-games">
                <div class="list-item" onclick="openGame('snake')" style="flex-direction:column; padding:25px;">
                    <i class="fa-solid fa-ghost" style="font-size:2.5rem; color:var(--primary); margin-bottom:10px; text-shadow: var(--primary-glow);"></i>
                    <div class="item-title">Snake Run</div>
                </div>
                <div class="list-item" onclick="openFriendsForGame()" style="flex-direction:column; padding:25px; margin-top:15px;">
                    <i class="fa-solid fa-hashtag" style="font-size:2.5rem; color:var(--danger); margin-bottom:10px;"></i>
                    <div class="item-title">Tic-Tac-Toe Multiplayer</div>
                    <div class="item-sub">Play with chat friends</div>
                </div>
            </div>
        </main>

        <footer class="footer-nav glass-panel">
            <div class="nav-item active" onclick="switchNav('chats')"><i class="fa-solid fa-message"></i>Chats</div>
            <div class="nav-item" onclick="switchNav('requests')"><i class="fa-solid fa-user-plus"></i>Requests</div>
            <div class="nav-item" onclick="switchNav('snaps')"><i class="fa-solid fa-bolt"></i>Snaps</div>
            <div class="nav-item" onclick="switchNav('games')"><i class="fa-solid fa-gamepad"></i>Games</div>
        </footer>
    </div>

    <div id="chat-screen">
        <header class="header glass-panel">
            <div style="display:flex; align-items:center; gap:10px;">
                <button class="icon-btn" onclick="closeChat()" style="padding-left:0;"><i class="fa-solid fa-arrow-left"></i></button>
                <div class="dp-circle" style="width:38px; height:38px;"><img id="partner-dp" src=""></div>
                <div style="cursor:pointer;" onclick="document.getElementById('chat-opts-modal').style.display='flex'">
                    <div id="chat-partner-name" style="font-weight:600; font-size:1rem;">Partner</div>
                    <div id="chat-status" style="font-size:0.75rem; color:var(--text-muted);">Offline</div>
                    <div id="typing-ind" class="typing-indicator">typing...</div>
                </div>
            </div>
            <div style="display:flex;">
                <button class="icon-btn" id="mask-btn" onclick="toggleMask()"><i class="fa-solid fa-eye-slash"></i></button>
                <button class="icon-btn" onclick="alert('Initiating Video Call')"><i class="fa-solid fa-video"></i></button>
            </div>
        </header>

        <div class="chat-messages" id="chat-messages"></div>

        <div class="chat-input-area glass-panel">
            <button class="icon-btn" onclick="document.getElementById('media-upload').click()"><i class="fa-solid fa-paperclip"></i></button>
            <input type="text" id="msg-input" placeholder="Type a message..." oninput="handleTyping()">
            <button class="icon-btn" style="color:var(--primary); font-size: 1.5rem;" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <div class="modal" id="chat-opts-modal">
        <div class="modal-content glass-panel" style="text-align:center;">
            <h3 style="margin-bottom:20px;">Chat Options</h3>
            <button class="btn" style="margin-bottom:10px; background: rgba(255,255,255,0.1); color: white;" onclick="alert('Cleared')">Clear Chat</button>
            <button class="btn btn-danger" style="margin-bottom:10px;" onclick="blockUser()">Block User</button>
            <button class="btn btn-sm" style="background:transparent; color:var(--text-muted); width: 100%;" onclick="document.getElementById('chat-opts-modal').style.display='none'">Cancel</button>
        </div>
    </div>

    <div class="modal" id="friends-game-modal">
        <div class="modal-content glass-panel">
            <h3 style="margin-bottom:15px; text-align:center;">Invite Friend</h3>
            <div id="game-friends-list" style="max-height:250px; overflow-y:auto; margin-bottom:15px;"></div>
            <button class="btn btn-sm" style="background:transparent; color:var(--text-muted); width: 100%;" onclick="document.getElementById('friends-game-modal').style.display='none'">Close</button>
        </div>
    </div>

    <div id="game-screen">
        <h2 style="color:var(--primary); font-family:monospace; margin-bottom:20px;">SCORE: <span id="score-display">0</span></h2>
        <canvas id="snakeCanvas" width="300" height="300" style="border: 2px solid var(--primary); border-radius: 12px; background:#111; box-shadow: var(--primary-glow);"></canvas>
        <button class="btn btn-danger" style="margin-top:30px; width: 200px;" onclick="closeGame()">Exit Game</button>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection, addDoc, query, orderBy, where, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyDMSGPEngVmGtTRfcnIC4unH7Rh3FwgcRE", authDomain: "sv-billing-250c2.firebaseapp.com", projectId: "sv-billing-250c2", storageBucket: "sv-billing-250c2.firebasestorage.app", messagingSenderId: "847927101892", appId: "1:847927101892:web:800c182fe47f133d537c91" };
    const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

    let currentUser = null, userData = null;
    let currentChatId = null, currentPartnerId = null;
    let maskActive = false, aiActive = false;
    let typingTimer = null;

    // --- POPUP NOTIFICATION ---
    function showPopup(title, desc) {
        document.getElementById('notif-sound').play().catch(()=>{});
        const p = document.getElementById('popup-notif');
        document.getElementById('notif-title').innerText = title; document.getElementById('notif-desc').innerText = desc;
        p.style.top = '20px'; setTimeout(() => p.style.top = '-100px', 3500);
    }

    // --- AUTH ---
    let isLogin = true;
    window.toggleAuth = () => { isLogin = !isLogin; document.getElementById('auth-user').style.display=isLogin?'none':'block'; document.getElementById('btn-login').style.display=isLogin?'block':'none'; document.getElementById('btn-signup').style.display=isLogin?'none':'block'; document.getElementById('auth-tog').innerText=isLogin?"New User? Create Account":"Have Account? Login"; };
    
    window.login = async () => { try { await signInWithEmailAndPassword(auth, document.getElementById('auth-email').value, document.getElementById('auth-pass').value); } catch(err) { alert(err.message); } };
    window.signup = async () => { 
        const e=document.getElementById('auth-email').value, p=document.getElementById('auth-pass').value, u=document.getElementById('auth-user').value; if(!u) return; 
        try { const cred = await createUserWithEmailAndPassword(auth, e, p); await setDoc(doc(db, "users", cred.user.uid), { username: u, dp: 'https://avatar.iran.liara.run/public', lastOnline: Date.now() }); } catch(err) { alert(err.message); } 
    };

    onAuthStateChanged(auth, async (user) => {
        if(user) {
            currentUser = user; const snap = await getDoc(doc(db, "users", user.uid)); userData = snap.data();
            document.getElementById('auth-screen').style.display = 'none'; document.getElementById('main-app').style.display = 'flex';
            document.getElementById('my-username').innerText = userData.username; document.getElementById('my-dp').src = userData.dp;
            
            setInterval(() => updateDoc(doc(db, "users", user.uid), { lastOnline: Date.now() }), 30000);
            loadChats(); loadRequests();
        }
    });

    window.switchNav = (tab) => { document.querySelectorAll('.list-view, .nav-item').forEach(e=>e.classList.remove('active')); document.getElementById(`tab-${tab}`).classList.add('active'); event.currentTarget.classList.add('active'); };

    // --- ENCRYPTION ---
    function enc(txt) { return CryptoJS.AES.encrypt(txt, "master-key").toString(); }
    function dec(ciph) { try { return CryptoJS.AES.decrypt(ciph, "master-key").toString(CryptoJS.enc.Utf8); } catch(e){ return "Encrypted"; } }

    // --- SEARCH & REQUESTS ---
    window.searchUsersLive = async () => {
        const text = document.getElementById('search-input').value.toLowerCase().trim(); const res = document.getElementById('search-results'); if(text.length<2) {res.innerHTML=''; return;}
        const snap = await getDocs(collection(db, "users")); let html = '';
        snap.forEach(d => { if(d.id!==currentUser.uid && d.data().username.toLowerCase().includes(text)) { html += `<div class="list-item glass-panel"><div class="dp-circle" style="width:36px;height:36px;"><img src="${d.data().dp}"></div><div class="item-info"><div class="item-title">${d.data().username}</div></div><button class="btn btn-sm" onclick="sendReq('${d.id}')">Add</button></div>`; } });
        res.innerHTML = html || "<p style='font-size:0.8rem; color:var(--text-muted);'>No users found</p>";
    };
    window.sendReq = async (tid) => { await setDoc(doc(db, `reqs/${currentUser.uid}_${tid}`), { sender: currentUser.uid, sName: userData.username, receiver: tid, status: 'pending', time: Date.now() }); alert("Sent!"); document.getElementById('search-input').value=''; document.getElementById('search-results').innerHTML=''; };

    function loadRequests() {
        onSnapshot(query(collection(db, "reqs"), where("receiver", "==", currentUser.uid)), (snap) => {
            let html = ''; snap.forEach(d => { const r = d.data(); if(r.status==='pending') { html += `<div class="list-item glass-panel"><div class="item-info"><div class="item-title">${r.sName}</div></div><button class="btn btn-sm" style="background:var(--success); margin-right:5px;" onclick="accReq('${d.id}','${r.sender}')"><i class="fa-solid fa-check"></i></button><button class="btn btn-sm btn-danger" onclick="rejReq('${d.id}')"><i class="fa-solid fa-xmark"></i></button></div>`; } });
            document.getElementById('requests-list').innerHTML = html || "<p style='font-size:0.8rem; color:var(--text-muted);'>No pending requests</p>";
        });
    }
    window.accReq = async (id, sid) => { await updateDoc(doc(db, "reqs", id), {status:'accepted'}); const cid = currentUser.uid>sid?currentUser.uid+sid:sid+currentUser.uid; await setDoc(doc(db, "chats", cid), { users: [currentUser.uid, sid] }); switchNav('chats'); };
    window.rejReq = async (id) => { await deleteDoc(doc(db, "reqs", id)); };

    // --- CHATS ---
    let myChatsData = [];
    function loadChats() {
        onSnapshot(query(collection(db, "chats"), where("users", "array-contains", currentUser.uid)), async (snap) => {
            let html = ''; myChatsData = [];
            for(let d of snap.docs) {
                const c = d.data(); const pid = c.users.find(id=>id!==currentUser.uid); const pSnap = await getDoc(doc(db, "users", pid));
                if(pSnap.exists()) {
                    myChatsData.push({ id: d.id, pid: pid, name: pSnap.data().username, dp: pSnap.data().dp });
                    
                    const mSnap = await getDocs(query(collection(db, `chats/${d.id}/messages`), orderBy("time", "desc")));
                    let lastMsg = "Start chatting...", unread = 0;
                    if(!mSnap.empty) {
                        lastMsg = dec(mSnap.docs[0].data().text);
                        mSnap.forEach(m => { if(m.data().sender !== currentUser.uid && !m.data().seen) unread++; });
                    }
                    html += `<div class="list-item glass-panel" onclick="openChat('${d.id}', '${pid}', '${pSnap.data().username}', '${pSnap.data().dp}')">
                        <div class="dp-circle"><img src="${pSnap.data().dp}"></div>
                        <div class="item-info">
                            <div class="item-title"><span>${pSnap.data().username}</span> ${unread>0?`<span class="badge">${unread}</span>`:''}</div>
                            <div class="item-sub">${lastMsg}</div>
                        </div>
                    </div>`;
                }
            }
            document.getElementById('chats-list').innerHTML = html || "<p style='text-align:center; color:var(--text-muted); margin-top:20px;'>No active chats.</p>";
        });
    }

    let msgListener = null, typingListener = null;
    window.openChat = async (cid, pid, name, dp) => {
        currentChatId = cid; currentPartnerId = pid;
        document.getElementById('chat-partner-name').innerText = name; document.getElementById('partner-dp').src = dp;
        document.getElementById('chat-screen').style.display = 'flex';
        
        // Online Status
        setInterval(async () => {
            if(!currentPartnerId) return; const pDoc = await getDoc(doc(db, "users", currentPartnerId));
            if(pDoc.exists()) { const diff = Date.now() - pDoc.data().lastOnline; document.getElementById('chat-status').innerText = diff < 60000 ? 'Online' : 'Offline'; document.getElementById('chat-status').style.color = diff < 60000 ? 'var(--primary)' : 'var(--text-muted)'; }
        }, 5000);

        // Typing Listener
        if(typingListener) typingListener();
        typingListener = onSnapshot(doc(db, "chats", cid), (d) => {
            const data = d.data();
            if(data && data.typing === currentPartnerId) { document.getElementById('typing-ind').style.display = 'block'; document.getElementById('chat-status').style.display = 'none'; }
            else { document.getElementById('typing-ind').style.display = 'none'; document.getElementById('chat-status').style.display = 'block'; }
        });

        // Messages
        if(msgListener) msgListener();
        msgListener = onSnapshot(query(collection(db, `chats/${cid}/messages`), orderBy("time")), (snap) => {
            let html = ''; snap.forEach(mD => {
                const m = mD.data(); const isMe = m.sender === currentUser.uid;
                if(!isMe && !m.seen) updateDoc(mD.ref, { seen: true });
                
                let timeStr = new Date(m.time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                html += `<div class="msg-bubble ${isMe?'msg-mine':'msg-theirs'}">
                    ${m.type === 'game_req' ? `<b>Tic-Tac-Toe Invite</b><br><button class="btn btn-sm" style="margin-top:5px;">Play Now</button>` : dec(m.text)}
                    <div style="font-size:0.65rem; color:rgba(255,255,255,0.5); text-align:right; margin-top:4px;">${timeStr}</div>
                </div>`;
            });
            document.getElementById('chat-messages').innerHTML = html;
            setTimeout(()=> document.getElementById('chat-messages').scrollTop = 9999, 100);
            
            snap.docChanges().forEach(c => { if(c.type === 'added' && c.doc.data().sender !== currentUser.uid) showPopup(name, dec(c.doc.data().text)); });
        });
    };
    window.closeChat = () => { document.getElementById('chat-screen').style.display = 'none'; currentChatId = null; };

    window.handleTyping = () => {
        if(!currentChatId) return; clearTimeout(typingTimer);
        updateDoc(doc(db, "chats", currentChatId), { typing: currentUser.uid });
        typingTimer = setTimeout(() => updateDoc(doc(db, "chats", currentChatId), { typing: null }), 2000);
    };

    window.sendMessage = async () => {
        const t = document.getElementById('msg-input').value.trim(); if(!t) return;
        document.getElementById('msg-input').value = ''; updateDoc(doc(db, "chats", currentChatId), { typing: null });
        await addDoc(collection(db, `chats/${currentChatId}/messages`), { sender: currentUser.uid, text: enc(t), type: 'text', time: Date.now(), seen: false });
    };

    window.toggleMask = () => { maskActive = !maskActive; document.getElementById('mask-btn').style.color = maskActive?'var(--danger)':'var(--text-muted)'; if(maskActive) document.getElementById('chat-messages').classList.add('blurred-chat'); else document.getElementById('chat-messages').classList.remove('blurred-chat'); };
    window.blockUser = () => { alert("User Blocked"); document.getElementById('chat-opts-modal').style.display='none'; closeChat(); };

    // --- MULTIPLAYER GAMES (Direct Friends Fetch) ---
    window.openFriendsForGame = () => {
        let html = '';
        myChatsData.forEach(c => { html += `<div class="list-item glass-panel" onclick="sendGameReq('${c.id}', '${c.pid}')"><div class="dp-circle" style="width:36px;height:36px;"><img src="${c.dp}"></div><div class="item-info"><div class="item-title">${c.name}</div></div><button class="btn btn-sm">Invite</button></div>`; });
        document.getElementById('game-friends-list').innerHTML = html || "<p style='text-align:center;'>No friends available.</p>";
        document.getElementById('friends-game-modal').style.display = 'flex';
    };
    window.sendGameReq = async (cid, pid) => {
        await addDoc(collection(db, `chats/${cid}/messages`), { sender: currentUser.uid, text: enc("Game Invite"), type: 'game_req', time: Date.now(), seen: false });
        alert("Invite Sent to Chat!"); document.getElementById('friends-game-modal').style.display = 'none';
    };

    // --- AI CAMERA ANIMATION & DETECTION (Using cocossd) ---
    window.toggleAI = async () => {
        aiActive = !aiActive; const btn = document.getElementById('ai-toggle');
        if(aiActive) {
            btn.classList.add('cam-active'); // Triggers Red Pulse Animation
            const s = await navigator.mediaDevices.getUserMedia({video:true}); document.getElementById('ai-video').srcObject=s;
            ml5.objectDetector('cocossd', (err, d) => { 
                if(err) return;
                setInterval(()=>{ if(!aiActive) return; d.detect(document.getElementById('ai-video'), (e, r)=>{ 
                    if(r) { const p = r.filter(x=>x.label==='person'); if(p.length>1) { document.getElementById('chat-screen').style.display='none'; openGame('snake'); } }
                }); }, 1500); 
            });
        } else { btn.classList.remove('cam-active'); document.getElementById('ai-video').srcObject?.getTracks().forEach(t=>t.stop()); }
    };

    // --- FALLBACK SNAKE GAME ---
    let gameInt;
    window.openGame = () => { document.getElementById('game-screen').style.display='flex'; initSnake(); };
    window.closeGame = () => { document.getElementById('game-screen').style.display='none'; clearInterval(gameInt); };
    function initSnake() {
        const c=document.getElementById('snakeCanvas').getContext('2d'); let s=[{x:15,y:15}], f={x:5,y:5}, d={x:1,y:0}, sc=0; clearInterval(gameInt);
        gameInt=setInterval(()=>{
            c.fillStyle='#111';c.fillRect(0,0,300,300); c.fillStyle='var(--primary)'; s.forEach(p=>c.fillRect(p.x*10,p.y*10,9,9)); c.fillStyle='var(--danger)'; c.fillRect(f.x*10,f.y*10,9,9);
            let h={x:s[0].x+d.x, y:s[0].y+d.y};
            if(h.x<0||h.x>29||h.y<0||h.y>29){clearInterval(gameInt);return;}
            s.unshift(h); if(h.x===f.x&&h.y===f.y){sc+=10; document.getElementById('score-display').innerText=sc; f={x:Math.floor(Math.random()*29),y:Math.floor(Math.random()*29)};}else s.pop();
        },100);
    }
</script>
</body>
</html>
