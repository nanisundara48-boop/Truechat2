<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TrueChats Secure</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://unpkg.com/ml5@latest/dist/ml5.min.js"></script>
    
    <style>
        /* --- DYNAMIC THEME VARIABLES --- */
        :root {
            /* LIGHT THEME (Default) */
            --bg-main: #f0f2f5; --bg-panel: #ffffff; --bg-hover: #f5f6f6;
            --primary: #00a884; --primary-hover: #008f6f;
            --text-main: #111b21; --text-muted: #667781;
            --danger: #ef4444; --success: #00a884;
            --chat-mine: #d9fdd3; --chat-theirs: #ffffff;
            --header-bg: #f0f2f5; --footer-bg: #ffffff; --border-color: #d1d7db;
        }

        body.dark-mode {
            --bg-main: #0b141a; --bg-panel: #111b21; --bg-hover: #202c33;
            --text-main: #e9edef; --text-muted: #8696a0;
            --chat-mine: #005c4b; --chat-theirs: #202c33;
            --header-bg: #202c33; --footer-bg: #202c33; --border-color: #2a3942;
        }

        body.ghost-mode {
            --bg-main: #120008; --bg-panel: #240010; --bg-hover: #3d001b;
            --primary: #ff1493; --text-main: #ffe4e1; --text-muted: #ffb6c1;
            --chat-mine: #8b0046; --chat-theirs: #3d001b;
            --header-bg: #240010; --footer-bg: #240010; --border-color: #4a152c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-main); color: var(--text-main); height: 100dvh; width: 100vw; display: flex; flex-direction: column; overflow: hidden; transition: background-color 0.3s ease, color 0.3s ease; }
        
        .header { height: 65px; flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; background: var(--header-bg); border-bottom: 1px solid var(--border-color); z-index: 10; }
        .main-content { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; background: var(--bg-main); }
        .footer-nav { height: 60px; flex-shrink: 0; display: flex; justify-content: space-around; align-items: center; background: var(--footer-bg); border-top: 1px solid var(--border-color); z-index: 10; padding-bottom: env(safe-area-inset-bottom); }

        .icon-btn { background: none; border: none; color: var(--text-muted); font-size: 1.3rem; cursor: pointer; padding: 10px; transition: 0.2s; }
        .icon-btn:hover { color: var(--primary); }
        
        .dp-circle { width: 42px; height: 42px; border-radius: 50%; background: #ccc; overflow: hidden; display: flex; justify-content: center; align-items: center; cursor: pointer; border: 1px solid var(--primary); flex-shrink: 0; }
        .dp-circle img { width: 100%; height: 100%; object-fit: cover; }
        
        .list-view { display: none; padding: 10px; height: 100%; }
        .list-view.active { display: block; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .list-item { display: flex; align-items: center; padding: 12px 10px; border-radius: 12px; margin-bottom: 5px; cursor: pointer; background: var(--bg-panel); border: 1px solid var(--border-color); }
        .list-item:hover { background: var(--bg-hover); }
        .item-info { flex: 1; padding-left: 15px; overflow: hidden; }
        .item-title { font-weight: 600; font-size: 1rem; color: var(--text-main); white-space: nowrap; text-overflow: ellipsis; }
        .item-sub { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; text-overflow: ellipsis; margin-top: 3px; }

        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 0.75rem; gap: 4px; cursor: pointer; width: 60px; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 1.2rem; }

        .input-box { width: 100%; padding: 12px 15px; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-main); outline: none; margin-bottom: 10px; font-size: 1rem; }
        .btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-sm { width: auto; padding: 8px 15px; border-radius: 6px; font-size: 0.9rem; }
        .btn-danger { background: var(--danger); }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }

        /* --- CHAT SCREEN --- */
        #chat-screen { position: absolute; top:0; left:0; width:100%; height:100dvh; background: var(--bg-main); display: none; flex-direction: column; z-index: 100; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .msg-bubble { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .msg-mine { align-self: flex-end; background: var(--chat-mine); border-top-right-radius: 0; }
        .msg-theirs { align-self: flex-start; background: var(--chat-theirs); border-top-left-radius: 0; }
        .msg-game { align-self: center; background: var(--bg-hover); border: 1px solid var(--primary); text-align: center; border-radius: 15px; width: 80%; }
        
        .chat-input-area { min-height: 60px; padding: 10px; background: var(--header-bg); display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--border-color); }
        .chat-input-area input { flex: 1; padding: 12px 15px; border-radius: 20px; border: none; background: var(--bg-panel); color: var(--text-main); border: 1px solid var(--border-color); outline: none; font-size: 1rem;}

        /* --- GAMES & MODALS --- */
        .modal { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 200; padding: 20px; backdrop-filter: blur(5px);}
        .modal-content { background: var(--bg-panel); padding: 20px; border-radius: 15px; width: 100%; max-width: 350px; }
        
        #game-screen { position: absolute; top:0; left:0; width:100%; height:100%; background: #111; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; color: white;}
        .ttt-board { display: grid; grid-template-columns: repeat(3, 80px); grid-template-rows: repeat(3, 80px); gap: 5px; margin: 20px 0; }
        .ttt-cell { background: #222; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 2.5rem; font-weight: bold; cursor: pointer; border: 1px solid #444; }
        .ttt-cell.x { color: var(--primary); } .ttt-cell.o { color: var(--danger); }
        
        /* --- CALLING UI --- */
        #call-screen { position: absolute; top:0; left:0; width:100%; height:100%; background: #1a1a1a; display: none; flex-direction: column; z-index: 2000; color: white; }
        .call-video { position: absolute; top:0; left:0; width:100%; height:100%; object-fit: cover; opacity: 0.5; }
        .call-controls { position: absolute; bottom: 40px; width: 100%; display: flex; justify-content: space-evenly; align-items: center; z-index: 10; }
        .call-btn { width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 1.5rem; color: white; background: rgba(255,255,255,0.2); cursor: pointer; backdrop-filter: blur(5px); }
        .call-btn.active { background: white; color: black; }
        .call-btn.hangup { background: var(--danger); }
    </style>
</head>
<body>

    <audio id="ringtone" loop src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>
    <video id="ai-video" style="display:none;" width="320" height="240" autoplay muted></video>

    <div id="auth-screen" style="height:100dvh; display:flex; flex-direction:column; justify-content:center; padding:30px; background:var(--bg-main);">
        <h1 style="color:var(--primary); margin-bottom:30px; text-align:center;"><i class="fa-solid fa-shield-halved"></i> TrueChats</h1>
        <input type="email" id="auth-email" class="input-box" placeholder="Email Address">
        <input type="password" id="auth-pass" class="input-box" placeholder="Password">
        <input type="text" id="auth-user" class="input-box" placeholder="Username (Signup only)" style="display:none;">
        <button class="btn" id="btn-login" onclick="login()">Secure Login</button>
        <button class="btn" id="btn-signup" onclick="signup()" style="display:none;">Create Account</button>
        <p onclick="toggleAuth()" style="color:var(--primary); margin-top:20px; text-align:center; cursor:pointer;">New User? Sign Up Here</p>
    </div>

    <div id="main-app" style="display:none; flex-direction:column; height:100dvh;">
        <header class="header">
            <div style="display:flex; align-items:center; gap:12px;">
                <div class="dp-circle"><i class="fa-solid fa-user"></i></div>
                <div>
                    <div id="my-username" style="font-weight:600;" onmousedown="startGhostTimer()" onmouseup="clearGhostTimer()" ontouchstart="startGhostTimer()" ontouchend="clearGhostTimer()">User</div>
                    <div style="font-size:0.7rem; color:var(--success);"><i class="fa-solid fa-signal"></i> Online</div>
                </div>
            </div>
            <div>
                <button class="icon-btn" onclick="toggleTheme()"><i class="fa-solid fa-circle-half-stroke"></i></button>
                <button class="icon-btn" id="ai-toggle" onclick="toggleAI()"><i class="fa-solid fa-user-shield"></i></button>
            </div>
        </header>

        <main class="main-content">
            <div class="list-view active" id="tab-chats">
                <div id="chats-list"></div>
            </div>

            <div class="list-view" id="tab-requests">
                <input type="text" id="search-input" class="input-box" placeholder="Search users by name..." oninput="searchUsersLive()">
                <div id="search-results" style="margin-bottom:20px;"></div>
                <h3 style="font-size:0.85rem; color:var(--text-muted); margin-bottom:10px; padding-left:5px;">PENDING REQUESTS</h3>
                <div id="requests-list"></div>
            </div>

            <div class="list-view" id="tab-games" style="text-align:center; padding-top:20px;">
                <h2 style="color:var(--primary); margin-bottom: 20px;">Arcade Zone</h2>
                <div class="list-item" style="flex-direction:column; padding: 20px;" onclick="openGame('snake')">
                    <i class="fa-solid fa-worm" style="font-size:2.5rem; color:var(--success); margin-bottom:10px;"></i>
                    <div class="item-title">Snake Classic</div>
                </div>
                <div class="list-item" style="flex-direction:column; padding: 20px; margin-top: 15px;" onclick="document.getElementById('ttt-modal').style.display='flex'">
                    <i class="fa-solid fa-hashtag" style="font-size:2.5rem; color:var(--danger); margin-bottom:10px;"></i>
                    <div class="item-title">Tic-Tac-Toe</div>
                    <div class="item-sub">Play with AI or Friends</div>
                </div>
            </div>
        </main>

        <footer class="footer-nav">
            <div class="nav-item active" onclick="switchNav('chats')"><i class="fa-solid fa-message"></i>Chats</div>
            <div class="nav-item" onclick="switchNav('requests')"><i class="fa-solid fa-user-plus"></i>Requests</div>
            <div class="nav-item" onclick="switchNav('games')"><i class="fa-solid fa-gamepad"></i>Games</div>
        </footer>
    </div>

    <div id="chat-screen">
        <header class="header">
            <div style="display:flex; align-items:center; gap:10px;">
                <button class="icon-btn" onclick="closeChat()" style="padding-left:0;"><i class="fa-solid fa-arrow-left"></i></button>
                <div class="dp-circle" style="width:36px; height:36px;"><i class="fa-solid fa-user"></i></div>
                <div style="max-width:140px;">
                    <div id="chat-partner-name" style="font-weight:600; font-size:1rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Partner</div>
                    <div style="font-size:0.7rem; color:var(--success);">Encrypted</div>
                </div>
            </div>
            <div style="display:flex;">
                <button class="icon-btn" onclick="initiateCall('video')"><i class="fa-solid fa-video"></i></button>
                <button class="icon-btn" onclick="initiateCall('audio')"><i class="fa-solid fa-phone"></i></button>
            </div>
        </header>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="msg-input" placeholder="Type a message...">
            <button class="icon-btn" style="color:var(--primary); font-size: 1.5rem;" onclick="sendMessage()"><i class="fa-solid fa-circle-arrow-right"></i></button>
        </div>
    </div>

    <div id="call-screen">
        <video id="local-video" class="call-video" autoplay muted playsinline></video>
        <div style="position: absolute; top: 60px; width: 100%; text-align: center; z-index: 10;">
            <div class="dp-circle" style="width:100px; height:100px; margin:0 auto 10px;"><i class="fa-solid fa-user" style="font-size:3rem;"></i></div>
            <h2 id="calling-name">Partner</h2>
            <p id="call-status-text" style="color:var(--primary);">Ringing...</p>
        </div>
        <div class="call-controls">
            <button class="call-btn" id="btn-mute" onclick="toggleMute()"><i class="fa-solid fa-microphone-slash"></i></button>
            <button class="call-btn" id="btn-vid" onclick="toggleVid()"><i class="fa-solid fa-video-slash"></i></button>
            <button class="call-btn hangup" onclick="endCall()"><i class="fa-solid fa-phone-slash"></i></button>
        </div>
    </div>

    <div class="modal" id="ttt-modal">
        <div class="modal-content" style="text-align:center;">
            <h3 style="margin-bottom:20px;">Tic-Tac-Toe Setup</h3>
            <button class="btn" style="margin-bottom:10px;" onclick="setupAI('Easy')">Play vs AI (Easy)</button>
            <button class="btn" style="margin-bottom:10px;" onclick="setupAI('Hard')">Play vs AI (Hard)</button>
            <hr style="border:0; border-top:1px solid var(--border-color); margin:15px 0;">
            <button class="btn btn-outline" onclick="showFriendsList()">Play vs Friend (Multiplayer)</button>
            <button class="btn-sm" style="margin-top:15px; background:transparent; color:var(--text-muted);" onclick="document.getElementById('ttt-modal').style.display='none'">Cancel</button>
        </div>
    </div>

    <div class="modal" id="friends-modal">
        <div class="modal-content">
            <h3 style="margin-bottom:15px;">Select Friend to Play</h3>
            <div id="friends-to-invite" style="max-height: 250px; overflow-y: auto;"></div>
            <button class="btn-sm" style="margin-top:15px; width:100%;" onclick="document.getElementById('friends-modal').style.display='none'">Close</button>
        </div>
    </div>

    <div id="game-screen">
        <div id="waiting-screen" style="display:none; text-align:center;">
            <i class="fa-solid fa-spinner fa-spin" style="font-size:3rem; color:var(--primary); margin-bottom:20px;"></i>
            <h3>Waiting for opponent...</h3>
            <button class="btn btn-danger btn-sm" style="margin-top:20px;" onclick="cancelGameReq()">Cancel</button>
        </div>

        <div id="snake-ui" style="display:none; flex-direction:column; align-items:center;">
            <h2 style="color:var(--success); font-family:monospace;">SCORE: <span id="score-display">0</span></h2>
            <canvas id="snakeCanvas" width="300" height="300" style="border: 2px solid var(--success); border-radius: 8px; margin-top:10px; background:#111;"></canvas>
            <div style="display:grid; grid-template-columns:60px 60px 60px; gap:5px; margin-top:20px;">
                <div class="btn" style="grid-column:2; text-align:center;" onclick="changeDir(0,-1)"><i class="fa-solid fa-arrow-up"></i></div>
                <div class="btn" style="grid-column:1; text-align:center;" onclick="changeDir(-1,0)"><i class="fa-solid fa-arrow-left"></i></div>
                <div class="btn" style="grid-column:3; text-align:center;" onclick="changeDir(1,0)"><i class="fa-solid fa-arrow-right"></i></div>
                <div class="btn" style="grid-column:2; text-align:center;" onclick="changeDir(0,1)"><i class="fa-solid fa-arrow-down"></i></div>
            </div>
        </div>

        <div id="ttt-ui" style="display:none; flex-direction:column; align-items:center;">
            <h2 style="color:var(--primary); margin-bottom: 10px;">Tic-Tac-Toe</h2>
            <div id="ttt-status" style="color: white; margin-bottom: 10px;">Your Turn (X)</div>
            <div class="ttt-board" id="ttt-board"></div>
            <button class="btn btn-sm" id="btn-rematch" style="margin-top:20px; display:none;" onclick="reqRematch()">Rematch</button>
        </div>

        <button class="btn btn-danger btn-sm" id="btn-exit-game" style="margin-top:30px; width: 200px;" onclick="closeGame()">Exit Arcade</button>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection, addDoc, query, orderBy, where, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyDMSGPEngVmGtTRfcnIC4unH7Rh3FwgcRE", authDomain: "sv-billing-250c2.firebaseapp.com", projectId: "sv-billing-250c2", storageBucket: "sv-billing-250c2.firebasestorage.app", messagingSenderId: "847927101892", appId: "1:847927101892:web:800c182fe47f133d537c91" };
    const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

    let currentUser = null, userData = null, isPrivate = false;
    let currentChatId = null, currentPartnerId = null;
    let localStream = null, callRef = null;

    // --- THEME ---
    let isDark = false;
    window.toggleTheme = () => { isDark = !isDark; document.body.classList.toggle('dark-mode', isDark); };

    // --- AUTH ---
    let isLoginMode = true;
    window.toggleAuth = () => { isLoginMode = !isLoginMode; document.getElementById('auth-user').style.display = isLoginMode ? 'none' : 'block'; document.getElementById('btn-login').style.display = isLoginMode ? 'block' : 'none'; document.getElementById('btn-signup').style.display = isLoginMode ? 'none' : 'block'; };
    window.login = async () => { try { await signInWithEmailAndPassword(auth, document.getElementById('auth-email').value, document.getElementById('auth-pass').value); } catch(err) { alert(err.message); } };
    window.signup = async () => { const e=document.getElementById('auth-email').value, p=document.getElementById('auth-pass').value, u=document.getElementById('auth-user').value; if(!u) return; try { const cred = await createUserWithEmailAndPassword(auth, e, p); await setDoc(doc(db, "users", cred.user.uid), { username: u }); } catch(err) { alert(err.message); } };

    onAuthStateChanged(auth, async (user) => {
        if(user) {
            currentUser = user; const snap = await getDoc(doc(db, "users", user.uid)); userData = snap.data();
            document.getElementById('auth-screen').style.display = 'none'; document.getElementById('main-app').style.display = 'flex';
            document.getElementById('my-username').innerText = userData.username;
            loadChats(); loadRequests(); listenForCalls(); listenForGames();
        }
    });

    // --- NAV & SEARCH ---
    window.switchNav = (tab) => { document.querySelectorAll('.list-view').forEach(el => el.classList.remove('active')); document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active')); document.getElementById(`tab-${tab}`).classList.add('active'); event.currentTarget.classList.add('active'); };
    
    window.searchUsersLive = async () => {
        const text = document.getElementById('search-input').value.toLowerCase().trim(); const resBox = document.getElementById('search-results');
        if(text.length < 2) { resBox.innerHTML = ''; return; }
        const snap = await getDocs(collection(db, "users")); let html = '';
        snap.forEach(d => { if(d.id !== currentUser.uid && d.data().username?.toLowerCase().includes(text)) { html += `<div class="list-item"><div class="item-info"><div class="item-title">${d.data().username}</div></div><button class="btn btn-sm" onclick="sendRequest('${d.id}')">Add</button></div>`; } });
        resBox.innerHTML = html || "<p style='padding:10px; font-size:0.8rem;'>No users found</p>";
    };

    window.sendRequest = async (tid) => { await setDoc(doc(db, `friend_requests/${currentUser.uid}_${tid}`), { sender: currentUser.uid, senderName: userData.username, receiver: tid, status: 'pending' }); alert("Request Sent!"); document.getElementById('search-input').value=''; document.getElementById('search-results').innerHTML=''; };

    function loadRequests() {
        onSnapshot(query(collection(db, "friend_requests"), where("receiver", "==", currentUser.uid), where("status", "==", "pending")), (snap) => {
            let html = ''; snap.forEach(d => { const req = d.data(); html += `<div class="list-item"><div class="item-info"><div class="item-title">${req.senderName}</div></div><div style="display:flex; gap:8px;"><button class="btn btn-sm" style="background:var(--success);" onclick="acceptReq('${d.id}', '${req.sender}')">Accept</button><button class="btn btn-sm btn-danger" onclick="rejectReq('${d.id}')">Reject</button></div></div>`; });
            document.getElementById('requests-list').innerHTML = html || "<p style='padding:10px; font-size:0.8rem;'>No requests</p>";
        });
    }

    // FIX: Instant Chat Addition
    window.acceptReq = async (reqId, senderId) => {
        const chatId = currentUser.uid > senderId ? currentUser.uid + senderId : senderId + currentUser.uid;
        await setDoc(doc(db, "chats", chatId), { users: [currentUser.uid, senderId] });
        await deleteDoc(doc(db, "friend_requests", reqId));
        switchNav('chats'); // Switch to chats instantly
    };
    window.rejectReq = async (reqId) => { await deleteDoc(doc(db, "friend_requests", reqId)); };

    // --- CHATS & AUTO-HI ---
    function encryptText(text) { return CryptoJS.AES.encrypt(text, "secret-key").toString(); }
    function decryptText(cipher) { try { return CryptoJS.AES.decrypt(cipher, "secret-key").toString(CryptoJS.enc.Utf8); } catch(e) { return "Encrypted"; } }

    function loadChats() {
        onSnapshot(query(collection(db, "chats"), where("users", "array-contains", currentUser.uid)), (snap) => {
            let html = ''; snap.forEach(async d => {
                const partnerId = d.data().users.find(id => id !== currentUser.uid);
                const pSnap = await getDoc(doc(db, "users", partnerId));
                if(pSnap.exists()) {
                    html += `<div class="list-item" onclick="openChat('${d.id}', '${partnerId}', '${pSnap.data().username}')">
                        <div class="dp-circle"><i class="fa-solid fa-user"></i></div>
                        <div class="item-info"><div class="item-title">${pSnap.data().username}</div><div class="item-sub">Tap to chat</div></div>
                        <div style="display:flex; gap:5px;"><button class="btn btn-sm btn-danger" onclick="event.stopPropagation(); removeChat('${d.id}')">Remove</button></div>
                    </div>`;
                    document.getElementById('chats-list').innerHTML = html;
                }
            });
            if(snap.empty) document.getElementById('chats-list').innerHTML = "<p style='padding:20px; text-align:center;'>No chats.</p>";
        });
    }

    window.removeChat = async (cid) => { if(confirm("Remove friend?")) await deleteDoc(doc(db, "chats", cid)); };

    window.openChat = async (chatId, pId, pName) => {
        currentChatId = chatId; currentPartnerId = pId;
        document.getElementById('chat-partner-name').innerText = pName;
        document.getElementById('chat-screen').style.display = 'flex';
        
        onSnapshot(query(collection(db, `chats/${chatId}/messages`), orderBy("timestamp")), (snap) => {
            if(snap.empty && document.getElementById('msg-input').value === '') {
                document.getElementById('msg-input').value = "Hi 👋"; // Auto-Hi implementation
            }
            let html = ''; snap.forEach(m => {
                const msg = m.data(); const isMe = msg.sender === currentUser.uid;
                
                if(msg.type === 'game_req') {
                    html += `<div class="msg-bubble msg-game">
                        <i class="fa-solid fa-gamepad" style="font-size:2rem; color:var(--primary); margin-bottom:5px;"></i><br>
                        <b>Tic-Tac-Toe Invite</b><br>
                        ${!isMe ? `<button class="btn btn-sm" style="margin-top:10px;" onclick="acceptGame('${msg.gameId}')">Play Now</button>` : `<span style='font-size:0.8rem;'>Invite Sent</span>`}
                    </div>`;
                } else {
                    html += `<div class="msg-bubble ${isMe ? 'msg-mine' : 'msg-theirs'}">${decryptText(msg.text)}</div>`;
                }
            });
            document.getElementById('chat-messages').innerHTML = html;
            document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;
        });
    };

    window.closeChat = () => { document.getElementById('chat-screen').style.display = 'none'; currentChatId = null; };
    window.sendMessage = async () => {
        const inp = document.getElementById('msg-input'); const text = inp.value.trim(); if(!text) return;
        inp.value = ''; await addDoc(collection(db, `chats/${currentChatId}/messages`), { sender: currentUser.uid, text: encryptText(text), timestamp: Date.now() });
    };

    // --- CALLING UI ---
    window.initiateCall = async (type) => {
        await setDoc(doc(db, "calls", currentChatId), { caller: currentUser.uid, receiver: currentPartnerId, type: type, status: 'ringing' });
        showCallUI("Calling...", true);
    };

    function listenForCalls() {
        onSnapshot(query(collection(db, "calls"), where("receiver", "==", currentUser.uid)), (snap) => {
            snap.docChanges().forEach(change => {
                if(change.type === "added" && change.doc.data().status === 'ringing') {
                    callRef = change.doc.id; showCallUI("Incoming Call...", false);
                }
            });
        });
    }

    async function showCallUI(text, isCaller) {
        document.getElementById('call-screen').style.display = 'flex';
        document.getElementById('call-status-text').innerText = text;
        document.getElementById('ringtone').play();
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('local-video').srcObject = localStream;
        } catch(e) {}
        
        if(!isCaller) {
            setTimeout(async () => { // Mock auto-accept for demo
                document.getElementById('call-status-text').innerText = "Connected 00:01";
                document.getElementById('ringtone').pause();
                await updateDoc(doc(db, "calls", callRef), { status: 'connected' });
            }, 3000);
        }
    }

    window.toggleMute = () => { const t = localStream?.getAudioTracks()[0]; if(t) { t.enabled = !t.enabled; document.getElementById('btn-mute').classList.toggle('active'); }};
    window.toggleVid = () => { const t = localStream?.getVideoTracks()[0]; if(t) { t.enabled = !t.enabled; document.getElementById('btn-vid').classList.toggle('active'); }};
    window.endCall = () => { document.getElementById('call-screen').style.display = 'none'; document.getElementById('ringtone').pause(); localStream?.getTracks().forEach(t=>t.stop()); };

    // --- GAMES : SNAKE ---
    let gameInt; let sSnake = [], sFood = {}, sDir = {x:1, y:0};
    window.openGame = (t) => { document.getElementById('game-screen').style.display='flex'; document.getElementById('snake-ui').style.display = t==='snake'?'flex':'none'; if(t==='snake') initSnake(); };
    window.closeGame = () => { document.getElementById('game-screen').style.display='none'; clearInterval(gameInt); if(multiGameRef) { updateDoc(doc(db, "games", multiGameRef), { status: 'ended' }); multiGameRef=null; }};
    
    window.initSnake = () => {
        const ctx = document.getElementById('snakeCanvas').getContext('2d');
        sSnake = [{x:15, y:15}]; sFood = {x:5, y:5}; sDir = {x:1, y:0}; let score = 0; clearInterval(gameInt);
        gameInt = setInterval(() => {
            ctx.fillStyle = '#111'; ctx.fillRect(0,0,300,300);
            ctx.fillStyle = '#00a884'; sSnake.forEach(p => ctx.fillRect(p.x*10, p.y*10, 9, 9));
            ctx.fillStyle = '#ef4444'; ctx.fillRect(sFood.x*10, sFood.y*10, 9, 9);
            
            let head = {x: sSnake[0].x+sDir.x, y: sSnake[0].y+sDir.y};
            
            // Game Over Check (Wall Collision)
            if(head.x < 0 || head.x > 29 || head.y < 0 || head.y > 29) {
                clearInterval(gameInt); alert(`Game Over! Score: ${score}`); return;
            }

            sSnake.unshift(head);
            if(head.x === sFood.x && head.y === sFood.y) { score+=10; document.getElementById('score-display').innerText = score; sFood = {x:Math.floor(Math.random()*29), y:Math.floor(Math.random()*29)}; } else sSnake.pop();
        }, 100); // Speed increased
    };
    window.changeDir = (x, y) => { if (sDir.x !== -x && sDir.y !== -y) sDir = {x, y}; };

    // --- GAMES : MULTIPLAYER TIC-TAC-TOE ---
    let board = ['', '', '', '', '', '', '', '', ''], aiDiff = 'Easy', isMultiplayer = false, mySymbol = 'X', multiGameRef = null;
    
    window.setupAI = (level) => { aiDiff = level; isMultiplayer = false; document.getElementById('ttt-modal').style.display='none'; document.getElementById('game-screen').style.display='flex'; document.getElementById('ttt-ui').style.display='flex'; initTTT_AI(); };
    
    window.showFriendsList = async () => {
        document.getElementById('ttt-modal').style.display='none'; document.getElementById('friends-modal').style.display='flex';
        const snap = await getDocs(query(collection(db, "chats"), where("users", "array-contains", currentUser.uid)));
        let html = '';
        for (const d of snap.docs) {
            const pId = d.data().users.find(id => id !== currentUser.uid); const pSnap = await getDoc(doc(db, "users", pId));
            if(pSnap.exists()) html += `<div class="list-item" onclick="inviteFriend('${d.id}', '${pId}')"><div class="item-info"><div class="item-title">${pSnap.data().username}</div></div></div>`;
        }
        document.getElementById('friends-to-invite').innerHTML = html || "<p>No friends to invite.</p>";
    };

    window.inviteFriend = async (chatId, pId) => {
        document.getElementById('friends-modal').style.display='none'; document.getElementById('game-screen').style.display='flex';
        document.getElementById('waiting-screen').style.display='block'; document.getElementById('ttt-ui').style.display='none';
        
        const gameDoc = await addDoc(collection(db, "games"), { p1: currentUser.uid, p2: pId, board: ['', '', '', '', '', '', '', '', ''], turn: currentUser.uid, status: 'waiting' });
        multiGameRef = gameDoc.id; mySymbol = 'X'; isMultiplayer = true;
        await addDoc(collection(db, `chats/${chatId}/messages`), { sender: currentUser.uid, type: 'game_req', gameId: multiGameRef, timestamp: Date.now() });
    };

    window.cancelGameReq = async () => { if(multiGameRef) await updateDoc(doc(db, "games", multiGameRef), { status: 'ended' }); document.getElementById('game-screen').style.display='none'; };

    window.acceptGame = async (gId) => {
        multiGameRef = gId; mySymbol = 'O'; isMultiplayer = true;
        await updateDoc(doc(db, "games", gId), { status: 'playing' });
        document.getElementById('game-screen').style.display='flex'; document.getElementById('ttt-ui').style.display='flex'; document.getElementById('waiting-screen').style.display='none';
    };

    function listenForGames() {
        setInterval(async () => {
            if(!isMultiplayer || !multiGameRef) return;
            const snap = await getDoc(doc(db, "games", multiGameRef));
            if(snap.exists()) {
                const gData = snap.data();
                if(gData.status === 'playing') {
                    document.getElementById('waiting-screen').style.display='none'; document.getElementById('ttt-ui').style.display='flex';
                    board = gData.board; renderTTT();
                    document.getElementById('ttt-status').innerText = gData.turn === currentUser.uid ? `Your Turn (${mySymbol})` : "Opponent's Turn";
                    let w = checkWinner(board); if(w) endGame(w === mySymbol ? "You Win!" : "You Lose!");
                }
                if(gData.status === 'ended') { alert("Game ended by opponent."); closeGame(); }
            }
        }, 1000);
    }

    window.initTTT_AI = () => { board = ['', '', '', '', '', '', '', '', '']; mySymbol = 'X'; document.getElementById('ttt-status').innerText = "Your Turn (X)"; renderTTT(); };
    
    function renderTTT() {
        const c = document.getElementById('ttt-board'); c.innerHTML = '';
        board.forEach((val, i) => { const d = document.createElement('div'); d.className = `ttt-cell ${val.toLowerCase()}`; d.innerText = val; d.onclick = () => playTTT(i); c.appendChild(d); });
    }

    async function playTTT(idx) {
        if(board[idx] || checkWinner(board)) return;
        
        if(isMultiplayer) {
            const snap = await getDoc(doc(db, "games", multiGameRef)); if(snap.data().turn !== currentUser.uid) return;
            board[idx] = mySymbol; renderTTT();
            await updateDoc(doc(db, "games", multiGameRef), { board: board, turn: snap.data().p2 === currentUser.uid ? snap.data().p1 : snap.data().p2 });
        } else {
            board[idx] = 'X'; renderTTT();
            if(checkWinner(board)) return endGame("You Win!"); if(!board.includes('')) return endGame("Draw!");
            document.getElementById('ttt-status').innerText = "Bot is thinking..."; setTimeout(botMove, 500);
        }
    }

    function botMove() {
        let e = board.map((v, i) => v === '' ? i : null).filter(v => v !== null); if(e.length === 0) return;
        let m = e[Math.floor(Math.random() * e.length)]; // Easy
        if(aiDiff === 'Hard') {
            // Block logic for Medium/Hard
            const winLines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for(let l of winLines) {
                let [a,b,c] = l;
                if(board[a]==='X' && board[b]==='X' && board[c]==='') m=c;
                if(board[a]==='X' && board[c]==='X' && board[b]==='') m=b;
                if(board[b]==='X' && board[c]==='X' && board[a]==='') m=a;
            }
        }
        board[m] = 'O'; renderTTT();
        if(checkWinner(board)) return endGame("Bot Wins!"); document.getElementById('ttt-status').innerText = "Your Turn (X)";
    }

    function checkWinner(b) { const l = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]; const w = l.find(x => b[x[0]] && b[x[0]] === b[x[1]] && b[x[1]] === b[x[2]]); return w ? b[w[0]] : null; }
    function endGame(msg) { document.getElementById('ttt-status').innerText = msg; document.getElementById('btn-rematch').style.display='block'; }
    window.reqRematch = () => { document.getElementById('btn-rematch').style.display='none'; if(isMultiplayer){ updateDoc(doc(db, "games", multiGameRef), { board: ['', '', '', '', '', '', '', '', ''] }); } else { initTTT_AI(); } };

</script>
</body>
</html>
