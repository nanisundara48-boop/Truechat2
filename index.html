<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Chat - Ultimate Master Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/ml5@latest/dist/ml5.min.js"></script>
    
    <style>
        :root {
            --bg-color: #0f172a; --panel-bg: #1e293b; --primary: #00e5ff;
            --text-main: #ffffff; --text-muted: #94a3b8; --danger: #ff4b2b;
            --chat-bubble: #334155; --chat-mine: #0284c7; --footer-bg: #0f172a;
        }

        body.private-mode {
            --bg-color: #1a050d; --panel-bg: #2d0a1a; --primary: #ff1493;
            --chat-bubble: #4d0f28; --chat-mine: #b30059; --footer-bg: #1a050d;
        }

        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg-color); color: var(--text-main); height: 100vh; overflow: hidden; transition: 0.5s; }
        .app-container { width: 100%; max-width: 500px; height: 100%; margin: auto; background: var(--panel-bg); position: relative; display: flex; flex-direction: column; }

        /* General UI */
        .icon-btn { cursor: pointer; color: white; transition: 0.3s; }
        .icon-btn:hover { color: var(--primary); }
        .dp-circle { width:40px; height:40px; border-radius:50%; background:#444; overflow:hidden; display:flex; align-items:center; justify-content:center; cursor:pointer; border: 2px solid var(--primary); }
        .dp-circle img { width:100%; height:100%; object-fit:cover; }
        
        .header { padding: 15px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .signal-indicator { font-size: 0.8rem; display: flex; align-items: center; gap: 5px; color: #00ff00; }

        /* Footer Navigation */
        .footer-nav {
            position: absolute; bottom: 0; width: 100%; height: 65px;
            background: var(--footer-bg); display: flex; justify-content: space-around;
            align-items: center; border-top: 1px solid rgba(255,255,255,0.1); z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); cursor: pointer; font-size: 0.8rem; transition: 0.3s; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 1.4rem; margin-bottom: 3px; }

        .list-container { flex: 1; overflow-y: auto; padding-bottom: 70px; }
        .list-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .list-item:hover { background: rgba(255,255,255,0.05); }

        /* Chat UI & Masking */
        .chat-screen { position: absolute; top:0; left:0; width:100%; height:100%; background:var(--panel-bg); display:none; flex-direction:column; z-index:150; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg-bubble { max-width: 75%; padding: 10px 15px; border-radius: 15px; position: relative; word-wrap: break-word; }
        .msg-mine { align-self: flex-end; background: var(--chat-mine); border-bottom-right-radius: 2px; }
        .msg-theirs { align-self: flex-start; background: var(--chat-bubble); border-bottom-left-radius: 2px; }
        .msg-bubble img { max-width: 100%; border-radius: 8px; margin-top: 5px; }
        
        .blurred-msg { filter: blur(10px); transition: 0.3s; user-select: none; }
        .blurred-msg:hover { filter: blur(0); }

        /* Inputs */
        .chat-input-area { padding: 10px; display: flex; gap: 10px; align-items: center; background: rgba(0,0,0,0.3); }
        .chat-input { flex: 1; padding: 12px; border-radius: 20px; border: none; background: #334155; color: white; outline: none; }
        .recording-pulse { color: red !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

        /* Ghost & Animations */
        #ghost-entry { position: absolute; top:0; left:0; width:100%; height:100%; background:#000; display:none; flex-direction:column; justify-content:center; align-items:center; z-index:2000; }
        .pass-dot { width: 45px; height: 50px; border: 2px solid var(--primary); border-radius: 8px; background: transparent; color: white; text-align: center; font-size: 1.5rem; outline: none; margin: 0 5px; }
        .heart { position: absolute; animation: heartMove 6s linear infinite; opacity: 0.6; pointer-events: none; }
        @keyframes heartMove { 0% { transform: translateY(100vh) scale(0.5); } 100% { transform: translateY(-10vh) scale(1.5); } }

        /* Games & AI */
        #game-screen { position: absolute; top:0; left:0; width:100%; height:100%; background:#000; display:none; flex-direction:column; align-items:center; justify-content:center; z-index:3000; }
        #ai-status { font-size: 0.7rem; color: #00ff00; position: absolute; top: 10px; right: 10px; display: none; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 5px; z-index: 100; }

    </style>
</head>
<body>

    <div class="app-container" id="main-app">
        
        <input type="file" id="dp-upload" accept="image/*" style="display:none;" onchange="updateDP(event)">
        <input type="file" id="media-upload" accept="image/*,video/*" style="display:none;" onchange="sendMedia(event)">

        <video id="ai-video" style="display:none;" width="320" height="240" autoplay></video>
        <div id="ai-status"><i class="fa-solid fa-user-shield"></i> AI Sentry Active</div>

        <div id="auth-screen" style="padding:40px; text-align:center; height:100%; display:flex; flex-direction:column; justify-content:center;">
            <h1 style="color:var(--primary);"><i class="fa-solid fa-ghost"></i> Ghost Chat</h1>
            <input type="email" id="email" placeholder="Email" class="chat-input" style="width:100%; margin-bottom:15px; box-sizing:border-box;">
            <input type="password" id="pass" placeholder="Password" class="chat-input" style="width:100%; margin-bottom:15px; box-sizing:border-box;">
            <input type="text" id="username" placeholder="Username (Signup Only)" class="chat-input" style="width:100%; margin-bottom:15px; box-sizing:border-box; display:none;">
            <button onclick="handleAuth('login')" id="login-btn" style="width:100%; padding:15px; background:var(--primary); border:none; border-radius:12px; font-weight:bold; cursor:pointer;">Login</button>
            <button onclick="handleAuth('signup')" id="signup-btn" style="width:100%; padding:15px; background:var(--primary); border:none; border-radius:12px; font-weight:bold; cursor:pointer; display:none;">Sign Up</button>
            <p onclick="toggleAuthMode()" style="color:var(--primary); cursor:pointer; margin-top:20px;" id="auth-toggle-txt">New? Register Here</p>
        </div>

        <div id="dashboard" style="display:none; flex-direction:column; height:100%;">
            <div class="header">
                <div style="display:flex; align-items:center; gap:12px;">
                    <div class="dp-circle" onclick="document.getElementById('dp-upload').click()">
                        <img id="my-dp" src="https://via.placeholder.com/40" alt="DP">
                    </div>
                    <div>
                        <div id="display-name" style="font-weight:bold;" onmousedown="startGhostTimer()" onmouseup="clearGhostTimer()" ontouchstart="startGhostTimer()" ontouchend="clearGhostTimer()">User</div>
                        <div class="signal-indicator"><i class="fa-solid fa-signal" id="signal-icon"></i> <span id="signal-text">Good</span></div>
                    </div>
                </div>
                <div style="display:flex; gap:15px;">
                    <i class="fa-solid fa-camera icon-btn" id="ai-toggle" onclick="toggleAI()"></i>
                    <i class="fa-solid fa-user-plus icon-btn" onclick="addFriendPrompt()"></i>
                </div>
            </div>

            <div class="list-container" id="chats-list"><i>Loading chats...</i></div>
            <div class="list-container" id="calls-list" style="display:none;"><i>No call history.</i></div>
            <div class="list-container" id="games-list" style="display:none; text-align:center; padding:20px;">
                <h2 style="color:var(--primary);">Ghost Arcade</h2>
                <div style="background:rgba(0,0,0,0.3); padding:20px; border-radius:15px; margin-bottom:15px; border:1px solid var(--primary);">
                    <i class="fa-solid fa-snake" style="font-size:3rem; color:#00ff00; margin-bottom:10px;"></i>
                    <h3>Snake Game</h3>
                    <p style="font-size:0.8rem; color:var(--text-muted);">High Score: 24,500</p>
                    <button onclick="document.getElementById('game-screen').style.display='flex'; initSnake();" style="padding:10px 20px; background:var(--primary); border:none; border-radius:8px; cursor:pointer;">Play Now</button>
                </div>
            </div>

            <nav class="footer-nav">
                <div class="nav-item active" id="tab-chats" onclick="switchTab('chats')"><i class="fa-solid fa-message"></i>Chats</div>
                <div class="nav-item" id="tab-calls" onclick="switchTab('calls')"><i class="fa-solid fa-phone"></i>Calls</div>
                <div class="nav-item" id="tab-games" onclick="switchTab('games')"><i class="fa-solid fa-gamepad"></i>Games</div>
            </nav>
        </div>

        <div id="chat-screen" class="chat-screen">
            <div class="header">
                <div style="display:flex; align-items:center; gap:10px;">
                    <i class="fa-solid fa-arrow-left icon-btn" onclick="closeChat()"></i>
                    <div class="dp-circle" style="width:35px; height:35px;"><img id="partner-dp" src="https://via.placeholder.com/35"></div>
                    <span id="partner-name" style="font-weight:bold;">Partner</span>
                </div>
                <div style="display:flex; gap:15px;">
                    <i class="fa-solid fa-eye-slash icon-btn" id="mask-btn" onclick="toggleMask()"></i>
                    <i class="fa-solid fa-video icon-btn" onclick="alert('WebRTC Call Initiated (Mock)')"></i>
                </div>
            </div>
            
            <div class="chat-messages" id="chat-messages"></div>
            
            <div class="chat-input-area">
                <i class="fa-solid fa-plus icon-btn" onclick="document.getElementById('media-upload').click()"></i>
                <input type="text" id="msg-input" placeholder="Type a message..." class="chat-input">
                <i class="fa-solid fa-microphone icon-btn" id="mic-btn" onmousedown="startVoice()" onmouseup="stopVoice()" ontouchstart="startVoice()" ontouchend="stopVoice()"></i>
                <i class="fa-solid fa-paper-plane icon-btn" style="color:var(--primary);" onclick="sendTextMsg()"></i>
            </div>
        </div>

        <div id="ghost-entry">
            <i class="fa-solid fa-ghost" style="font-size:4rem; color:white; animation: pulse 2s infinite;"></i>
            <h3 style="color:white; margin-top:20px; letter-spacing:2px;">ENTER GHOST MODE</h3>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <input type="password" maxlength="1" class="pass-dot" id="p1" oninput="moveFocus(this, 'p2')">
                <input type="password" maxlength="1" class="pass-dot" id="p2" oninput="moveFocus(this, 'p3')">
                <input type="password" maxlength="1" class="pass-dot" id="p3" oninput="moveFocus(this, 'p4')">
                <input type="password" maxlength="1" class="pass-dot" id="p4" oninput="verifyGhostPass()">
            </div>
            <p id="ghost-hint" style="color:var(--text-muted); font-size:0.8rem; margin-top:15px; display:none;">Set your 4-digit PIN</p>
            <button onclick="document.getElementById('ghost-entry').style.display='none'" style="margin-top:30px; background:none; color:var(--danger); border:none;">Cancel</button>
        </div>

        <div id="game-screen">
            <h2 style="color:#00ff00; font-family:monospace;">SCORE: <span id="game-score">0</span></h2>
            <canvas id="snakeCanvas" width="300" height="300" style="border:2px solid #333; background:#111;"></canvas>
            <button onclick="stopPanicGame()" style="margin-top:20px; padding:10px 20px; background:var(--danger); border:none; border-radius:8px; color:white;">Exit Game</button>
        </div>

    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection, addDoc, query, orderBy, where } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDMSGPEngVmGtTRfcnIC4unH7Rh3FwgcRE",
        authDomain: "sv-billing-250c2.firebaseapp.com",
        projectId: "sv-billing-250c2",
        storageBucket: "sv-billing-250c2.firebasestorage.app",
        messagingSenderId: "847927101892",
        appId: "1:847927101892:web:800c182fe47f133d537c91"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null; let userData = null; let isPrivate = false;
    let currentChatId = null; let maskActive = false; let aiActive = false;
    let mediaRecorder; let audioChunks = [];

    // --- AUTHENTICATION ---
    let isLogin = true;
    window.toggleAuthMode = () => {
        isLogin = !isLogin;
        document.getElementById('username').style.display = isLogin ? 'none' : 'block';
        document.getElementById('login-btn').style.display = isLogin ? 'block' : 'none';
        document.getElementById('signup-btn').style.display = isLogin ? 'none' : 'block';
        document.getElementById('auth-toggle-txt').innerText = isLogin ? "New? Register Here" : "Have an account? Login";
    };

    window.handleAuth = async (mode) => {
        const e = document.getElementById('email').value;
        const p = document.getElementById('pass').value;
        try {
            if(mode === 'login') await signInWithEmailAndPassword(auth, e, p);
            else {
                const u = document.getElementById('username').value;
                if(!u) return alert("Username required");
                const cred = await createUserWithEmailAndPassword(auth, e, p);
                await setDoc(doc(db, "users", cred.user.uid), { email: e, username: u, dp: "", privatePin: null });
            }
        } catch(err) { alert(err.message); }
    };

    onAuthStateChanged(auth, async (user) => {
        if(user) {
            currentUser = user;
            const snap = await getDoc(doc(db, "users", user.uid));
            userData = snap.data();
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'flex';
            document.getElementById('display-name').innerText = userData.username;
            if(userData.dp) document.getElementById('my-dp').src = userData.dp;
            loadChats();
        }
    });

    // --- SIGNAL STRENGTH INDICATOR ---
    function checkSignal() {
        const icon = document.getElementById('signal-icon');
        const txt = document.getElementById('signal-text');
        const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if(conn) {
            if(conn.downlink >= 5) { icon.style.color = '#00ff00'; txt.innerText = 'Good'; }
            else if(conn.downlink >= 2) { icon.style.color = 'yellow'; txt.innerText = 'Avg'; }
            else { icon.style.color = 'red'; txt.innerText = 'Poor'; }
        }
    }
    setInterval(checkSignal, 5000); checkSignal();

    // --- PROFILE PICTURE UPLOAD (Auto-Compress) ---
    window.updateDP = async (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const compressedBase64 = await compressImage(file, 200); // 200px max for DP
        await updateDoc(doc(db, "users", currentUser.uid), { dp: compressedBase64 });
        document.getElementById('my-dp').src = compressedBase64;
        userData.dp = compressedBase64;
    };

    // --- MEDIA COMPRESSION ENGINE (Canvas API) ---
    function compressImage(file, maxWidth = 800) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const scaleSize = maxWidth / img.width;
                    canvas.width = maxWidth; canvas.height = img.height * scaleSize;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', 0.6)); // 60% quality reduction
                }
            }
        });
    }

    // --- NAVIGATION ---
    window.switchTab = (tab) => {
        document.querySelectorAll('.list-container').forEach(el => el.style.display = 'none');
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.getElementById(`${tab}-list`).style.display = 'block';
        document.getElementById(`tab-${tab}`).classList.add('active');
    };

    // --- GHOST MODE PASSCODE LOGIC ---
    let ghostTimer;
    window.startGhostTimer = () => { ghostTimer = setTimeout(triggerGhostEntry, 1500); };
    window.clearGhostTimer = () => clearTimeout(ghostTimer);

    function triggerGhostEntry() {
        if(isPrivate) { togglePrivateEnv(); return; } // Switch back to normal
        document.getElementById('ghost-entry').style.display = 'flex';
        document.querySelectorAll('.pass-dot').forEach(i => i.value = '');
        document.getElementById('p1').focus();
        document.getElementById('ghost-hint').style.display = userData.privatePin ? 'none' : 'block';
    }

    window.moveFocus = (curr, nextId) => { if(curr.value.length === 1) document.getElementById(nextId).focus(); };
    window.verifyGhostPass = async () => {
        const pin = document.getElementById('p1').value + document.getElementById('p2').value + document.getElementById('p3').value + document.getElementById('p4').value;
        if(pin.length === 4) {
            if(!userData.privatePin) {
                await updateDoc(doc(db, "users", currentUser.uid), { privatePin: pin });
                userData.privatePin = pin;
                togglePrivateEnv();
            } else if (pin === userData.privatePin) {
                togglePrivateEnv();
            } else {
                alert("Incorrect PIN");
                document.querySelectorAll('.pass-dot').forEach(i => i.value = '');
                document.getElementById('p1').focus();
            }
        }
    };

    function togglePrivateEnv() {
        isPrivate = !isPrivate;
        document.body.classList.toggle('private-mode', isPrivate);
        document.getElementById('ghost-entry').style.display = 'none';
        if(isPrivate) createHearts(); else document.querySelectorAll('.heart').forEach(h => h.remove());
        loadChats(); // Reload chats based on mode
    }

    function createHearts() {
        setInterval(() => {
            if(!isPrivate) return;
            const h = document.createElement('i');
            h.className = 'fa-solid fa-heart heart';
            h.style.left = Math.random() * 100 + 'vw';
            h.style.color = ['#ff1493', '#c70055', '#ff69b4'][Math.floor(Math.random()*3)];
            h.style.fontSize = (Math.random() * 20 + 10) + 'px';
            h.style.animationDuration = (Math.random() * 4 + 3) + 's';
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 6000);
        }, 500);
    }

    // --- ADD FRIEND & LOAD CHATS ---
    window.addFriendPrompt = async () => {
        const uname = prompt("Enter exactly username to chat:");
        if(!uname) return;
        const q = query(collection(db, "users"), where("username", "==", uname));
        const snap = await getDocs(q); // Assume imported
        if(snap.empty) return alert("User not found");
        const targetId = snap.docs[0].id;
        const combinedId = currentUser.uid > targetId ? currentUser.uid + targetId : targetId + currentUser.uid;
        await setDoc(doc(db, "chats", combinedId), { users: [currentUser.uid, targetId], isPrivate: isPrivate });
        alert("Friend Added!");
    };

    function loadChats() {
        const q = query(collection(db, "chats"), where("users", "array-contains", currentUser.uid));
        onSnapshot(q, (snap) => {
            let html = '';
            snap.forEach(async d => {
                const data = d.data();
                if(data.isPrivate !== isPrivate) return;
                const partnerId = data.users.find(id => id !== currentUser.uid);
                const pSnap = await getDoc(doc(db, "users", partnerId));
                if(pSnap.exists()) {
                    const pData = pSnap.data();
                    const dpSrc = pData.dp || "https://via.placeholder.com/40";
                    html += `
                    <div class="list-item" onclick="openChat('${d.id}', '${pData.username}', '${dpSrc}')">
                        <div class="dp-circle"><img src="${dpSrc}"></div>
                        <div style="flex:1; padding-left:15px; font-weight:bold;">${pData.username}</div>
                    </div>`;
                }
            });
            document.getElementById('chats-list').innerHTML = html || "<i>No chats found.</i>";
        });
    }

    // --- MESSAGING SYSTEM (Text, Image, Audio) ---
    window.openChat = (chatId, pName, pDp) => {
        currentChatId = chatId;
        document.getElementById('partner-name').innerText = pName;
        document.getElementById('partner-dp').src = pDp;
        document.getElementById('chat-screen').style.display = 'flex';
        
        const q = query(collection(db, `chats/${chatId}/messages`), orderBy("timestamp"));
        onSnapshot(q, (snap) => {
            let html = '';
            snap.forEach(m => {
                const msg = m.data();
                const isMe = msg.sender === currentUser.uid;
                const blurCls = maskActive ? 'blurred-msg' : '';
                let content = msg.text;
                if(msg.type === 'image') content = `<img src="${msg.text}">`;
                if(msg.type === 'audio') content = `<audio controls src="${msg.text}" style="height:35px; width:200px;"></audio>`;
                
                html += `<div class="msg-bubble ${isMe ? 'msg-mine' : 'msg-theirs'} ${blurCls}">${content}</div>`;
            });
            const box = document.getElementById('chat-messages');
            box.innerHTML = html;
            box.scrollTop = box.scrollHeight;
        });
    };

    window.closeChat = () => { document.getElementById('chat-screen').style.display = 'none'; currentChatId = null; };

    window.sendTextMsg = async () => {
        const inp = document.getElementById('msg-input');
        const text = inp.value.trim();
        if(!text) return;
        inp.value = '';
        await addDoc(collection(db, `chats/${currentChatId}/messages`), { sender: currentUser.uid, text: text, type: 'text', timestamp: Date.now() });
    };

    window.sendMedia = async (e) => {
        const file = e.target.files[0];
        if(!file) return;
        if(file.type.startsWith('video')) return alert("Videos currently restricted due to DB limits. Send images.");
        const base64Img = await compressImage(file, 600); // compress for chat
        await addDoc(collection(db, `chats/${currentChatId}/messages`), { sender: currentUser.uid, text: base64Img, type: 'image', timestamp: Date.now() });
    };

    // --- VOICE MESSAGING ---
    window.startVoice = async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            document.getElementById('mic-btn').classList.add('recording-pulse');
            mediaRecorder.start();
            audioChunks = [];
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        } catch(e) { alert("Mic access denied"); }
    };
    window.stopVoice = () => {
        if(!mediaRecorder || mediaRecorder.state === "inactive") return;
        document.getElementById('mic-btn').classList.remove('recording-pulse');
        mediaRecorder.stop();
        mediaRecorder.onstop = () => {
            const blob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = async () => {
                await addDoc(collection(db, `chats/${currentChatId}/messages`), { sender: currentUser.uid, text: reader.result, type: 'audio', timestamp: Date.now() });
            };
        };
    };

    // --- PRIVACY MASKING ---
    window.toggleMask = () => {
        maskActive = !maskActive;
        const btn = document.getElementById('mask-btn');
        btn.className = maskActive ? 'fa-solid fa-eye icon-btn' : 'fa-solid fa-eye-slash icon-btn';
        btn.style.color = maskActive ? 'var(--primary)' : 'white';
        if(currentChatId) openChat(currentChatId, document.getElementById('partner-name').innerText, document.getElementById('partner-dp').src); // re-render
    };

    // --- AI SNOOP DETECTION ---
    window.toggleAI = async () => {
        aiActive = !aiActive;
        document.getElementById('ai-toggle').style.color = aiActive ? '#00ff00' : 'white';
        document.getElementById('ai-status').style.display = aiActive ? 'block' : 'none';
        if(aiActive) runAI(); else document.getElementById('ai-video').srcObject?.getTracks().forEach(t => t.stop());
    };

    async function runAI() {
        const video = document.getElementById('ai-video');
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        const faceapi = ml5.faceApi(video, { withLandmarks: false, withDescriptors: false }, () => {
            setInterval(() => {
                if(!aiActive) return;
                faceapi.detect((err, res) => {
                    if(res && res.length > 1) { // Multiple faces detected
                        document.getElementById('game-screen').style.display = 'flex';
                        initSnake();
                    }
                });
            }, 1000);
        });
    }

    // --- SNAKE GAME (Panic Redirect) ---
    let gameInt;
    window.initSnake = () => {
        const can = document.getElementById('snakeCanvas'); const ctx = can.getContext('2d');
        let snake = [{x:15, y:15}]; let food = {x:5, y:5}; let d={x:1,y:0}; let score = 0;
        clearInterval(gameInt);
        gameInt = setInterval(() => {
            ctx.fillStyle = '#111'; ctx.fillRect(0,0,300,300);
            ctx.fillStyle = '#00ff00'; snake.forEach(p => ctx.fillRect(p.x*10, p.y*10, 9, 9));
            ctx.fillStyle = 'red'; ctx.fillRect(food.x*10, food.y*10, 9, 9);
            
            let head = {x: snake[0].x+d.x, y: snake[0].y+d.y};
            snake.unshift(head);
            if(head.x === food.x && head.y === food.y) { score+=10; document.getElementById('game-score').innerText = score; food = {x:Math.floor(Math.random()*29), y:Math.floor(Math.random()*29)}; } 
            else snake.pop();
        }, 100);
    };
    window.stopPanicGame = () => { document.getElementById('game-screen').style.display = 'none'; clearInterval(gameInt); };

</script>
</body>
</html>
