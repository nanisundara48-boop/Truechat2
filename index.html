    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap');
        
        body { 
            font-family: 'Outfit', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            overflow: hidden; 
            background: #f0f2f5;
        }

        /* --- GLASSMORPHISM UI --- */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .glass-dark {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }

        /* --- THEMES --- */
        /* Normal Mode */
        body.theme-light {
            background: radial-gradient(circle at top right, #bfdbfe, #f3f4f6);
            --text-main: #1f2937;
            --accent: #2563eb;
            --bubble-sent: #2563eb;
            --bubble-recv: #ffffff;
        }

        /* Love/Private Mode */
        body.theme-love {
            background: radial-gradient(circle, #4a0418, #000000);
            color: #ffe4e6;
            --text-main: #ffe4e6;
            --accent: #ff0055;
            --bubble-sent: #ff0055;
            --bubble-recv: rgba(255, 255, 255, 0.15);
        }

        /* --- ANIMATIONS --- */
        .heart-container {
            position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
            display: none;
        }
        body.theme-love .heart-container { display: block; }

        .heart {
            position: absolute;
            color: #ff0055;
            opacity: 0;
            animation: floatUp 6s linear infinite;
            bottom: -50px; /* Start below screen */
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(-110vh) scale(1.5); opacity: 0; }
        }

        /* --- UTILS --- */
        .hidden { display: none !important; }
        .center-flex { display: flex; justify-content: center; align-items: center; }
        
        /* Floating Call Window */
        .mini-call {
            position: fixed; bottom: 100px; right: 20px;
            width: 120px; height: 160px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 100;
            transition: all 0.3s ease;
            overflow: hidden;
            border: 2px solid var(--accent);
        }

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, query, where, onSnapshot, serverTimestamp, orderBy, addDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        import { getDatabase, ref, onDisconnect, set, onValue, serverTimestamp as rtdbTimestamp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
        
        

        const firebaseConfig = {
            apiKey: "AIzaSyCAsCm1YcsAjHwyvIzxyMrBmZPLw2hlo18",
            authDomain: "truechats-8dac9.firebaseapp.com",
            projectId: "truechats-8dac9",
            storageBucket: "truechats-8dac9.firebasestorage.app",
            messagingSenderId: "685374771914",
            appId: "1:685374771914:web:81bf491264c1bb09061a33"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const rtdb = getDatabase(app);  

        let currentUser = null;
        let currentChatId = null;
        let isLoveMode = false;
        let passAction = "enter";
        let peer = null;
        let currentCall = null;      
        let currentConn = null;
        let localStream = null;
        let callTimerInt = null;
        let callTimeout = null;
        let isVideoCall = false;     
        let isFrontCam = true;
                // --- PRESENCE SYSTEM (Online/Offline Fix) ---
        function setupPresence(uid) {
    const rtdbRef = ref(rtdb, 'status/' + uid);
    const connectedRef = ref(rtdb, '.info/connected');

    onValue(connectedRef, (snap) => {
        if (snap.val() === true) {
            onDisconnect(rtdbRef).set({
                state: 'offline',
                last_changed: rtdbTimestamp() 
            }).then(() => {
                set(rtdbRef, {
                    state: 'online',
                    last_changed: rtdbTimestamp()
                });
                updateDoc(doc(db, "users", uid), { isOnline: true });
            });
        }
    });
        }
        
                        // --- AUTH (LOGIN FIX) ---
        window.handleAuth = async (type) => {
            const e = document.getElementById('emailIn').value;
            const p = document.getElementById('passIn').value;
            const msg = document.getElementById('authMsg');
            
            if(!e || !p) { msg.innerText = "Please enter Email & Password"; return; }

            try {
                if(type === 'login') {
                    await signInWithEmailAndPassword(auth, e, p);
                } else {
                    const res = await createUserWithEmailAndPassword(auth, e, p);
                    // Default lowercase username add chesthunnam search kosam
                    await setDoc(doc(db, "users", res.user.uid), {
                        uid: res.user.uid, 
                        username: e.split('@')[0], 
                        username_lower: e.split('@')[0].toLowerCase(),
                        email: e, 
                        photoURL: `https://ui-avatars.com/api/?name=${e}&background=random`, 
                        privatePassword: null,
                        isOnline: true
                    });
                }
            } catch(err) { 
                console.error(err);
                msg.innerText = err.message; 
            }
        };

        onAuthStateChanged(auth, u => {
            if(u) {
                currentUser = u;
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                
                setupPresence(u.uid); 
                loadData();
                loadChats();
                initPeer();
             } else {
                if(currentUser) {
                    updateDoc(doc(db, "users", currentUser.uid), { isOnline: false });
                }
                document.getElementById('authScreen').classList.remove('hidden');
                document.getElementById('mainApp').classList.add('hidden');
            }
        });
        
        window.doLogout = () => signOut(auth);
        
        onAuthStateChanged(auth, u => {
            if(u) {
                currentUser = u;
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                loadData();
                loadChats();
                initPeer();
             } else {
                document.getElementById('authScreen').classList.remove('hidden');
                document.getElementById('mainApp').classList.add('hidden');
            }
        });

        async function loadData() {
            const userRef = doc(db, "users", currentUser.uid);
            const dSnap = await getDoc(userRef);
            
            if(dSnap.exists()) {
                const d = dSnap.data();
                
                // AUTO FIX: Search kosam username_lower lekapothe add chesthundi
                if(!d.username_lower) {
                    await updateDoc(userRef, { 
                        username_lower: d.username.toLowerCase() 
                    });
                }

                document.getElementById('myHeaderDp').src = d.photoURL;
                document.getElementById('profileDp').src = d.photoURL;
                document.getElementById('profileName').innerText = d.username;
                document.getElementById('profileEmail').innerText = d.email;
                document.getElementById('myQrCode').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${currentUser.uid}`;
            }
        }
        

        // --- LOAD CHATS FIXED (Duplicates & Syntax Fix) ---
                // --- LOAD CHATS (Strict Switch Logic) ---
        window.loadChats = function() {
            const list = document.getElementById('chatList');
            if(!list) return;
            
            const q = query(collection(db, "chats"), where("participants", "array-contains", currentUser.uid));
            
            onSnapshot(q, (snapshot) => {
                list.innerHTML = ""; 
                
                if (snapshot.empty) {
                    list.innerHTML = '<div class="text-center mt-10 opacity-60">No chats yet.</div>';
                    return;
                }

                snapshot.forEach(async (d) => {
                    const chat = d.data();
                    
                    // 🔥 STRICT SWITCH LOGIC (Idhe Main Change) 🔥
                    if (isLoveMode) {
                        // Love Mode ON: Public Chats ni HIDE chey (Only Hidden chats chupinchu)
                        if (chat.isHidden !== true) return; 
                    } else {
                        // Love Mode OFF: Hidden Chats ni HIDE chey (Only Public chats chupinchu)
                        if (chat.isHidden === true) return;
                    }
                    
                    const otherUid = chat.participants.find(id => id !== currentUser.uid);

document.getElementById('msgInput').addEventListener('input', () => {

        // --- OPEN CHAT (With Ticks & Delete) ---
        window.openChat = async (cid, u) => {
            currentChatId = cid;
            const room = document.getElementById('chatRoom');
            room.classList.remove('hidden');
            if(isLoveMode) room.style.background = "radial-gradient(circle, #2a0a12, #000000)";
            else room.style.background = "#ffffff";

            document.getElementById('chatUserName').innerText = u.username;
            document.getElementById('chatUserDp').src = u.photoURL;

            updateDoc(doc(db, "chats", cid), { isSeen: true });

            onSnapshot(query(collection(db, "chats", cid, "messages"), orderBy("timestamp", "asc")), snap => {
                const box = document.getElementById('messagesContainer');
                box.innerHTML = "";
                snap.forEach(d => {
                    const m = d.data();
                    if(m.deletedFor && m.deletedFor.includes(currentUser.uid)) return;

                    const isMe = m.sender === currentUser.uid;
                    let tickIcon = '';
                    if(isMe) tickIcon = `<i class="fa-solid fa-check-double text-[10px] ml-1 text-blue-500"></i>`;

                    const bubble = document.createElement('div');
                    bubble.className = `flex ${isMe ? 'justify-end' : 'justify-start'} mb-1`;
                    bubble.innerHTML = `
                        <div oncontextmenu="deleteMsgOption('${cid}', '${d.id}'); return false;" 
                             class="p-2 px-4 rounded-2xl max-w-[75%] text-sm shadow-sm backdrop-blur-sm relative cursor-pointer hover:opacity-90" 
                             style="background-color: ${isMe ? 'var(--bubble-sent)' : (isLoveMode ? 'rgba(255,255,255,0.1)' : '#f3f4f6')}; 
                                    color: ${isMe ? 'white' : (isLoveMode ? 'white' : 'black')};
                                    border-radius: ${isMe ? '20px 20px 0 20px' : '20px 20px 20px 0'};">
                            ${m.text}
                            <span class="float-right mt-1 ml-2 flex items-center opacity-70">
                                <span class="text-[9px] mr-1">${m.timestamp ? new Date(m.timestamp.seconds * 1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '...'}</span>
                                ${tickIcon}
                            </span>
                        </div>`;
                    box.appendChild(bubble);
                });
                box.scrollTop = box.scrollHeight;
            });
        };

        window.sendMessage = async () => {
            const inp = document.getElementById('msgInput');
            if(!inp.value.trim()) return;
            await addDoc(collection(db, "chats", currentChatId, "messages"), {
                text: inp.value, sender: currentUser.uid, timestamp: serverTimestamp(),
                status: 'sent', deletedFor: []
            });
            await updateDoc(doc(db, "chats", currentChatId), { 
                lastMessage: inp.value, timestamp: serverTimestamp(),
                lastSender: currentUser.uid, isSeen: false
            });
            inp.value = "";
        };

        window.deleteMsgOption = async (chatId, msgId) => {
            if(confirm("Delete this message for me?")) {
                try {
                    const msgRef = doc(db, "chats", chatId, "messages", msgId);
                    const msgSnap = await getDoc(msgRef);
                    if (msgSnap.exists()) {
                        const currentDeleted = msgSnap.data().deletedFor || [];
                        await updateDoc(msgRef, { deletedFor: [...currentDeleted, currentUser.uid] });
                    }
                } catch(e) { console.error(e); }
            }
        };

        window.closeChat = () => document.getElementById('chatRoom').classList.add('hidden');
        
        // --- PEER & CALL SYSTEM ---
        function initPeer() {
            if(peer) return;
            peer = new Peer(currentUser.uid, { debug: 1 });
            
            peer.on('connection', (conn) => {
                conn.on('data', (data) => {
                    if(data === 'END_CALL') { endGlobalCall(false); alert("Call Ended"); }
                });
                conn.on('open', () => { currentConn = conn; });
            });

            peer.on('call', (call) => {
                const meta = call.metadata || {name: "Friend", photo: ""};
                isVideoCall = meta.type === 'video';
                document.getElementById('incomingPopup').classList.remove('hidden');
                document.getElementById('incName').innerText = meta.name;
                document.getElementById('incImg').src = meta.photo;
                document.getElementById('incType').innerText = isVideoCall ? "VIDEO CALL..." : "VOICE CALL...";
                document.getElementById('ringtonePlayer').play();

                window.acceptCall = async () => {
                    document.getElementById('incomingPopup').classList.add('hidden');
                    document.getElementById('ringtonePlayer').pause();
                    setupCallUI(isVideoCall, meta);
                    try {
                        localStream = await navigator.mediaDevices.getUserMedia({
                            video: isVideoCall ? { facingMode: "user" } : false,
                            audio: true
                        });
                        if(isVideoCall) {
                            const lVid = document.getElementById('localVideo');
                            lVid.srcObject = localStream;
                            lVid.muted = true;
                        }
                        call.answer(localStream);
                        handleStream(call);
                        const conn = peer.connect(meta.uid);
                        conn.on('open', () => { currentConn = conn; });
                    } catch(e) { alert("Error: " + e.message); endGlobalCall(true); }
                };

                window.rejectCall = () => {
                    document.getElementById('incomingPopup').classList.add('hidden');
                    document.getElementById('ringtonePlayer').pause();
                    const conn = peer.connect(meta.uid);
                    conn.on('open', () => { conn.send('END_CALL'); setTimeout(() => conn.close(), 500); });
                };
            });
        }
                // --- 1. MAKE CALL (Updated with Ringing & Status) ---
        window.makeCall = async (type) => {
            isVideoCall = (type === 'video');
            const friendUid = currentChatId.replace(currentUser.uid, "").replace("_", "");
            
            // UI Setup
            const fSnap = await getDoc(doc(db, "users", friendUid));
            const fData = fSnap.data();
            setupCallUI(isVideoCall, fData);
            
            // Status Update
            document.getElementById('callStatus').innerText = "CONNECTING...";
            document.getElementById('callStatus').className = "text-sm font-bold tracking-widest text-yellow-400 mb-2 animate-pulse";

            try {
                // Get Local Stream (Camera/Mic)
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: isVideoCall ? { facingMode: "user" } : false,
                    audio: true
                });

                if(isVideoCall) {
                    const lVid = document.getElementById('localVideo');
                    lVid.srcObject = localStream;
                    lVid.muted = true;
                }

                // Start Ringing Sound
                const rPlayer = document.getElementById('ringtonePlayer');
                rPlayer.currentTime = 0;
                rPlayer.play().catch(e => console.log("Audio play error:", e));

                // Change Status to Ringing
                setTimeout(() => {
                    document.getElementById('callStatus').innerText = "RINGING...";
                }, 1000);

                // Connect to Peer
                const conn = peer.connect(friendUid);
                conn.on('open', () => { currentConn = conn; });
                
                const call = peer.call(friendUid, localStream, {
                    metadata: { 
                        name: document.getElementById('profileName').innerText,
                        photo: document.getElementById('profileDp').src,
                        uid: currentUser.uid,
                        type: type
                    }
                });
                
                handleStream(call);

            } catch(e) { 
                alert("Permission Denied or Error: " + e.message); 
                endGlobalCall(true); 
            }
        };
        

                handleStream(call);
            } catch(e) { alert("Permission Denied"); endGlobalCall(true); }
        };

                // --- 2. HANDLE STREAM (Stop Ringing & Show Video) ---
        function handleStream(call) {
            currentCall = call;
            call.on('stream', (remoteStream) => {
                // Stop Ringing
                document.getElementById('ringtonePlayer').pause();
                
                // Update Status
                const status = document.getElementById('callStatus');
                status.innerText = "CONNECTED";
                status.className = "text-sm font-bold tracking-widest text-green-400 mb-2";
                
                // Start Timer
                startTimer();
                
                // Show Stream
                if(isVideoCall) {
                    const rVideo = document.getElementById('remoteVideo');
                    rVideo.srcObject = remoteStream;
                    rVideo.play();
                } else {
                    const rAudio = document.getElementById('remoteAudio');
                    rAudio.srcObject = remoteStream;
                    rAudio.play();
                }
            });
            call.on('close', () => endGlobalCall(false));
        }
        
        function setupCallUI(isVideo, userData) {
            document.getElementById('chatRoom').classList.add('hidden');
            document.getElementById('callScreen').classList.remove('hidden'); 
            document.getElementById('callUIUserName').innerText = userData.username || "Friend";
            document.getElementById('callUIUserImg').src = userData.photoURL;
            document.getElementById('callBg').src = userData.photoURL;

            if(isVideo) {
                document.getElementById('videoContainer').classList.remove('hidden');
                document.getElementById('voiceUI').classList.add('hidden');
                document.getElementById('btnCam').classList.remove('hidden');
                document.getElementById('btnVidToggle').innerHTML = '<i class="fa-solid fa-video"></i>';
            } else {
                document.getElementById('videoContainer').classList.add('hidden');
                document.getElementById('voiceUI').classList.remove('hidden');
                document.getElementById('btnCam').classList.add('hidden');
                document.getElementById('btnVidToggle').innerHTML = '<i class="fa-solid fa-phone"></i>';
            }
        }
                // --- 3. END CALL (With Sound Effect) ---
        window.endGlobalCall = (sendSignal = true) => {
            // Play End Sound
            const endSound = document.getElementById('endCallPlayer');
            if(endSound) endSound.play().catch(e => console.log(e));

            // Stop Ringing if still playing
            document.getElementById('ringtonePlayer').pause();

            if(sendSignal && currentConn && currentConn.open) { currentConn.send('END_CALL'); }
            if(currentCall) currentCall.close();
            if(localStream) localStream.getTracks().forEach(t => t.stop());
            
            // Hide UI
            setTimeout(() => {
                document.getElementById('callScreen').classList.add('hidden');
                document.getElementById('callTimer').classList.add('hidden');
            }, 500); // 0.5s delay to hear end sound

            clearInterval(callTimerInt);
            currentCall = null; currentConn = null; localStream = null;
        };

        function startTimer() {
            const t = document.getElementById('callTimer');
            t.classList.remove('hidden');
            let s = 0;
            clearInterval(callTimerInt);
            callTimerInt = setInterval(() => {
                s++;
                let m = Math.floor(s/60); let sc = s%60;
                t.innerText = `${m<10?'0'+m:m}:${sc<10?'0'+sc:sc}`;
            }, 1000);
        }

        // --- UTILS (Search, Love Mode, etc.) ---
                window.doSearch = async (val) => {
            const res = document.getElementById('searchResults');
            if(!val || val.length < 3) { 
                res.classList.add('hidden'); 
                return; 
            }
            res.classList.remove('hidden');
            res.innerHTML = '<div class="text-center p-2 text-xs">Searching...</div>';
            
            try {
                // Search query
                const q = query(collection(db, "users"), 
                    where("username_lower", ">=", val.toLowerCase()), 
                    where("username_lower", "<=", val.toLowerCase() + "\uf8ff")
                );
                
                onSnapshot(q, s => {
                    res.innerHTML = "";
                    if(s.empty) {
                        res.innerHTML = '<div class="text-center p-2 text-xs text-red-500">User not found</div>';
                        return;
                    }
                    
                    s.forEach(d => {
                        const u = d.data();
                        if(u.uid === currentUser.uid) return; // Manalni manam add cheskokunda
                        
                        const item = document.createElement('div');
                        item.className = "glass p-3 rounded-lg flex justify-between items-center cursor-pointer mb-2 hover:bg-white/40";
                        item.innerHTML = `
                            <div class="flex items-center gap-2">
                                <img src="${u.photoURL}" class="w-8 h-8 rounded-full border border-gray-300">
                                <span class="font-bold text-sm" style="color: var(--text-main);">${u.username}</span>
                            </div>
                            <i class="fa-solid fa-user-plus text-blue-500"></i>
                        `;
                        item.onclick = () => createChat(u.uid);
                        res.appendChild(item);
                    });
                });
            } catch(e) {
                console.error(e);
                res.innerHTML = '<div class="text-center p-2 text-xs text-red-500">Error searching</div>';
            }
        };
        
                window.createChat = async (uid) => {
            try {
                const chatId = [currentUser.uid, uid].sort().join("_");
                await setDoc(doc(db, "chats", chatId), {
                    participants: [currentUser.uid, uid], 
                    timestamp: serverTimestamp(), 
                    lastMessage: "👋 New Friend Added", 
                    lastSender: currentUser.uid,
                    isSeen: false,
                    isHidden: false
                }, {merge: true});
                
                document.getElementById('searchBar').value = "";
                document.getElementById('searchResults').classList.add('hidden');
                
                // Success Message
                alert("Friend Added Successfully! Check Chat List.");
                loadChats(); // Force refresh list
            } catch(e) {
                alert("Error adding friend: " + e.message);
            }
        };
        
        window.toggleLoveMode = async () => {
            if(isLoveMode) {
                isLoveMode = false;
                document.body.className = "theme-light";
                document.getElementById('heartBtn').classList.replace('fa-solid', 'fa-regular');
                document.getElementById('heartBtn').classList.remove('text-pink-500');
                loadChats();
            } else {
                const u = (await getDoc(doc(db, "users", currentUser.uid))).data();
                passAction = u.privatePassword ? "enter" : "set";
                document.getElementById('passwordModal').classList.remove('hidden');
                document.getElementById('passTitle').innerText = passAction === "enter" ? "Unlock Private Mode" : "Set Privacy Password";
                document.getElementById('privatePassInput').value = "";
            }
        };

        window.submitPassword = async () => {
            const val = document.getElementById('privatePassInput').value;
            const uRef = doc(db, "users", currentUser.uid);
            
            if(passAction === "set") {
                await updateDoc(uRef, { privatePassword: val });
                closePassModal();
                alert("Password Set! Try again.");
            } else {
                const u = (await getDoc(uRef)).data();
                if(u.privatePassword === val) {
                    isLoveMode = true;
                    document.body.className = "theme-love";
                    document.getElementById('heartBtn').classList.replace('fa-regular', 'fa-solid');
                    document.getElementById('heartBtn').classList.add('text-pink-500');
                    closePassModal();
                    loadChats();
                    createHearts();
                } else alert("Wrong Password!");
            }
        };

        function createHearts() {
            const con = document.getElementById('heartsContainer');
            if(!isLoveMode) { con.innerHTML = ""; return; }
            for(let i=0; i<3; i++) {
                const h = document.createElement('i');
                h.className = "fa-solid fa-heart heart";
                h.style.left = Math.random() * 100 + "%";
                h.style.animationDuration = (Math.random() * 3 + 4) + "s";
                h.style.fontSize = (Math.random() * 20 + 10) + "px";
                con.appendChild(h);
                setTimeout(() => h.remove(), 7000);
            }
            if(isLoveMode) setTimeout(createHearts, 800);
        }

        window.showTab = (id) => {
            document.getElementById('tab-chats').classList.add('hidden');
            document.getElementById('tab-profile').classList.add('hidden');
            document.getElementById('tab-'+id).classList.remove('hidden');
        };
                window.openScanner = () => {
            if(typeof Html5QrcodeScanner === 'undefined') {
                alert("Scanner not loaded. Check internet connection.");
                return;
            }
            document.getElementById('scannerModal').classList.remove('hidden');
            const scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            scanner.render(async txt => {
                scanner.clear();
                document.getElementById('scannerModal').classList.add('hidden');
                await createChat(txt);
            }, (err) => {
                // Scanning error ignore cheyochu
            });
        };
        
        window.closePassModal = () => document.getElementById('passwordModal').classList.add('hidden');
        window.togglePassVis = () => {
            const i = document.getElementById('privatePassInput');
            i.type = i.type === "password" ? "text" : "password";
        };
        window.openPasswordModal = () => { passAction = "set"; document.getElementById('passwordModal').classList.remove('hidden'); };
        window.forgotPassword = async () => {
            if(confirm("Reset Password?")) {
                await updateDoc(doc(db, "users", currentUser.uid), { privatePassword: null });
                alert("Reset. Set new one.");
                passAction = "set";
            }
        };
        window.toggleSpeaker = () => {}; 
        window.toggleMute = () => {
            if(localStream) {
                const track = localStream.getAudioTracks()[0];
                track.enabled = !track.enabled;
            }
        };
        window.toggleVideoMode = () => {
             if(localStream && isVideoCall) {
                const track = localStream.getVideoTracks()[0];
                track.enabled = !track.enabled;
             }
        };
        window.switchCamera = async () => {
            if(!isVideoCall || !localStream) return;
            localStream.getVideoTracks()[0].stop();
            isFrontCam = !isFrontCam;
            const newStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: isFrontCam ? "user" : "environment" },
                audio: true
            });
            document.getElementById('localVideo').srcObject = newStream;
            localStream = newStream;
            const sender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
            if(sender) sender.replaceTrack(newStream.getVideoTracks()[0]);
        };
            
    </script>
