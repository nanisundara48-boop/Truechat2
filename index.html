<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Chat - Login</title>
    <style>
        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Dark Theme Background */
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Hide cat when it goes off screen */
            color: #fff;
        }

        /* Glassmorphism Login Box */
        .login-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            width: 380px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
            letter-spacing: 2px;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }

        .input-group {
            margin-bottom: 30px;
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 10px 0;
            font-size: 16px;
            color: #fff;
            margin-bottom: 5px;
            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            outline: none;
            background: transparent;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-bottom: 2px solid #00f2fe;
        }

        .input-group label {
            position: absolute;
            top: 0;
            left: 0;
            padding: 10px 0;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            pointer-events: none;
            transition: 0.5s;
        }

        /* Input field animation */
        .input-group input:focus ~ label,
        .input-group input:valid ~ label {
            top: -25px;
            left: 0;
            color: #00f2fe;
            font-size: 13px;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            outline: none;
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            color: #111;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.4s;
            font-weight: bold;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        button:hover {
            box-shadow: 0 0 20px #00f2fe;
            transform: scale(1.02);
        }

        /* --- CAT ANIMATION SECTION --- */
        .cat-container {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            pointer-events: none; /* Clicks will pass through the cat */
            z-index: 1; /* Behind the login box */
        }

        .cat {
            position: absolute;
            font-size: 60px; /* Cat size */
            /* Walk prowl animation details: Name, Time, Style, Loop */
            animation: prowlAround 20s linear infinite;
        }

        /* The magic logic for attu-ittu & paiki-kindhaki */
        @keyframes prowlAround {
            /* Start off-screen left */
            0% { left: -15%; transform: scaleX(1) translateY(0); }
            
            /* Walking Right with bobbing (paiki-kindhaki) effect */
            4% { transform: scaleX(1) translateY(-15px); }
            8% { transform: scaleX(1) translateY(0); }
            12% { transform: scaleX(1) translateY(-15px); }
            16% { transform: scaleX(1) translateY(0); }
            20% { transform: scaleX(1) translateY(-15px); }
            24% { transform: scaleX(1) translateY(0); }
            28% { transform: scaleX(1) translateY(-15px); }
            32% { transform: scaleX(1) translateY(0); }
            36% { transform: scaleX(1) translateY(-15px); }
            40% { transform: scaleX(1) translateY(0); }
            44% { transform: scaleX(1) translateY(-15px); }
            
            /* Reached Right edge, turning around */
            48% { left: 110%; transform: scaleX(1) translateY(0); }
            50% { left: 110%; transform: scaleX(-1) translateY(0); } /* Flip horizontally */
            
            /* Walking Left with bobbing effect */
            54% { transform: scaleX(-1) translateY(-15px); }
            58% { transform: scaleX(-1) translateY(0); }
            62% { transform: scaleX(-1) translateY(-15px); }
            66% { transform: scaleX(-1) translateY(0); }
            70% { transform: scaleX(-1) translateY(-15px); }
            74% { transform: scaleX(-1) translateY(0); }
            78% { transform: scaleX(-1) translateY(-15px); }
            82% { transform: scaleX(-1) translateY(0); }
            86% { transform: scaleX(-1) translateY(-15px); }
            90% { transform: scaleX(-1) translateY(0); }
            94% { transform: scaleX(-1) translateY(-15px); }
            
            /* Reached Left edge, turning around to start over */
            98% { left: -15%; transform: scaleX(-1) translateY(0); }
            100% { left: -15%; transform: scaleX(1) translateY(0); }
        }
    </style>
</head>
<body>

    <div class="cat-container">
        <div class="cat">🐈‍⬛</div> 
    </div>

    <div class="login-box">
        <h2>Dark Chat</h2>
        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="username" required>
                <label>Username</label>
            </div>
            <div class="input-group">
                <input type="password" id="password" required>
                <label>Password</label>
            </div>
            <button type="submit">Enter Chat</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevents page reload
            
            const user = document.getElementById('username').value;
            // Ee place lo nuvvu nee Firebase Authentication code add chesukovachu
            console.log("Authentication initiated for user:", user);
            alert("Welcome to Dark Chat, " + user + "!");
        });
    </script>
</body>
</html>
